function renderAnalysisPanel(r, opts){
  const compact = !!(opts && opts.compact);
  if(!r){
    return `
    <section id="analysis-panel" class="rounded-2xl border border-dashed border-outline-variant bg-surface-container-lowest px-6 py-8">
      <p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Result</p>
      <h3 class="text-xl font-bold text-on-surface mt-2">No analysis yet</h3>
      <p class="text-sm text-on-surface-variant mt-2">Upload a scan to see malignant / benign, scores, and the heatmap here.</p>
      ${S.scanLoading?`<p class="mt-3 text-sm font-bold text-primary">Analyzing ${S.scanUploadProgress?.done||0}/${S.scanUploadProgress?.total||0}…</p>`:''}
    </section>`;
  }
  const mal = r.prediction==='malignant';
  const prob = Number(r.probability);
  const risk = Number.isFinite(prob) ? riskFromProbability(prob) : (r.risk_level || 'unknown');
  const contrib = [
    ['CBIS-DDSM (Mammography)', r.shap_cbis, 'cbis'],
    ['RSNA (Mammography)', r.shap_rsna, 'rsna'],
    ['BUSI (Ultrasound)', r.shap_us, 'busi'],
    ['Duke MRI (MRI)', r.shap_mri, 'mri'],
  ];
  return `
  <section id="analysis-panel" class="rounded-2xl border ${mal?'border-error/40 bg-error-container/40':'border-tertiary/30 bg-[#e7f6ee]'} ${compact?'p-4':'p-5'} h-full overflow-y-auto">
    ${S.scanLoading?`<p class="mb-3 text-sm font-bold text-primary">Updating… ${S.scanUploadProgress?.done||0}/${S.scanUploadProgress?.total||0}</p>`:''}
    <div class="grid grid-cols-1 ${compact?'gap-3':'md:grid-cols-2 gap-4'} items-start">
      <div class="min-w-0 space-y-3">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Fusion V3 result</p>
          <h3 class="${compact?'text-2xl':'text-3xl'} font-extrabold mt-0.5 ${mal?'text-error':'text-tertiary'}">${mal?'Malignant':'Benign'}</h3>
          <p class="text-xs text-on-surface mt-1.5 leading-snug">${mal
            ? 'Pattern linked with cancer — a clinician should review this image.'
            : 'No cancer pattern found. Screening aid only, not a diagnosis.'}</p>
          <p class="text-[11px] text-on-surface-variant mt-2 break-words leading-snug">${r.filename||'—'} · ${r.model_used||'Fusion V3 (Mammography + Ultrasound + MRI)'}</p>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div class="bg-white/85 rounded-xl px-2 py-2.5 text-center">
            <div class="text-lg font-extrabold text-on-surface">${r.probability}%</div>
            <div class="text-[10px] font-bold text-on-surface-variant leading-tight mt-0.5">Probability</div>
          </div>
          <div class="bg-white/85 rounded-xl px-2 py-2.5 text-center">
            <div class="text-lg font-extrabold text-on-surface">${r.confidence}%</div>
            <div class="text-[10px] font-bold text-on-surface-variant leading-tight mt-0.5">Confidence</div>
          </div>
          <div class="bg-white/85 rounded-xl px-2 py-2.5 text-center">
            <div class="text-lg font-extrabold text-on-surface">±${r.uncertainty}%</div>
            <div class="text-[10px] font-bold text-on-surface-variant leading-tight mt-0.5">Uncertainty</div>
          </div>
        </div>
        ${renderRiskometer(risk, Number.isFinite(prob) ? prob : NaN)}
        <div>
          <p class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-1.5">Dataset contribution</p>
          <div class="grid grid-cols-1 gap-1.5">
            ${contrib.map(([n,v,id])=>`
            <div class="bg-white/70 rounded-lg px-2.5 py-2 flex items-center justify-between gap-3">
              <span class="text-[11px] font-semibold text-on-surface leading-snug break-words min-w-0">${n}</span>
              <span class="text-xs font-extrabold text-on-surface flex-shrink-0">${encoderShareLabel(r,id,v)}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div>
        ${r.heatmap
          ? `<img src="data:image/png;base64,${r.heatmap}" alt="Grad-CAM heatmap" class="w-full rounded-xl border border-black/5 ${compact?'max-h-[280px] object-contain bg-white':''}"/>
             <p class="text-[10px] text-on-surface-variant mt-1.5">Warm colors drove the score.</p>`
          : `<div class="rounded-xl bg-white/70 border border-black/5 min-h-[140px] flex items-center justify-center text-xs text-on-surface-variant">No heatmap</div>`}
      </div>
    </div>
  </section>`;
}

function renderScanUploadBlock(compact){
  return `
  <div class="${compact?'dash-panel !py-3':'bg-surface-container-lowest rounded-2xl p-5 shadow-sm border border-outline-variant/10'}">
    ${compact?`
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <p class="text-sm font-extrabold text-on-surface">New scan</p>
      <button type="button" onclick="set({scanComposeOpen:false,_files:null,scanSelectedLabel:'',scanError:null})" class="text-xs font-bold text-on-surface-variant hover:text-primary">Cancel</button>
    </div>`:`
    <p class="text-sm font-extrabold text-on-surface mb-2">Upload a scan to analyze</p>`}
    <div id="upload-zone" class="${compact?'dash-upload px-4 py-4':'border-2 border-dashed border-outline-variant rounded-xl p-8 hover:border-primary hover:bg-surface-container-low'} text-center cursor-pointer transition-all">
      <span class="material-symbols-outlined text-primary ${compact?'text-3xl':'text-5xl mb-2'} block">cloud_upload</span>
      <p class="font-bold text-on-surface ${compact?'text-sm mt-1':'text-base mb-1'}">Drop scans here or click to browse</p>
      <p class="text-[11px] text-on-surface-variant">PNG · JPG · DICOM · multi-select OK</p>
      <input type="file" id="file-input" accept=".png,.jpg,.jpeg,.dcm" multiple class="hidden"/>

    ${S.scanError?`<div class="mt-1 text-[11px] font-semibold text-error text-center">${S.scanError}</div>`:''}
    <button type="button" id="upload-btn" class="w-full bloom-gradient ripple-btn text-on-primary ${compact?'py-2.5':'py-3'} rounded-xl text-sm font-bold mt-2 hover:opacity-90 transition-all ${S.scanLoading?'opacity-75 cursor-wait':''}" ${S.scanLoading?'disabled':''}>
      ${S.scanLoading?`Analyzing ${S.scanUploadProgress?.done||0}/${S.scanUploadProgress?.total||0}…`:'Analyze with AI'}
    </button>
    ${S.error?`<div class="mt-2 bg-error-container text-error px-3 py-2 rounded-lg text-xs">${S.error}</div>`:''}

// ── Scan upload page ──────────────────────────────────
function renderScan(){
  const r = S.scanResult;
  const results = S.scanResults || (r ? [r] : []);
  const active  = typeof S.scanActiveIdx==='number' ? S.scanActiveIdx : 0;
  const hasMany = results.length > 1;
  const hasResult = !!(results[active]||r);
  const composing = !!S.scanComposeOpen;
  const showUpload = !hasResult || composing;
  // Keep chat beside the result — no scrolling past a long upload card first
  if(hasResult && !S._scanChatBootstrapped){
    S._scanChatBootstrapped = true;
    queueMicrotask(()=>openChatWithGreeting(true));
  }
  if(!hasResult) S._scanChatBootstrapped = false;

  return `
  <div class="flex flex-col gap-3 ${hasResult?'h-full min-h-0':''}" style="${hasResult?'height:calc(100vh - 7.5rem)':''}">
    <div class="flex flex-wrap items-center justify-between gap-2 flex-shrink-0">
      <div class="flex gap-2 overflow-x-auto min-w-0 flex-1">
        ${hasMany?results.map((it,i)=>`
        <button type="button" onclick="setActiveScan(${i})" class="px-3 py-1.5 rounded-xl border text-left flex-shrink-0 ${i===active?'border-primary bg-primary/5':'border-outline-variant/30 bg-white'}">
          <div class="text-xs font-bold text-on-surface max-w-[160px] truncate">${it.filename||('Scan '+(i+1))}</div>
          <div class="text-[10px] mt-0.5 ${it.prediction==='malignant'?'text-error':'text-tertiary'}">${it.prediction||'—'} · ${it.probability??'—'}%</div>
        </button>`).join(''):`
        <p class="text-sm text-on-surface-variant font-medium">${hasResult?'Latest analysis':'Upload a scan to begin'}</p>`}
      </div>
      ${hasResult && !composing?`
      <button type="button" id="scan-new-btn" class="bloom-gradient ripple-btn text-on-primary px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1.5 flex-shrink-0 shadow-sm">
        <span class="material-symbols-outlined text-lg" style="font-variation-settings:'FILL' 1">add_a_photo</span>
        Analyze a new scan
      </button>`:''}
    </div>

    ${showUpload?renderScanUploadBlock(hasResult):''}

    ${hasResult?`
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 flex-1 min-h-0">
      <div class="min-h-0 overflow-hidden">${renderAnalysisPanel(results[active]||r, {compact:true})}</div>
      <div class="min-h-0 overflow-hidden flex flex-col" style="min-height:320px">${renderChat({embedded:true})}</div>
    </div>`:''}
  </div>`;
}

// ── Schedule page ─────────────────────────────────────
function renderSchedule(){
  const appts = S.data.schedule || [];
  if(!S.data.scheduleLoaded){ loadSchedule(); return `<div class="flex flex-col items-center py-20 gap-4 text-on-surface-variant"><span class="material-symbols-outlined text-5xl animate-spin text-primary">refresh</span>Loading schedule…</div>`; }

  const today = new Date().toISOString().split('T')[0];

  // Split into active vs history
  const active  = appts.filter(a => a.status==='scheduled' || a.status==='in_progress' || a.status==='in-progress');
  const history = appts.filter(a => a.status==='completed' || a.status==='cancelled');

  // Stats
  const todayActive = active.filter(a=>a.date===today).length;
  const upcoming    = active.filter(a=>a.date>today).length;
  const completed   = appts.filter(a=>a.status==='completed').length;

  // History filter
  const hf = S.apptHistoryFilter || 'all';
  const historyFiltered = hf==='all' ? history
    : history.filter(a => a.status===hf || a.status===hf.replace('_','-'));

  const statusBadge = s =>
    s==='completed'    ? 'bg-surface-container text-tertiary' :
    s==='cancelled'    ? 'bg-error-container text-error' :
    s==='in_progress'||s==='in-progress' ? 'bg-amber-100 text-amber-700' :
                         'bg-secondary-container text-on-secondary-container';

  const statusLabel = s =>
    s==='in_progress'||s==='in-progress' ? 'In Progress' :
    s.charAt(0).toUpperCase()+s.slice(1);

  function apptCard(a, allowStatusChange){
    const isToday = a.date===today;
    const dateObj = new Date(a.date+'T12:00:00');
    return `
    <div class="flex items-center gap-4 p-4 rounded-xl bg-surface hover:bg-surface-container-low transition-all ${isToday&&allowStatusChange?'border-l-4 border-primary':''}">
      <div class="w-12 h-12 rounded-xl flex-shrink-0 flex flex-col items-center justify-center text-center
        ${isToday&&allowStatusChange?'bg-primary text-on-primary':'bg-surface-container-high text-on-surface-variant'}">
        <span class="text-[10px] font-bold uppercase">${dateObj.toLocaleString('default',{month:'short'})}</span>
        <span class="text-lg font-bold leading-none">${a.date.split('-')[2]}</span>
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="font-bold text-on-surface text-sm">${a.patient_name}</h4>
        <p class="text-xs text-on-surface-variant">${a.time} · ${a.type}${a.doctor?' · '+a.doctor:''}</p>
        ${a.notes?`<p class="text-xs text-on-surface-variant/60 mt-0.5">${a.notes}</p>`:''}
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        ${allowStatusChange?`
        <select onchange="updateApptStatus(${a.id},this.value)"
          class="text-xs px-2 py-1.5 rounded-lg border border-outline-variant/20 bg-surface-container text-on-surface font-semibold cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary/20">
          <option value="scheduled"    ${a.status==='scheduled'  ?'selected':''}>Scheduled</option>
          <option value="in_progress"  ${a.status==='in_progress'||a.status==='in-progress'?'selected':''}>In Progress</option>
          <option value="completed"    ${a.status==='completed'  ?'selected':''}>Completed</option>
          <option value="cancelled"    ${a.status==='cancelled'  ?'selected':''}>Cancelled</option>
        </select>`:`
        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${statusBadge(a.status)}">${statusLabel(a.status)}</span>`}
        <button onclick="deleteAppointment(${a.id},'${a.status}')" title="Delete"
          class="p-1.5 rounded-lg hover:bg-error-container text-on-surface-variant hover:text-error transition-all">
          <span class="material-symbols-outlined text-base">delete</span>
        </button>
      </div>
    </div>`;
  }

  return `
  <!-- Header -->
  <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
    <div>
      <h2 class="text-2xl font-bold text-on-surface">Scheduling</h2>
      <p class="text-on-surface-variant mt-1">Manage patient appointments · ${appts.length} total</p>
    </div>
    <button id="add-appt-btn" class="bloom-gradient ripple-btn text-on-primary px-5 py-3 rounded-lg font-bold flex items-center gap-2">
      <span class="material-symbols-outlined">add</span>Add Appointment
    </button>
  </div>

  <!-- Add form -->
  ${S.data.showApptForm?`
  <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-primary/20 mb-6">
    <h3 class="font-bold text-on-surface mb-6 flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">event_available</span>New Appointment
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-2">
        <label class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Patient Name *</label>
        <input id="appt-patient" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface" placeholder="Full name"/>
      </div>
      <div class="space-y-2">
        <label class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Date *</label>
        <input id="appt-date" type="date" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface" value="${today}"/>
      </div>
      <div class="space-y-2">
        <label class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Time *</label>
        <input id="appt-time" type="time" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface" value="09:00"/>
      </div>
      <div class="space-y-2">
        <label class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Type</label>
        <select id="appt-type" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface">
          <option>Mammography</option><option>Ultrasound</option><option>Breast MRI</option>
          <option>CT Scan</option><option>Follow-up</option><option>Consultation</option>
        </select>
      </div>
      <div class="space-y-2">
        <label class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Doctor</label>
        <input id="appt-doctor" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface" placeholder="Dr. Name"/>
      </div>
      <div class="space-y-2">
        <label class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Notes</label>
        <input id="appt-notes" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface" placeholder="Optional notes"/>
      </div>
    </div>
    <div class="flex gap-3 mt-6">
      <button id="appt-submit" class="bloom-gradient ripple-btn text-on-primary px-6 py-3 rounded-lg font-bold">Schedule Appointment</button>
      <button id="appt-cancel" class="bg-surface-container text-on-surface-variant px-6 py-3 rounded-lg font-bold hover:bg-surface-container-high">Cancel</button>
    </div>
  </div>`:''}

  <!-- Stats -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
    <div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/10 shadow-sm">
      <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Today's Active</p>
      <span class="text-3xl font-bold text-primary">${todayActive}</span>
    </div>
    <div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/10 shadow-sm">
      <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Upcoming</p>
      <span class="text-3xl font-bold text-on-surface">${upcoming}</span>
    </div>
    <div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant/10 shadow-sm">
      <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">Completed</p>
      <span class="text-3xl font-bold text-tertiary">${completed}</span>
    </div>
  </div>

  <!-- ── ACTIVE APPOINTMENTS ── -->
  <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-outline-variant/10 mb-6">
    <div class="flex items-center gap-3 mb-5">
      <span class="material-symbols-outlined text-primary">event</span>
      <h3 class="font-bold text-on-surface text-lg">Active Appointments</h3>
      <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-primary/10 text-primary">${active.length}</span>
    </div>
    ${active.length===0?`
    <div class="text-center py-10 text-on-surface-variant">
      <span class="material-symbols-outlined text-4xl block mb-3 text-primary-container">event_available</span>
      <p class="font-medium text-sm">No active appointments</p>
      <p class="text-xs mt-1">Click "Add Appointment" to schedule one.</p>
    </div>`:`
    <div class="space-y-3">
      ${active.map(a=>apptCard(a, true)).join('')}
    </div>`}
  </div>

  <!-- ── APPOINTMENT HISTORY ── -->
  <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-outline-variant/10">
    <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-on-surface-variant">history</span>
        <h3 class="font-bold text-on-surface text-lg">Appointment History</h3>
        <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant">${history.length}</span>
      </div>
      <!-- Filter tabs -->
      <div class="flex gap-1.5 flex-wrap">
        ${[
          {key:'all',       label:'All',        count: history.length},
          {key:'scheduled', label:'Scheduled',   count: history.filter(a=>a.status==='scheduled').length},
          {key:'in_progress',label:'In Progress',count: history.filter(a=>a.status==='in_progress'||a.status==='in-progress').length},
          {key:'completed', label:'Completed',   count: history.filter(a=>a.status==='completed').length},
          {key:'cancelled', label:'Cancelled',   count: history.filter(a=>a.status==='cancelled').length},
        ].map(f=>`
        <button onclick="set({apptHistoryFilter:'${f.key}'})"
          class="px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1
            ${hf===f.key?'bg-secondary-container text-on-secondary-container':'hover:bg-surface-container-high text-on-surface-variant'}">
          ${f.label}
          ${f.count>0?`<span class="text-[9px] font-bold">${f.count}</span>`:''}
        </button>`).join('')}
      </div>
    </div>
    ${history.length===0?`
    <div class="text-center py-10 text-on-surface-variant">
      <span class="material-symbols-outlined text-4xl block mb-3 text-primary-container">event_note</span>
      <p class="font-medium text-sm">No appointment history yet</p>
      <p class="text-xs mt-1">Completed or cancelled appointments will appear here.</p>
    </div>`:`
    ${historyFiltered.length===0?`
    <div class="text-center py-8 text-on-surface-variant text-sm">No appointments match this filter.</div>`:`
    <div class="space-y-3">
      ${historyFiltered.map(a=>apptCard(a, false)).join('')}
    </div>`}`}
  </div>`;
}

// ── Admin: User Detail Page ───────────────────────────
function renderUserDetail(){
  const d = S.adminUserDetail;
  const riskColor = {high:'bg-error-container text-error', medium:'bg-amber-100 text-amber-700', low:'bg-green-100 text-green-700', unknown:'bg-surface-container text-on-surface-variant'};
  const roleColor = {radiologist:'bg-secondary-container text-on-secondary-container', patient:'bg-surface-container text-tertiary', clinic:'bg-amber-100 text-amber-700', admin:'bg-error-container text-error'};
  const pct = v => {
    if(v==null || v==='' || Number.isNaN(Number(v))) return '—';
    let n = Number(v);
    // Accept either 0..1 or 0..100 (and tolerate legacy 983 => 98.3)
    if(n <= 1) n = n * 100;
    while(n > 100) n = n / 10;
    if(n < 0) n = 0;
    if(n > 100) n = 100;
    const s = (Math.round(n * 10) / 10).toFixed(n % 1 === 0 ? 0 : 1);
    return s + '%';
  };

  if(!d){
    return `
    <div class="flex flex-col items-center py-24 gap-4 text-on-surface-variant">
      <span class="material-symbols-outlined text-5xl animate-spin text-primary">refresh</span>
      <p>Loading user profile…</p>
    </div>`;
  }

  const u     = d.user;
  const scans = d.scans || [];
  const reqs  = d.role_requests || [];
  const st    = d.stats || {};
  const initials = u.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  const statCards = [
    {icon:'biotech',      label:'Total Scans',  val: st.total_scans||0,   color:'text-primary'},
    {icon:'warning',      label:'High Risk',    val: st.high_risk||0,     color:'text-error'},
    {icon:'analytics',    label:'Malignant',    val: st.malignant||0,     color:'text-amber-600'},
    {icon:'check_circle', label:'Benign',       val: st.benign||0,        color:'text-green-600'},
    {icon:'chat',         label:'Scan Chats',   val: st.chat_msgs||0,     color:'text-secondary'},
    {icon:'smart_toy',    label:'AI Messages',  val: st.ai_chats||0,      color:'text-tertiary'},
  ];

  return `
  <!-- Back bar -->
  <div class="flex items-center gap-3 mb-6 flex-wrap">
    <button type="button" onclick="navTo('${(S.userDetailReturn||'users')}')" class="flex items-center gap-2 text-sm font-bold text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      ${(S.userDetailReturn||'users')==='admin-logs' ? 'Back to Activity Logs' : 'Back to User Management'}
    </button>
    <span class="text-on-surface-variant/40">·</span>
    <span class="text-sm text-on-surface-variant">${u.name}</span>
  </div>

  <!-- Profile header card -->
  <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/10 p-6 mb-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5">
      <div class="w-16 h-16 rounded-full ${roleColor[u.role]||'bg-surface-container text-on-surface'} flex items-center justify-center font-black text-2xl flex-shrink-0">
        ${initials}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap items-center gap-3 mb-1">
          <h2 class="text-xl font-black text-on-surface">${u.name}</h2>
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase ${roleColor[u.role]||''}">${u.role}</span>
        </div>
        <p class="text-sm text-on-surface-variant">${u.email}</p>
        <p class="text-xs text-on-surface-variant/60 mt-1">Member since ${fmtDate(u.created)}</p>
      </div>
      <div class="flex gap-2 flex-shrink-0">
        <button onclick="exportUserPDF()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-primary text-on-primary text-sm font-bold hover:bg-primary/90 shadow transition-all">
          <span class="material-symbols-outlined text-base">picture_as_pdf</span>
          Export PDF
        </button>
      </div>
    </div>
  </div>

  <!-- Stats row -->
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
    ${statCards.map(s=>`
    <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/10 p-4 text-center">
      <span class="material-symbols-outlined text-2xl ${s.color} block mb-1">${s.icon}</span>
      <div class="text-2xl font-black text-on-surface">${s.val}</div>
      <div class="text-[10px] text-on-surface-variant uppercase tracking-wide mt-0.5">${s.label}</div>
    </div>`).join('')}
  </div>

  <!-- Scan History -->
  <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/10 overflow-hidden mb-6">
    <div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/10">
      <h3 class="font-bold text-on-surface flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-xl">biotech</span>
        Scan History
        <span class="ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary/10 text-primary">${scans.length}</span>
      </h3>
    </div>
    ${scans.length===0?`
    <div class="text-center py-10 text-on-surface-variant">
      <span class="material-symbols-outlined text-4xl block mb-2 text-primary-container">image_not_supported</span>
      No scans yet.
    </div>`:`
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-[10px] uppercase tracking-widest text-on-surface-variant border-b border-outline-variant/10 bg-surface-container-low">
            <th class="px-6 py-3 text-left font-bold">#</th>
            <th class="px-4 py-3 text-left font-bold">Scan / Label</th>
            <th class="px-4 py-3 text-left font-bold">Date</th>
            <th class="px-4 py-3 text-left font-bold">Prediction</th>
            <th class="px-4 py-3 text-left font-bold">Probability</th>
            <th class="px-4 py-3 text-left font-bold">Risk</th>
            <th class="px-4 py-3 text-left font-bold">Confidence</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-outline-variant/10">
          ${scans.map((sc,i)=>`
          <tr class="hover:bg-surface-container-low transition-all">
            <td class="px-6 py-3 text-on-surface-variant text-xs">${i+1}</td>
            <td class="px-4 py-3">
              <div class="font-medium text-on-surface text-xs max-w-[180px] truncate">${sc.label||sc.filename||'Unnamed'}</div>
              ${sc.modality?`<div class="text-[10px] text-on-surface-variant uppercase">${sc.modality}</div>`:''}
            </td>
            <td class="px-4 py-3 text-xs text-on-surface-variant whitespace-nowrap">${fmtDate(sc.created)}</td>
            <td class="px-4 py-3">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${sc.prediction==='malignant'?'bg-error-container text-error':'bg-green-100 text-green-700'}">${sc.prediction||'—'}</span>

            </td>
            <td class="px-4 py-3 font-mono text-xs text-on-surface">${pct(sc.confidence)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}

  ${reqs.length>0?`

    <div class="flex items-center px-6 py-4 border-b border-outline-variant/10">

      ${reqs.map(r=>{
        const sc = {pending:'bg-amber-100 text-amber-700', approved:'bg-green-100 text-green-700', rejected:'bg-error-container text-error'};
        return `
        <div class="px-6 py-4 flex flex-wrap items-start gap-4">

function renderRoleRequests(){

          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary/10 text-primary uppercase">${r.requested_role}</span>
          <span class="text-xs text-on-surface-variant/60 ml-1">${timeAgo(r.created)}</span>
        </div>
        ${r.reason?`<p class="text-xs text-on-surface-variant mt-1 italic">"${r.reason}"</p>`:''}
        ${r.admin_notes?`<p class="text-xs text-on-surface-variant/70 mt-1">Admin note: ${r.admin_notes}</p>`:''}
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">

  return `
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h2 class="text-2xl font-bold text-on-surface">Role Requests</h2>

      <span class="material-symbols-outlined text-lg">refresh</span>Refresh

  </div>

  ${pending.length>0?`
  <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-amber-200 overflow-hidden mb-6">
    <div class="px-6 py-4 border-b border-amber-100 flex items-center gap-2">

  `<div class="bg-surface-container-lowest rounded-2xl p-10 text-center border border-outline-variant/10 mb-6">

  </div>`}

    <div class="px-6 py-4 border-b border-outline-variant/10">

    'What does my result mean?',
    'Should I be worried?',
    'What should I do next?',
    'Is the AI accurate?',

      </div>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-2.5">

    ${dashMetric('Probability', hasProb?`${Math.round(prob)}%`:'—', {icon:'percent', tone:'primary'})}
    ${dashMetric('Confidence', sc.confidence!=null?`${sc.confidence}%`:'—', {icon:'verified_user', tone:'muted'})}
    ${dashMetric('Risk', (risk||'—').toUpperCase(), {icon:'monitor_heart', tone:riskTone})}

        <div class="flex items-start gap-3">
          <div class="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 ${pred?'bg-error text-white':'bg-tertiary text-white'}">

          </div>

      ${renderRiskometer(risk, hasProb ? prob : NaN)}

      ${contrib.length?`
      <div class="dash-panel">
        <p class="text-[10px] font-extrabold uppercase tracking-wider text-on-surface-variant mb-3">Dataset contribution</p>
        <div class="space-y-2.5">

        <div class="rounded-xl overflow-hidden border border-outline-variant/15 bg-white">
          <img src="data:image/png;base64,${sc.heatmap}" alt="Grad-CAM Heatmap" class="w-full"/>

function _dcGroupSessions(sessions){
  const now   = new Date();
  const todayStr = now.toDateString();
  const yest  = new Date(now-86400000).toDateString();
  const w7    = new Date(now-7*86400000);
  const w30   = new Date(now-30*86400000);
  const groups = {};
  const order  = ['Today','Yesterday','Previous 7 Days','Previous 30 Days','Older'];
  sessions.forEach(s=>{
    const d = new Date(s.updated||s.created||'');
    let g;
    if(d.toDateString()===todayStr)  g='Today';
    else if(d.toDateString()===yest) g='Yesterday';
    else if(d>w7)  g='Previous 7 Days';
    else if(d>w30) g='Previous 30 Days';
    else g='Older';
    if(!groups[g]) groups[g]=[];
    groups[g].push(s);
  });
  return order.filter(k=>groups[k]).map(k=>({label:k,items:groups[k]}));
}

// ── bind() — wire up all event listeners ──────────────
function bind(){
  // ── Enter animation only when navigating to a new page ──────────────
  const content = document.querySelector('.p-8.max-w-screen-2xl');
  if(content){
    const animKey = S.view + '|' + S.page;
    if(content.dataset.enterKey !== animKey){
      content.dataset.enterKey = animKey;
      content.classList.remove('page-enter');
      // Force reflow so animation can replay on real navigations only
      void content.offsetWidth;
      content.classList.add('page-enter');
    }
  }

  // ── Landing ──────────────────────────────────────
  document.getElementById('goto-login')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('goto-register-nav')?.addEventListener('click',()=>set({view:'register',error:null}));
  document.getElementById('cta-integrate')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('cta-explore')?.addEventListener('click',()=>{
    document.getElementById('sec-features')?.scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('cta-signin')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('get-started')?.addEventListener('click',()=>{
    const email = document.getElementById('cta-email')?.value?.trim();
    if(email){ set({view:'register',error:null}); }
    else{ set({view:'login',error:null}); }
  });
  document.getElementById('lnk-about')?.addEventListener('click',()=>{
    document.getElementById('sec-features')?.scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('lnk-diag')?.addEventListener('click',()=>{
    document.getElementById('sec-hero')?.scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('lnk-contact')?.addEventListener('click',()=>{
    document.getElementById('sec-contact')?.scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('methodology-btn')?.addEventListener('click',()=>{
    document.getElementById('sec-methodology')?.scrollIntoView({behavior:'smooth'});

  // Footer links on landing
  const privacyText = `<p>Scanova collects only the data needed to provide AI diagnostic services: account information and uploaded scan images. Images are processed locally on our secure server and are never shared with third parties. You can request deletion of your data at any time.</p>`;

  const hipaaText   = `<p>Scanova implements HIPAA-aligned safeguards including: encrypted JWT authentication, bcrypt password hashing, role-based access control, and audit logging. All patient data is stored in an access-controlled SQLite database. No PHI leaves the server.</p>`;
  const contactText = `<div class="space-y-2"><p>For support, questions, or data requests:</p><p><strong>Email:</strong> support@scanova.ai</p><p><strong>Technical Issues:</strong> admin@scanova.com</p><p class="text-xs text-on-surface-variant/60 mt-4">This is a research prototype — contact your system administrator for institutional access.</p></div>`;
  document.getElementById('footer-privacy')?.addEventListener('click',()=>showModal('Privacy Policy',privacyText));
  document.getElementById('footer-terms')?.addEventListener('click',()=>showModal('Terms of Service',termsText));
  document.getElementById('footer-hipaa')?.addEventListener('click',()=>showModal('HIPAA Compliance',hipaaText));
  document.getElementById('footer-contact')?.addEventListener('click',()=>showModal('Contact Us',contactText));

  // ── Login ────────────────────────────────────────
  document.getElementById('login-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    login(document.getElementById('l-email').value, document.getElementById('l-pw').value);
  });
  document.getElementById('toggle-pw')?.addEventListener('click',()=>{
    const i=document.getElementById('l-pw');
    i.type = i.type==='password' ? 'text' : 'password';
    i.nextElementSibling?.querySelector('.material-symbols-outlined')?.setAttribute('data-icon',i.type==='password'?'visibility':'visibility_off');
  });
  document.getElementById('forgot-pw')?.addEventListener('click',()=>{
    showModal('Forgot Password',
      `<p>To reset your password, please contact your system administrator with your registered email address.</p>
      <p class="mt-3 text-xs text-on-surface-variant/70">Admin contact: <strong>admin@scanova.com</strong></p>`
    );
  });
  document.getElementById('goto-register')?.addEventListener('click',()=>set({view:'register',error:null}));
  document.getElementById('login-privacy')?.addEventListener('click',()=>showModal('Privacy Policy',privacyText));
  document.getElementById('login-hipaa')?.addEventListener('click',()=>showModal('HIPAA Compliance',hipaaText));
  document.getElementById('login-help')?.addEventListener('click',()=>showModal('Need Help?',`
    <div class="space-y-3">
      <p><strong>Signing In:</strong> Use the email and password you registered with. Your role (radiologist, patient, clinic, admin) determines your dashboard.</p>
      <p><strong>Forgotten Password:</strong> Contact your system administrator to reset.</p>
      <p><strong>New Account:</strong> Click "Create an account" on the login page to register.</p>
      <p><strong>Technical Issues:</strong> Contact <strong>admin@scanova.com</strong></p>
    </div>
  `));
  // ── Register ──────────────────────────────────────
  document.getElementById('register-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const enableMfa = !!document.getElementById('r-enable-mfa')?.checked;
    register(
      document.getElementById('r-name').value,
      document.getElementById('r-email').value,
      document.getElementById('r-pw').value,
      'patient',
      enableMfa
    );
  });
  document.getElementById('goto-login2')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('back-to-home-login')?.addEventListener('click',()=>set({view:'landing',error:null}));
  document.getElementById('back-to-home-register')?.addEventListener('click',()=>set({view:'landing',error:null}));

  // ── App shell ─────────────────────────────────────
  document.getElementById('logout-btn')?.addEventListener('click',logout);
  document.getElementById('settings-logout')?.addEventListener('click',logout);
  document.getElementById('help-btn')?.addEventListener('click',()=>{
    showModal('Help Center',`
      <div class="space-y-4">
        <div><strong class="block mb-1">Uploading a Scan</strong><p>Go to "Diagnostic Lens" or "Upload Scan", drop your mammogram (PNG/JPG/DICOM) and click "Analyze with AI". The model processes in seconds.</p></div>
        <div><strong class="block mb-1">Understanding Results</strong><p>Probability = likelihood of malignancy. Confidence = model certainty. Uncertainty = variance across 15 MC Dropout passes. The Grad-CAM heatmap shows which regions drove the prediction.</p></div>
        <div><strong class="block mb-1">Managing Patients</strong><p>Clinic and Admin users can add/remove patients via the Patients page.</p></div>
        <div><strong class="block mb-1">Scheduling</strong><p>Radiologists can schedule and manage patient appointments in the Scheduling page.</p></div>
        <p class="text-xs text-on-surface-variant/60 mt-4">Contact: admin@scanova.com</p>
      </div>
    `);
  });
  document.getElementById('notif-btn')?.addEventListener('click',()=>{
    toast('No new notifications', 'info');
  });
  // ── Avatar dropdown ──────────────────────────────────
  const avatarWrap = document.getElementById('avatar-wrap');
  const avatarMenu = document.getElementById('avatar-menu');
  const avatarEl   = document.getElementById('user-avatar');
  if(avatarEl){
    // bind() runs frequently; avoid stacking click handlers
    avatarEl.onclick = (e)=>{
      e.stopPropagation();
      avatarMenu?.classList.toggle('hidden');
    };
  }
  // Close dropdown when clicking anywhere outside (register once globally)
  if(!window._avatarOutsideClick){
    window._avatarOutsideClick = true;
    document.addEventListener('click', e => {
      const wrap = document.getElementById('avatar-wrap');
      const menu = document.getElementById('avatar-menu');
      if(wrap && !wrap.contains(e.target)) menu?.classList.add('hidden');
    });
  }

  const ddLogout = document.getElementById('dd-logout');
  if(ddLogout){
    ddLogout.onclick = ()=>{
      avatarMenu?.classList.add('hidden');
      logout();
    };
  }

  // Admin-only dropdown: Account Info + Change Password inline modals
  const ddAccount = document.getElementById('dd-account');
  if(ddAccount) ddAccount.onclick = ()=>{
    avatarMenu?.classList.add('hidden');
    showModal('Account Information',`
      <div class="space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Full Name</label>
          <input id="dd-s-name" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" value="${S.user.name}"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Email Address</label>
          <input id="dd-s-email" type="email" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" value="${S.user.email}"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Role</label>
          <input class="w-full px-4 py-3 bg-surface-container-highest border-none rounded-lg text-on-surface-variant text-sm" value="${S.user.role}" readonly/>
        </div>
      </div>`,
    [{label:'Cancel', style:'secondary', cb: closeModal},
     {label:'Save Changes', style:'primary', cb: async()=>{
       const name  = document.getElementById('dd-s-name')?.value?.trim();
       const email = document.getElementById('dd-s-email')?.value?.trim();
       if(!name||!email){ toast('Name and email required','warn'); return; }
       closeModal();
       await updateProfile(name, email);
     }}]);
  };

  const ddPassword = document.getElementById('dd-password');
  if(ddPassword) ddPassword.onclick = ()=>{
    avatarMenu?.classList.add('hidden');
    showModal('Change Password',`
      <div class="space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Current Password</label>
          <input id="dd-cur-pw" type="password" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" placeholder="••••••••"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">New Password</label>
          <input id="dd-new-pw" type="password" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" placeholder="••••••••"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Confirm New Password</label>
          <input id="dd-con-pw" type="password" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" placeholder="••••••••"/>
        </div>
      </div>`,
    [{label:'Cancel', style:'secondary', cb: closeModal},
     {label:'Update Password', style:'primary', cb: async()=>{
       const cur = document.getElementById('dd-cur-pw')?.value;
       const nw  = document.getElementById('dd-new-pw')?.value;
       const cn  = document.getElementById('dd-con-pw')?.value;
       if(!cur||!nw){ toast('All fields required','warn'); return; }
       closeModal();
       await changePassword(cur, nw, cn);
     }}]);
  };

  // App footer links
  document.getElementById('app-footer-privacy')?.addEventListener('click',()=>showModal('Privacy Policy',privacyText));
  document.getElementById('app-footer-hipaa')?.addEventListener('click',()=>showModal('HIPAA Compliance',hipaaText));
  document.getElementById('app-footer-contact')?.addEventListener('click',()=>showModal('Contact Us',contactText));

  // ── Analyze a new scan (scan page toolbar) ────────
  document.getElementById('scan-new-btn')?.addEventListener('click',()=>{
    set({scanComposeOpen:true, _files:null, scanSelectedLabel:'', scanError:null, error:null});
  });

  // ── File upload zone ──────────────────────────────
  const zone = document.getElementById('upload-zone');
  const fi   = document.getElementById('file-input');
  if(zone && fi){
    const isSupportedScan = (name)=>{
      const low = String(name||'').toLowerCase();
      return low.endsWith('.png') || low.endsWith('.jpg') || low.endsWith('.jpeg') || low.endsWith('.dcm');
    };
    const labelFor = (files)=>{
      if(!files || !files.length) return '';
      return files.length===1 ? ('📎 '+files[0].name) : (`📎 ${files.length} files selected`);
    };
    const applyFiles = (files)=>{
      if(!files.length) return;
      const good = files.filter(f=>isSupportedScan(f?.name));
      const bad  = files.filter(f=>!isSupportedScan(f?.name));
      const msg  = bad.length ? `File not supported: ${bad[0]?.name || 'Unknown file'}` : null;
      // Keep current result visible while composing a replacement scan
      if(S.scanComposeOpen && S.scanResult){
        set({ _files: good, scanSelectedLabel: labelFor(files), scanError: msg, error: msg });
        return;
      }
      set({
        _files: good,
        scanSelectedLabel: labelFor(files),
        scanError: msg,
        error: msg,
        scanResult:null, scanResults:null, scanActiveIdx:0, scanUploadProgress:null,
        chatMessages:[], chatOpen:false
      });
      S._scanChatBootstrapped = false;
    };
    zone.addEventListener('click', ()=>fi.click());
    zone.addEventListener('dragover',  e=>{e.preventDefault(); zone.classList.add('border-primary','bg-surface-container-low');});
    zone.addEventListener('dragleave', ()=>zone.classList.remove('border-primary','bg-surface-container-low'));
    zone.addEventListener('drop', e=>{
      e.preventDefault(); zone.classList.remove('border-primary','bg-surface-container-low');
      applyFiles(Array.from(e.dataTransfer.files||[]));
    });
    fi.addEventListener('change',()=>{
      applyFiles(Array.from(fi.files||[]));
      // Allow selecting the same file again and still triggering change.
      fi.value = '';
    });
  }
  document.getElementById('upload-btn')?.addEventListener('click',()=>{
    if(!S._files || !S._files.length){ toast('Please select one or more scan files first','warn'); return; }
    uploadScan(S._files);
  });

  // ── Explainable AI Chat ───────────────────────────
  document.getElementById('chat-toggle-btn')?.addEventListener('click',()=>{
    if(!S.chatOpen && S.chatMessages.length===0){
      openChatWithGreeting();
    } else {
      set({chatOpen: !S.chatOpen});
    }
  });
  // Dashboard chat toggle (patient dash)
  document.getElementById('dash-chat-toggle')?.addEventListener('click',()=>{
    if(!S.chatOpen && S.chatMessages.length===0){
      openChatWithGreeting();
    } else {
      set({chatOpen: !S.chatOpen});
    }
  });

  document.getElementById('chat-send-btn')?.addEventListener('click',()=>{
    const inp = document.getElementById('chat-input');
    if(!inp) return;
    const msg = inp.value.trim();
    if(!msg) return;
    inp.value = '';
    inp.style.height = 'auto';
    sendChatMessage(msg);
  });

  document.getElementById('chat-input')?.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      const msg = e.target.value.trim();
      if(!msg) return;
      e.target.value = '';
      e.target.style.height = 'auto';
      sendChatMessage(msg);
    }
  });

  document.getElementById('chat-clear-btn')?.addEventListener('click',()=>{
    showModal('Clear Chat','Clear all chat messages and start fresh?',[
      {label:'Cancel', style:'secondary', cb:closeModal},
      {label:'Clear', style:'primary', cb:()=>{ closeModal(); set({chatMessages:[], chatOpen:true}); }},
    ]);
  });

  // ── Scan-detail page chat ────────────────────────────
  document.getElementById('detail-chat-send')?.addEventListener('click',()=>{
    const inp = document.getElementById('detail-chat-input');
    if(!inp) return;
    const msg = inp.value.trim();
    if(!msg) return;
    inp.value = '';
    inp.style.height = 'auto';
    sendDetailChat(msg);
  });

  document.getElementById('detail-chat-clear')?.addEventListener('click',()=>{
    showModal('Clear Chat','Clear all messages for this scan? This also removes saved history.',[
      {label:'Cancel', style:'secondary', cb:closeModal},
      {label:'Clear',  style:'primary',  cb:async()=>{
        closeModal();
        const sid = S.scanDetailData?.id;
        if(sid) await api('DELETE',`/api/scans/${sid}/chats`).catch(()=>{});
        set({detailChatMessages:[]});
      }},
    ]);
  });

  // ── Settings ──────────────────────────────────────
  // ── Role upgrade request ─────────────────────────────
  document.getElementById('submit-role-req-btn')?.addEventListener('click', async()=>{
    const reason = document.getElementById('role-req-reason')?.value?.trim()||'';
    set({roleReqReason: reason});
    try{
      await api('POST','/api/role-requests',{requested_role: S.roleReqRole, reason});
      toast('Request submitted! The admin will review it shortly.','success');
      set({data:{...S.data,myRoleRequestsLoaded:false}});
      loadMyRoleRequest();
    }catch(e){ toast(e.message,'error'); }
  });

  document.getElementById('save-profile-btn')?.addEventListener('click',()=>{
    const name  = document.getElementById('s-name')?.value?.trim();
    const email = document.getElementById('s-email')?.value?.trim();
    if(!name||!email){ toast('Name and email are required','warn'); return; }
    updateProfile(name, email);
  });
  document.getElementById('update-pw-btn')?.addEventListener('click',()=>{
    const current = document.getElementById('s-current-pw')?.value;
    const newPw   = document.getElementById('s-new-pw')?.value;
    const confirm = document.getElementById('s-confirm-pw')?.value;
    if(!current||!newPw){ toast('All password fields are required','warn'); return; }
    changePassword(current, newPw, confirm);
  });

  document.getElementById('goto-mfa-btn')?.addEventListener('click', async()=>{
    try{
      const st = await api('GET','/api/auth/mfa/status');
      set({mfa:{enabled: !!st.enabled}});
    }catch(_e){
      set({mfa:{enabled:false}});
    }
    navTo('mfa');
  });

  // ── MFA ───────────────────────────────────────────
  document.getElementById('mfa-start-btn')?.addEventListener('click', async()=>{
    try{
      const d = await api('POST','/api/auth/mfa/start',{});
      set({mfa:{enabled:false, ...d}});
      toast('QR code generated. Scan and verify to enable MFA.','success');
    }catch(e){ toast(e.message,'error'); }
  });
  document.getElementById('mfa-verify-btn')?.addEventListener('click', async()=>{
    const code = document.getElementById('mfa-verify-code')?.value?.trim();
    if(!code){ toast('Enter the 6-digit code','warn'); return; }
    try{
      await api('POST','/api/auth/mfa/verify',{code});
      set({mfa:{enabled:true}});
      toast('MFA enabled. You will need a code at every login.','success');
      // If this was forced setup after registration, unlock the dashboard now.
      if(S.mfaSetupRequired){
        set({mfaSetupRequired:false, view:'app', page:'dashboard'});
        loadStats();
      }
    }catch(e){ toast(e.message,'error'); }
  });
  document.getElementById('mfa-disable-btn')?.addEventListener('click', async()=>{
    const pw   = document.getElementById('mfa-disable-pw')?.value;
    const code = document.getElementById('mfa-disable-code')?.value?.trim();
    if(!pw || !code){ toast('Password and code required','warn'); return; }
    try{
      await api('POST','/api/auth/mfa/disable',{password:pw, code});
      set({mfa:{enabled:false}});
      toast('MFA disabled.','success');
    }catch(e){ toast(e.message,'error'); }
  });

  // ── Admin Export Report ───────────────────────────
  document.getElementById('export-report-btn')?.addEventListener('click',async()=>{
    try{
      const [users, scans, patients] = await Promise.all([
        api('GET','/api/users').catch(()=>[]),
        api('GET','/api/scans').catch(()=>[]),
        api('GET','/api/patients').catch(()=>[]),
      ]);
      const lines = [
        `Scanova - Breast Cancer AI  |  System Report`,
        `Generated: ${new Date().toLocaleString()}`,
        ``,
        `=== SUMMARY ===`,
        `Total Users:    ${users.length}`,
        `Total Scans:    ${scans.length}`,
        `Total Patients: ${patients.length}`,
        `High Risk Scans: ${scans.filter(s=>s.risk_level==='high').length}`,
        ``,
        `=== SCAN RESULTS ===`,
        `Malignant: ${scans.filter(s=>s.prediction==='malignant').length}`,
        `Benign:    ${scans.filter(s=>s.prediction==='benign').length}`,
        ``,
        `=== USERS ===`,
        ...users.map(u=>`  ${u.role.padEnd(12)} ${u.name.padEnd(25)} ${u.email}`),
        ``,
        `=== RECENT SCANS ===`,
        ...scans.slice(0,20).map(s=>`  ${s.created?.split('T')[0]||'?'}  ${s.filename||'?'}  ${s.prediction||'?'}  ${s.probability||0}%  [${s.risk_level||'?'}]`),
      ];
      const blob = new Blob([lines.join('\n')], {type:'text/plain'});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `scanova-report-${new Date().toISOString().split('T')[0]}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Report downloaded!');
    }catch(e){ toast('Export failed: '+e.message,'error'); }
  });

  // ── Schedule form ─────────────────────────────────
  document.getElementById('add-appt-btn')?.addEventListener('click',()=>{
    set({data:{...S.data, showApptForm: true}});
  });
  document.getElementById('appt-cancel')?.addEventListener('click',()=>{
    set({data:{...S.data, showApptForm: false}});
  });
  document.getElementById('appt-submit')?.addEventListener('click',()=>{
    const patient = document.getElementById('appt-patient')?.value?.trim();
    const date    = document.getElementById('appt-date')?.value;
    const time    = document.getElementById('appt-time')?.value;
    const type    = document.getElementById('appt-type')?.value;
    const doctor  = document.getElementById('appt-doctor')?.value?.trim();
    const notes   = document.getElementById('appt-notes')?.value?.trim();
    if(!patient||!date||!time){ toast('Patient name, date and time are required','warn'); return; }
    addAppointment({patient_name:patient,date,time,type,doctor,notes});
    set({data:{...S.data, showApptForm:false}});
  });

  // ── Patient form ──────────────────────────────────
  const addPatientBtnHandler = ()=>set({data:{...S.data, showPatientForm:true, patientsLoaded:true}});
  document.getElementById('add-patient-btn')?.addEventListener('click', addPatientBtnHandler);
  document.getElementById('add-patient-btn2')?.addEventListener('click', addPatientBtnHandler);
  document.getElementById('pt-cancel')?.addEventListener('click',()=>{
    set({data:{...S.data, showPatientForm:false}});
  });
  document.getElementById('pt-submit')?.addEventListener('click',()=>{
    const name  = document.getElementById('pt-name')?.value?.trim();
    const dob   = document.getElementById('pt-dob')?.value;
    const email = document.getElementById('pt-email')?.value?.trim();
    const phone = document.getElementById('pt-phone')?.value?.trim();
    const risk  = document.getElementById('pt-risk')?.value;
    const notes = document.getElementById('pt-notes')?.value?.trim();
    if(!name){ toast('Patient name is required','warn'); return; }
    addPatient({name,dob,email,phone,risk_level:risk,notes});
    set({data:{...S.data, showPatientForm:false}});
  });

  // ── Radiologist quick actions (inline) ───────────
  // (handled via onclick attributes in renderRadiologistDash)
}

// ── Privacy text (referenced in bind before declaration — fix) ──
const privacyText = `<p>Scanova collects only the data needed to provide AI diagnostic services: account information and uploaded scan images. Images are processed locally on our secure server and are never shared with third parties. You can request deletion of your data at any time.</p>`;
const hipaaText   = `<p>Scanova implements HIPAA-aligned safeguards including: encrypted JWT authentication, bcrypt password hashing, role-based access control, and audit logging. All patient data is stored in an access-controlled SQLite database. No PHI leaves the server.</p>`;
const contactText = `<div class="space-y-2"><p>For support, questions, or data requests:</p><p><strong>Email:</strong> support@scanova.ai</p><p><strong>Technical Issues:</strong> admin@scanova.com</p><p class="text-xs text-on-surface-variant/60 mt-4">This is a research prototype — contact your system administrator for institutional access.</p></div>`;

// ── Init — session + navigation behavior ──────────────
// Requirements:
// - Refresh (Ctrl+R / Ctrl+Shift+R): keep session and stay in-app.
// - Fresh open / navigate: land on Home (Landing) even if session exists.
try{
  const tok  = localStorage.getItem('sc_token');
  const user = JSON.parse(localStorage.getItem('sc_user')||'null');
  if(tok && user && user.email){
    // Clear in-memory caches before restoring user
    // (prevents any stale UI from a prior account)
    S.data = {};
    S.error = null;
    clearScanSession({quiet:true});
    S.dcSessions = []; S.dcSessionsLoaded = false; S.dcActiveId = null; S.dcMessages = []; S.dcSending = false;
    S.token = tok;
    S.user  = user;
    const navType = performance?.getEntriesByType?.('navigation')?.[0]?.type || 'navigate';
    if(navType === 'reload'){
      S.view  = 'app';
      // Never reopen Analyze with a prior result after refresh
      S.page  = 'dashboard';
      loadStats();
      if(S.user.role==='admin') loadUsers();
    }else{
      // Fresh open: land on home page AND require re-login.
      localStorage.removeItem('sc_token');
      localStorage.removeItem('sc_user');
      S.token = null;
      S.user  = null;
      S.view  = 'landing';
    }
  }else{
    S.user  = null;
    S.token = null;
    S.view  = 'landing';
  }
}catch(_e){
  S.user  = null;
  S.token = null;
  S.view  = 'landing';
}
// ══════════════════════════════════════════════════
// ANIMATION ENGINE — runs after every render
// ══════════════════════════════════════════════════
function initAnimations(){

  // ── 1. Particle / neural-net canvas (hero only) ──
  const canvas = document.getElementById('hero-canvas');
  if(canvas && !canvas._running){
    canvas._running = true;
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], raf;
    const P = 80, PRIMARY = '153,65,90';

    function resize(){
      W = canvas.width  = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    for(let i=0;i<P;i++) particles.push({
      x: Math.random()*W, y: Math.random()*H,
      vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35,
      r: Math.random()*2+1, o: Math.random()*.6+.2
    });

    function draw(){
      if(!document.getElementById('hero-canvas')){ cancelAnimationFrame(raf); return; }
      ctx.clearRect(0,0,W,H);
      particles.forEach(p=>{
        p.x += p.vx; p.y += p.vy;
        if(p.x<0||p.x>W) p.vx*=-1;
        if(p.y<0||p.y>H) p.vy*=-1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(${PRIMARY},${p.o})`; ctx.fill();
      });
      // connections
      for(let i=0;i<particles.length;i++){
        for(let j=i+1;j<particles.length;j++){
          const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
          const d=Math.sqrt(dx*dx+dy*dy);
          if(d<100){
            ctx.beginPath();
            ctx.moveTo(particles[i].x,particles[i].y);
            ctx.lineTo(particles[j].x,particles[j].y);
            ctx.strokeStyle=`rgba(${PRIMARY},${(1-d/100)*.25})`;
            ctx.lineWidth=.8; ctx.stroke();
          }
        }
      }
      raf = requestAnimationFrame(draw);
    }
    draw();
  }

  // ── 2. Typewriter for hero subtitle ──────────────
  const sub = document.getElementById('hero-subtitle');
  if(sub && !sub._typed){
    sub._typed = true;
    const text = 'Scanova uses a Fusion V3 AI engine trained on mammography, ultrasound, and MRI data to deliver breast cancer decision support with full Grad-CAM++ explainability.';
    let i=0;
    sub.classList.add('tw-cursor');
    const type = ()=>{
      if(i<=text.length){ sub.textContent=text.slice(0,i++); setTimeout(type, i<40?30:14); }
      else sub.classList.remove('tw-cursor');
    };
    setTimeout(type, 900);
  }

  // ── 3. Animated stat counters ─────────────────────
  document.querySelectorAll('[data-count]').forEach(el=>{
    if(el._counted) return; el._counted=true;
    const target  = parseInt(el.getAttribute('data-count'));
    const decimal = parseInt(el.getAttribute('data-decimal')||'0');
    const suffix  = el.getAttribute('data-suffix')||'';
    const dur = 1600, start = performance.now();
    const easeOut = t => 1 - Math.pow(1-t,3);
    const tick = now => {
      const p = Math.min((now-start)/dur,1);
      const v = Math.round(easeOut(p)*target);
      el.textContent = decimal
        ? (v/Math.pow(10,decimal)).toFixed(decimal)+suffix
        : v+suffix;
      if(p<1) requestAnimationFrame(tick);
    };
    setTimeout(()=>requestAnimationFrame(tick), 400);
  });

  // ── 4. Scroll-reveal (IntersectionObserver) ───────
  if(!window._srObserver){
    window._srObserver = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){ e.target.classList.add('visible'); }
      });
    },{threshold:.12});
  }
  document.querySelectorAll('.sr,.sr-left,.sr-right').forEach(el=>{
    if(!el._observed){ el._observed=true; window._srObserver.observe(el); }
  });

  // ── 5. 3D tilt cards ──────────────────────────────
  // Store last mouse position so hover tilt can update on scroll
  if(!window._lastMouse){
    window._lastMouse = {x: null, y: null};
    window.addEventListener('mousemove', (e)=>{
      window._lastMouse.x = e.clientX;
      window._lastMouse.y = e.clientY;
    }, {passive:true});
  }

  function applyTilt(card, clientX, clientY){
    const r = card.getBoundingClientRect();
    const cx = (clientX ?? (r.left + r.width/2));
    const cy = (clientY ?? (r.top  + r.height/2));
    const x  = (cx - r.left) / r.width - .5;
    const y  = (cy - r.top)  / r.height - .5;
    card.style.transform = `perspective(700px) rotateY(${x*12}deg) rotateX(${-y*12}deg) scale(1.02)`;
  }

  document.querySelectorAll('.tilt-card').forEach(card=>{
    if(card._tilt) return; card._tilt=true;
    card._applyTilt = (x,y)=>applyTilt(card,x,y);
    card.addEventListener('mousemove',e=>applyTilt(card,e.clientX,e.clientY));
    card.addEventListener('mouseleave',()=>{ card.style.transform=''; });
  });

  // If the user scrolls while the cursor stays over a tilt card,
  // re-apply tilt so the effect updates without mouse movement.
  if(!window._tiltScrollBound){
    window._tiltScrollBound = true;
    let raf = null;
    window.addEventListener('scroll', ()=>{
      if(raf) return;
      raf = requestAnimationFrame(()=>{
        raf = null;
        const mx = window._lastMouse?.x;
        const my = window._lastMouse?.y;
        document.querySelectorAll('.tilt-card:hover').forEach(card=>{
          if(card._applyTilt) card._applyTilt(mx, my);
        });
      });
    }, {passive:true});
  }

  // ── 6. Magnetic buttons ───────────────────────────
  document.querySelectorAll('.mag-wrap').forEach(wrap=>{
    if(wrap._mag) return; wrap._mag=true;
    const btn = wrap.querySelector('.mag-btn');
    if(!btn) return;
    wrap.addEventListener('mousemove',e=>{
      const r=wrap.getBoundingClientRect();
      const x=(e.clientX-r.left-r.width/2)*.35;
      const y=(e.clientY-r.top-r.height/2)*.35;
      btn.style.transform=`translate(${x}px,${y}px)`;
    });
    wrap.addEventListener('mouseleave',()=>{ btn.style.transform=''; });
  });

  // ── 7. Ripple on click ────────────────────────────
  document.querySelectorAll('.ripple-btn:not(._rippled)').forEach(btn=>{
    btn.classList.add('_rippled');
    btn.addEventListener('click',e=>{
      const r=btn.getBoundingClientRect();
      const size=Math.max(r.width,r.height);
      const c=document.createElement('span');
      c.className='ripple-circle';
      c.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(c); setTimeout(()=>c.remove(),700);
    });
  });

  // ── 8. Progress bar reveal ────────────────────────
  setTimeout(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{
      const w = el.style.width||el.getAttribute('data-width');
      if(w&&w!=='0%'){ el.style.width='0'; requestAnimationFrame(()=>{ el.style.width=w; }); }
    });
  },300);

  // ── 10. Scroll-hint click ─────────────────────────
  document.getElementById('scroll-hint')?.addEventListener('click',()=>{
    document.getElementById('sec-features')?.scrollIntoView({behavior:'smooth'});
  });

  // ── 11. Pipeline steps stagger + line reveal ────────
  const pipelineWrap = document.getElementById('mth-pipeline-wrap');
  if(pipelineWrap && !pipelineWrap._pipeObserved){
    pipelineWrap._pipeObserved = true;
    const pipeObs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          // Animate connector line
          const line = document.getElementById('mth-line');
          if(line){ setTimeout(()=>{ line.style.transform='scaleX(1)'; },200); }
          // Stagger step cards
          document.querySelectorAll('.mth-step').forEach((el,i)=>{
            setTimeout(()=>el.classList.add('visible'), 200+i*130);
          });
          pipeObs.unobserve(e.target);
        }
      });
    },{threshold:0.25});
    pipeObs.observe(pipelineWrap);
  }

  // ── 12. AUC rows fade-in + bars animate ─────────────
  document.querySelectorAll('.auc-row').forEach((row,i)=>{
    if(row._aucRowObs) return; row._aucRowObs=true;
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          setTimeout(()=>row.classList.add('visible'), i*100);
          const bar = row.querySelector('.auc-bar');
          if(bar){
            const tw = bar.style.getPropertyValue('--target-w');
            setTimeout(()=>{ bar.style.width = tw; }, 200+i*130);
          }
          obs.unobserve(e.target);
        }
      });
    },{threshold:0.2});
    obs.observe(row);
  });

  // ── 13. XAI cards slide in ───────────────────────────
  document.querySelectorAll('.xai-card').forEach((card,i)=>{
    if(card._xaiObs) return; card._xaiObs=true;
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          setTimeout(()=>card.classList.add('visible'), i*150);
          obs.unobserve(e.target);
        }
      });
    },{threshold:0.15});
    obs.observe(card);
  });

  // ── 14. Ring cards fade in + SVG arcs animate ────────
  ['rings-wrap','vindr-rings-wrap'].forEach(id=>{
    const wrap = document.getElementById(id);
    if(!wrap || wrap._ringsObs) return;
    wrap._ringsObs = true;
    const rObs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(!e.isIntersecting) return;
        e.target.querySelectorAll('.ring-card').forEach((card,i)=>{
          setTimeout(()=>card.classList.add('visible'), i*110);
        });
        e.target.querySelectorAll('.metric-ring').forEach((ring,i)=>{
          const filled = ring.style.getPropertyValue('--filled');
          const gap    = ring.style.getPropertyValue('--gap');
          setTimeout(()=>{ ring.style.strokeDasharray = filled+' '+gap; }, 200+i*180);
        });
        rObs.unobserve(e.target);
      });
    },{threshold:0.2});
    rObs.observe(wrap);
  });

  // ── Admin validation AUC bars ───────────────────────
  const valWrap = document.getElementById('admin-val-wrap');
  if(valWrap && !valWrap._valObs){
    valWrap._valObs = true;
    const lightBars = ()=>{
      valWrap.querySelectorAll('[data-val-bar] > i').forEach((bar,i)=>{
        const w = bar.parentElement.style.getPropertyValue('--w') || '0%';
        setTimeout(()=>{ bar.style.width = w; }, 80+i*90);
      });
    };
    const vObs = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(!e.isIntersecting) return;
        lightBars();
        vObs.unobserve(e.target);
      });
    },{threshold:0.15});
    vObs.observe(valWrap);
    // Dashboard content is often already on-screen
    requestAnimationFrame(()=>{
      const r = valWrap.getBoundingClientRect();
      if(r.top < window.innerHeight && r.bottom > 0) lightBars();
    });
  }
}

// Patch render to also fire initAnimations each time
const _baseRender = render;
render = function(){
  _baseRender();
  requestAnimationFrame(initAnimations);
  // Keep detail chat scrolled to bottom after re-render
  if(S.page==='scan-detail') setTimeout(_scrollDetailChat, 60);
};
render();
