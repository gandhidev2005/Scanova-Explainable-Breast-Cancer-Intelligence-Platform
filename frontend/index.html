/* ── Core utilities ───────────────────────────────── */

/* ── KEYFRAMES ────────────────────────────────────── */
@keyframes fadeInUp    { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
@keyframes fadeInDown  { from{opacity:0;transform:translateY(-24px)} to{opacity:1;transform:none} }
@keyframes fadeInLeft  { from{opacity:0;transform:translateX(-32px)} to{opacity:1;transform:none} }
@keyframes fadeInRight { from{opacity:0;transform:translateX(32px)}  to{opacity:1;transform:none} }
@keyframes scaleIn     { from{opacity:0;transform:scale(0.88)} to{opacity:1;transform:scale(1)} }

@keyframes shimmer     { from{background-position:-200% 0} to{background-position:200% 0} }
@keyframes textReveal  { from{clip-path:inset(0 100% 0 0);opacity:0} to{clip-path:inset(0 0% 0 0);opacity:1} }

<script>
// ── Time helpers ─────────────────────────────────────
function timeAgo(dateStr){
  if(!dateStr) return '—';
  // SQLite stores without Z; treat as UTC
  const d = new Date(dateStr.replace(' ','T') + (dateStr.includes('Z')||dateStr.includes('+') ? '' : 'Z'));
  if(isNaN(d)) return dateStr.split('T')[0] || '—';
  const diff = Date.now() - d.getTime();
  if(diff < 0) return 'Just now';
  const mins = Math.floor(diff/60000);
  const hrs  = Math.floor(mins/60);
  const days = Math.floor(hrs/24);
  if(mins < 1)  return 'Just now';
  if(mins < 60) return `${mins} min ago`;
  if(hrs  < 24) return `${hrs} hr${hrs>1?'s':''} ago`;
  if(days <  7) return `${days} day${days>1?'s':''} ago`;
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr.replace(' ','T') + (dateStr.includes('Z')||dateStr.includes('+') ? '' : 'Z'));
  if(isNaN(d)) return dateStr.split('T')[0] || '—';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

// ── State ────────────────────────────────────────────
const API = '';
let S = {
  user: JSON.parse(localStorage.getItem('sc_user')||'null'),
  token: localStorage.getItem('sc_token')||null,
  view: 'landing', page: 'dashboard',
  data: {}, loading: false, error: null,
  scanResult: null, scanLoading: false, _file: null,
  scanError: null,
  scanSelectedLabel: '',
  queueFilter: 'ALL',
  userRoleFilter: 'all',
  chatOpen: false,
  chatMessages: [],   // [{role:'user'|'assistant', content:'...'}]
  chatLoading: false,
  scanChatStyle: 'normal',        // admin: 'normal'|'clinic'|'radio'
  roleReqRole: 'radiologist',
  roleReqReason: '',
  scanDetailData: null,           // scan being viewed on the detail page
  detailChatMessages: [],         // chat messages scoped to scan-detail page
  detailChatLoading: false,

// ── Toast ─────────────────────────────────────────────
function toast(msg, type='success'){
  const el = document.createElement('div');
  const colors = {
    success: 'bg-tertiary text-white',
    error:   'bg-error text-on-error',
    info:    'bg-secondary-container text-on-secondary-container',
    warn:    'bg-amber-100 text-amber-800'
  };
  el.className = `sc-toast pointer-events-auto px-5 py-3 rounded-xl font-semibold text-sm shadow-lg flex items-center gap-3 ${colors[type]||colors.success}`;
  const icon = {success:'check_circle',error:'error',info:'info',warn:'warning'};
  el.innerHTML = `<span class="material-symbols-outlined text-lg" style="font-variation-settings:'FILL' 1;">${icon[type]||'check_circle'}</span>${msg}`;
  document.getElementById('sc-toasts').appendChild(el);
  setTimeout(()=> el.classList.add('opacity-0','transition-opacity'), 3000);
  setTimeout(()=> el.remove(), 3400);
}

// ── Modal ─────────────────────────────────────────────
function showModal(title, body, actions=[]){
  document.getElementById('sc-modal-title').textContent = title;
  document.getElementById('sc-modal-body').innerHTML = body;
  const actEl = document.getElementById('sc-modal-actions');
  actEl.innerHTML = '';
  if(!actions.length){
    actions = [{label:'Close', style:'secondary', cb: closeModal}];
  }
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = a.style==='primary'
      ? 'bloom-gradient text-on-primary px-6 py-2.5 rounded-lg font-bold text-sm'
      : 'bg-surface-container text-on-surface-variant px-6 py-2.5 rounded-lg font-bold text-sm hover:bg-surface-container-high';
    btn.textContent = a.label;
    btn.onclick = a.cb;
    actEl.appendChild(btn);
  });
  document.getElementById('sc-modal').classList.remove('hidden');
  // Prevent background scrolling while modal is open
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('sc-modal').classList.add('hidden');
  document.body.style.overflow = '';
}
document.getElementById('sc-modal').addEventListener('click', e => {
  if(e.target === document.getElementById('sc-modal')) closeModal();
});

// ── API helper ────────────────────────────────────────
async function api(method, path, body, isForm){
  const h = {};
  if(S.token) h['Authorization'] = `Bearer ${S.token}`;
  if(!isForm) h['Content-Type'] = 'application/json';
  const r = await fetch(API+path,{method,headers:h,
    body: isForm ? body : (body ? JSON.stringify(body) : undefined)});
  if(!r.ok){ const e=await r.json().catch(()=>({detail:`Request failed (HTTP ${r.status})`})); throw new Error(e.detail||`Failed (${r.status})`); }
  return r.json();
}

async function login(email,pw,mfaCode){
  set({loading:true,error:null});
  try{
    const payload = {email:email.trim().toLowerCase(), password:pw};
    if(mfaCode) payload.mfa_code = String(mfaCode).trim();
    const d = await api('POST','/api/auth/login',payload);
    localStorage.setItem('sc_token',d.token);
    localStorage.setItem('sc_user',JSON.stringify(d.user));
    _resetUserScopedState();
    set({user:d.user,token:d.token,loading:false,view:'app',page:'dashboard'});
    loadStats();
  }catch(e){
    const msg = e?.message || 'Login failed';
    // Backend signals MFA requirement via message text + mfa_required flag in JSON,
    // but our api() helper only throws with detail string. So detect by message.
    if(String(msg).toLowerCase().includes('mfa code required')){
      set({loading:false,error:null});
      showModal('MFA Verification', `
        <div class="space-y-3">
          <p class="text-sm text-on-surface-variant">Enter the 6-digit code from your authenticator app.</p>
          <input id="mfa-login-code" inputmode="numeric" autocomplete="one-time-code"
            class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface text-lg tracking-widest font-bold"
            placeholder="123 456"/>
        </div>
      `,[
        {label:'Cancel', style:'secondary', cb: closeModal},
        {label:'Verify', style:'primary', cb: ()=>{
          const code = document.getElementById('mfa-login-code')?.value?.trim();
          closeModal();
          login(email, pw, code);
        }},
      ]);
      setTimeout(()=>document.getElementById('mfa-login-code')?.focus(),80);
      return;
    }
    set({loading:false,error:msg});
  }
}

async function register(name,email,pw,role, enableMfa){
  set({loading:true,error:null});
  try{
    const d = await api('POST','/api/auth/register',{name,email:email.trim().toLowerCase(),password:pw,role});
    localStorage.setItem('sc_token',d.token);
    localStorage.setItem('sc_user',JSON.stringify(d.user));
    _resetUserScopedState();
    if(enableMfa){
      // Force a dedicated MFA-only screen (no sidebar) until verified
      set({user:d.user,token:d.token,loading:false,view:'mfa-gate',page:'mfa',mfaSetupRequired:true});
    }else{
      set({user:d.user,token:d.token,loading:false,view:'app',page:'dashboard'});
      loadStats();
    }
    // Optional: start MFA setup right after registration
    if(enableMfa){
      try{
        const st = await api('GET','/api/auth/mfa/status');
        set({mfa:{enabled: !!st.enabled}});
      }catch(_e){
        set({mfa:{enabled:false}});
      }
      // Auto-generate QR/setup secret so the user can scan immediately
      try{
        const setup = await api('POST','/api/auth/mfa/start',{});
        set({mfa:{enabled:false, ...setup}});
        toast('MFA setup started. Scan the QR code to enable.','success');
      }catch(e){
        toast('Could not start MFA setup: '+e.message,'error');
      }
    } else {
      toast('Tip: You can enable MFA later from Settings in your dashboard.','info');
    }
  }catch(e){ set({loading:false,error:e.message}); }
}

function logout(){
  localStorage.removeItem('sc_token');
  localStorage.removeItem('sc_user');
  _resetUserScopedState();
  set({user:null,token:null,view:'landing'});
}

// ── Scan upload ───────────────────────────────────────
async function uploadScan(files){
  // Ensure we always end up with an array of File objects.
  const isFile = (v) => {
    try{ return (typeof File!=='undefined') && (v instanceof File); }catch(_e){ return false; }
  };
  const list =
    Array.isArray(files) ? files :
    (isFile(files) ? [files] :
      Array.from(files || []));
  if(!list.length){
    toast('Please select one or more scan files first','warn');
    return;
  }
  set({scanLoading:true,scanError:null,error:null,scanResult:null, scanResults:null, scanUploadProgress: {done:0,total:list.length}});
  try{
    // Upload sequentially so every file is analyzed & saved,
    // and one bad file doesn't cancel the whole batch.
    const results = [];
    for(let i=0;i<list.length;i++){
      set({scanUploadProgress:{done:i,total:list.length}});
      const f=new FormData();
      f.append('file', list[i]);
      const r=await api('POST','/api/scan/analyze',f,true);
      results.push(r);
    }
    set({scanUploadProgress:{done:list.length,total:list.length}});
    // Patch stats immediately so the riskometer reflects the new result
    // without waiting for a loadStats() round-trip
    const patchedStats = {
      ...(S.data.stats||{}),
      prediction:  results[0]?.prediction,
      probability: results[0]?.probability,
      risk_level:  results[0]?.risk_level,
      last_scan:   new Date().toISOString(),
      total_scans: (S.data.stats?.total_scans||0) + results.length,
    };
    set({scanLoading:false, scanError:null, scanResults: results, scanResult: results[0]||null, scanActiveIdx: 0, data:{...S.data, stats: patchedStats}});
    toast(`Analysis complete! (${results.length} file${results.length!==1?'s':''})`);
    loadStats(); // sync authoritative count / last_scan from server
  }catch(e){
    const msg = e?.message || 'Scan analysis failed. Please try again.';
    set({scanLoading:false, scanError: msg, error: msg});
    toast(msg,'error');
  }
}

async function sendChatMessage(msg){
  if(!msg?.trim() || S.chatLoading) return;
  if(!S.scanResult){ toast('Run a scan first, then chat about the results.','warn'); return; }

  const userMsg = {role:'user', content: msg.trim()};
  const updated = [...S.chatMessages, userMsg];
  set({chatMessages: updated, chatLoading: true, chatOpen: true});
  setTimeout(_scrollChat, 50);

  try{
    const r = await api('POST','/api/scan/chat',{
      message:      msg.trim(),
      scan_context: S.scanResult,
      scan_id:      S.scanResult?.scan_id ?? null,  // ← persist to DB
      history:      S.chatMessages.slice(-12),
      style:        (S.user?.role==='admin' ? (S.scanChatStyle||'normal') : null),
    });
    set({
      chatMessages: [...updated, {role:'assistant', content: r.response}],
      chatLoading:  false,
    });
  }catch(e){
    set({
      chatMessages: [...updated, {role:'assistant', content:`⚠️ Chat error: ${e.message}`}],
      chatLoading:  false,
    });
  }
  setTimeout(_scrollChat, 80);
}

function openChatWithGreeting(){
  if(!S.scanResult){ toast('Analyze a scan first to chat about the results.','warn'); return; }
  if(S.chatMessages.length===0){
    const r = S.scanResult;
    const greet = `Hello! I'm your Scanova AI assistant. I can see your scan has been analyzed:\n\n**Result: ${r.prediction==='malignant'?'🔴 Malignant':'🟢 Benign'}** — ${r.probability}% probability, ${r.risk_level?.toUpperCase()} risk.\n\nWhat would you like to know about your results?`;
    set({chatMessages:[{role:'assistant',content:greet}], chatOpen:true});
    return;
  }
  set({chatOpen:!S.chatOpen});
}

async function renameScan(scanId, newLabel){
  newLabel = (newLabel||'').trim();
  try{
    await api('PATCH', `/api/scans/${scanId}/label`, {label: newLabel});
    const scans = (S.data.scans||[]).map(s=> s.id===scanId ? {...s, label: newLabel||null} : s);
    set({data:{...S.data, scans}});
    toast(newLabel ? `Renamed to "${newLabel}"` : 'Name cleared');
  }catch(e){ toast(e.message,'error'); }
}

async function deleteScan(scanId, displayName){
  if(!confirm(`Delete "${displayName}"?\n\nThis will permanently remove the scan and its analysis. This cannot be undone.`)) return;
  try{
    await api('DELETE', `/api/scans/${scanId}`);
    const scans = (S.data.scans||[]).filter(s=> s.id!==scanId);
    set({data:{...S.data, scans, scansLoaded:true}});
    toast('Scan deleted successfully.');
    loadStats();
  }catch(e){
    if(e.message.includes('405') || e.message.includes('404')){
      toast('Server not updated — please restart the Flask server (python app.py) and try again.','error');
    } else {
      toast(e.message,'error');
    }
  }
}

async function loadDCSessions(styleOverride){
  // Refresh sessions list without clearing the active chat UI.
  // (Active chat is cleared on login/logout via _resetUserScopedState().)
  const role0  = S.user?.role || 'patient';
  const style0 = role0==='admin' ? (styleOverride || S.dcStyle || 'normal') : '';
  // If admin is switching modes, clear the list immediately to avoid showing other mode's chats.
  if(role0==='admin' && styleOverride){
    set({dcSessions: [], dcSessionsLoaded: false, dcActiveId: null, dcMessages: []});
  }else{
    set({dcSessionsLoaded: false});
  }
  try{
    const role  = S.user?.role || 'patient';
    const style = role==='admin' ? (styleOverride || S.dcStyle || 'normal') : '';
    const qs    = style ? `?style=${encodeURIComponent(style)}` : '';
    const sessions = await api('GET', `/api/direct-chats${qs}`);
    const activeOk = sessions.some(s=>s.id===S.dcActiveId);
    set({dcSessions: sessions, dcSessionsLoaded: true});
    // Do NOT auto-open a past chat. Only open when the user clicks a session,
    // or when they explicitly create a new chat.
    if(!activeOk){
      set({dcActiveId: null, dcMessages: []});
    }
  }catch(e){}
}

function _scrollDC(){
  setTimeout(()=>{ const el=document.getElementById('dc-msgs'); if(el) el.scrollTop=el.scrollHeight; },60);
}

window.openDirectChat = async function(id){
  // Don't skip loading just because the session is already selected.
  // (loadDCSessions() may set dcActiveId before calling openDirectChat().)
  const same = (S.dcActiveId === id);
  if(same && Array.isArray(S.dcMessages) && S.dcMessages.length > 0) return;
  set({dcActiveId:id, dcMessages: same ? (S.dcMessages||[]) : [], dcSending:false});
  try{
    const data = await api('GET',`/api/direct-chats/${id}`);
    set({dcMessages: data.messages, dcStyle: data.session.style||'normal'});
    _scrollDC();
  }catch(e){ toast(e.message,'error'); }
};

window.deleteDirectChat = function(id, e){
  e && e.stopPropagation();
  showModal('Delete Chat','Permanently delete this conversation?',[
    {label:'Cancel',style:'secondary',cb:closeModal},
    {label:'Delete', style:'primary',cb:async()=>{
      closeModal();
      try{
        await api('DELETE',`/api/direct-chats/${id}`);
        const remaining = S.dcSessions.filter(s=>s.id!==id);
        const nextId    = S.dcActiveId===id ? (remaining[0]?.id||null) : S.dcActiveId;
        set({dcSessions:remaining, dcActiveId:nextId, dcMessages:[]});
        if(nextId && nextId!==S.dcActiveId) window.openDirectChat(nextId);
        toast('Chat deleted');
      }catch(e){ toast(e.message,'error'); }
    }}
  ]);
};

window.sendDCMessage = async function(prefill){
  const inputEl = document.getElementById('dc-input');
  const msg     = prefill || (inputEl && inputEl.value.trim());
  if(!msg || S.dcSending) return;
  if(inputEl){ inputEl.value=''; inputEl.style.height='auto'; }

  let sid = S.dcActiveId;
  if(!sid){
    try{
      const s = await api('POST','/api/direct-chats',{style:S.dcStyle});
      sid = s.id;
      set({dcSessions:[s,...S.dcSessions], dcActiveId:sid, dcMessages:[]});
    }catch(e){ toast(e.message,'error'); return; }
  }

  const newMsgs = [...S.dcMessages, {role:'user',content:msg}];
  set({dcMessages:newMsgs, dcSending:true});
  _scrollDC();

  try{
    const res   = await api('POST',`/api/direct-chats/${sid}/message`,{message:msg});
    const reply = res.response || 'Sorry, I could not generate a response.';
    set({dcMessages:[...newMsgs,{role:'assistant',content:reply}], dcSending:false});
    // refresh session list to update title + timestamp
    loadDCSessions();
    _scrollDC();
  }catch(e){
    set({dcMessages:[...newMsgs,{role:'assistant',content:`Sorry — ${e.message}`}], dcSending:false});
    _scrollDC();
  }
};

function render(){
  const pgEl = document.getElementById('_pg');

  // ── Partial update: already in app, only swap page content ──
  if(S.view==='app' && pgEl){
    // If MFA is required right after signup, show a gated MFA-only screen.
    if(S.mfaSetupRequired){
      pgEl.innerHTML = renderMfaGate();
      bind();
      return;
    }
    pgEl.innerHTML = renderPage();

    // Sync nav active highlights without touching the sidebar
    const navPage = S.page === 'user-detail' ? (S.userDetailReturn || 'users') : S.page;
    document.querySelectorAll('a[data-nav]').forEach(a=>{
      const active = a.dataset.nav === navPage;
      a.className = `flex items-center px-6 py-3 cursor-pointer transition-all ease-in-out duration-200 ${active?'nav-active text-primary':'text-on-surface-variant hover:bg-white/50'}`;
    });

    // Sync pending-requests badge
    const count = S.user?.role==='admin' ? (S.data.stats?.pending_role_requests||0) : 0;
    document.querySelectorAll('a[data-nav="role-requests"] span.ml-auto').forEach(b=>{
      b.textContent = count; b.style.display = count>0?'':'none';
    });

    bind(); return;
  }

  // ── Full render: view switch (landing/login/register/app) ───
  document.getElementById('app').innerHTML =
    S.view==='landing'  ? renderLanding()  :
    S.view==='login'    ? renderLogin()    :
    S.view==='register' ? renderRegister() :
    S.view==='mfa-gate' ? renderMfaGate()  :
    renderApp();
  bind();
}

  if(role==='radiologist') return renderRadiologistDash(s) + renderAwarenessCard('app') + renderRoleUpgradeCard();
  if(role==='patient')     return renderPatientDash(s) + renderAwarenessCard('app') + renderRoleUpgradeCard();
  if(role==='clinic')      return renderClinicDash(s) + renderAwarenessCard('app') + renderRoleUpgradeCard();
  if(role==='admin')       return renderAdminDash(s) + renderAwarenessCard('app');

// ── Radiologist dashboard ─────────────────────────────
function renderRadiologistDash(s){
  // Real appointments queue from backend
  const allQueue = s.queue || [];
  const qItems   = allQueue.filter(q =>
    S.queueFilter==='ALL' || (q.type||'').toUpperCase().includes(S.queueFilter)
  );

  // Real 7-day throughput from backend
  const throughput = s.throughput || [];
  const maxCount   = Math.max(1, ...throughput.map(t=>t.count));
  const todayStr   = new Date().toISOString().slice(0,10);

  function qStatusColor(status){
    if(status==='in_progress') return 'text-primary';
    if(status==='completed')   return 'text-tertiary';
    return 'text-on-surface-variant';
  }
  function qTimingLabel(minsAgo){
    if(minsAgo < -60) return `in ${Math.round(-minsAgo/60)}h`;
    if(minsAgo < 0)   return `in ${-minsAgo}m`;
    if(minsAgo===0)   return 'now';
    if(minsAgo < 60)  return `${minsAgo}m ago`;
    return `${Math.round(minsAgo/60)}h ago`;
  }

  return `
  <section class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 shadow-sm">
      <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1">Scheduled</p>
      <span class="text-3xl font-bold text-primary">${s.pending_scans??0}</span>
    </div>
    <div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 shadow-sm">
      <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1">Total Scans</p>
      <span class="text-3xl font-bold text-on-surface">${s.total_scans??0}</span>
    </div>
    <div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 shadow-sm">
      <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1">High Risk Scans</p>
      <span class="text-3xl font-bold text-error">${s.critical_finds??0}</span>
    </div>
    <div class="bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/10 shadow-sm">
      <p class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-1">Today's Scans</p>
      <span class="text-3xl font-bold text-tertiary">${throughput.find(t=>t.date===todayStr)?.count??0}</span>
    </div>
  </section>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Queue (real appointments) -->
    <div class="lg:col-span-2 bg-surface-container-lowest rounded-2xl p-8 border border-outline-variant/10 shadow-sm">
      <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
        <div>
          <h3 class="text-xl font-bold text-on-surface">Appointment Queue</h3>
          <p class="text-xs text-on-surface-variant mt-0.5">Scheduled &amp; in-progress appointments</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          ${['ALL','MAMMOGRAPHY','MRI','ULTRASOUND'].map(f=>`
          <button onclick="set({queueFilter:'${f}'})" class="px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${S.queueFilter===f?'bg-secondary-container text-on-secondary-container':'hover:bg-surface-container-high text-on-surface-variant'}">${f==='MAMMOGRAPHY'?'MAMMO':f}</button>`).join('')}
        </div>
      </div>
      <div class="space-y-3">
        ${qItems.length===0?`
        <div class="text-center py-12 text-on-surface-variant">
          <span class="material-symbols-outlined text-4xl block mb-3 text-primary-container">event_available</span>
          <p class="font-medium">${allQueue.length===0?'No upcoming appointments scheduled':'No appointments match this filter'}</p>
          <button onclick="navTo('schedule')" class="mt-4 text-sm text-primary font-bold hover:underline">Go to Scheduling →</button>
        </div>`:
        qItems.map(q=>{
          const isPast = q.mins_ago > 0;
          const statusCls = q.status==='in_progress' ? 'border-l-4 border-primary' : '';
          const iconColor = q.status==='in_progress' ? 'text-primary' : 'text-on-surface-variant';

              <span class="material-symbols-outlined ${iconColor} text-xl">event</span>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="font-bold text-on-surface text-sm truncate">${q.patient_name||'Unknown Patient'}</h4>
              <p class="text-xs text-on-surface-variant">${q.type||'Appointment'} · ${q.date||''} ${q.time||''}</p>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="text-xs font-bold px-2 py-1 rounded-full ${q.status==='in_progress'?'bg-primary/10 text-primary':'bg-surface-container text-on-surface-variant'}">${q.status==='in_progress'?'In Progress':'Scheduled'}</div>
              <p class="text-[10px] text-on-surface-variant/60 mt-1">${qTimingLabel(q.mins_ago)}</p>
            </div>
          </div>`; }).join('')}
      </div>
      ${qItems.length>0?`
      <button onclick="navTo('schedule')" class="mt-5 w-full text-center text-sm font-bold text-primary hover:underline py-2">

            <span class="material-symbols-outlined text-primary">upload_file</span>Analyze New Scan
          </button>

            <span class="material-symbols-outlined text-primary">folder_shared</span>Patient Records
          </button>

            <span class="material-symbols-outlined text-primary">history</span>My Scan History

          </button>

      <!-- Real scan throughput (last 7 days) -->
      <div class="bg-surface-container-lowest rounded-2xl p-6 border border-outline-variant/10 shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <h4 class="font-bold text-on-surface">Scan Throughput</h4>
          <span class="text-[10px] font-bold text-tertiary uppercase tracking-wider flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-tertiary rounded-full inline-block"></span>Last 7 days
          </span>
        </div>
        ${throughput.length===0?`<p class="text-xs text-on-surface-variant text-center py-6">No scan data yet</p>`:`
        <div class="h-32 flex items-end gap-1.5">
          ${throughput.map((t,i)=>{
            const pct = maxCount>0 ? Math.round((t.count/maxCount)*100) : 0;
            const isToday = t.date===todayStr;
            const barH = t.count>0 ? Math.max(pct,6) : 0;
            return `<div class="flex-1 flex flex-col items-center justify-end gap-1" style="height:100%">
              <span class="text-[9px] font-bold text-on-surface-variant/60">${t.count>0?t.count:''}</span>
              ${barH>0
                ? `<div class="w-full rounded-t-md transition-all" title="${t.day} ${t.date}: ${t.count} scan${t.count!==1?'s':''}"
                    style="height:${barH}%;background:${isToday?'#99415a':'rgba(153,65,90,0.3)'}"></div>`
                : `<div class="w-full rounded-t-sm" title="${t.day} ${t.date}: 0 scans"
                    style="height:2px;background:rgba(153,65,90,0.1)"></div>`}
            </div>`;
          }).join('')}
        </div>
        <div class="flex justify-between mt-2 text-[9px] font-bold text-on-surface-variant/50 uppercase">
          ${throughput.map(t=>`<span class="${t.date===todayStr?'text-primary':''}">${t.day}</span>`).join('')}
        </div>`}
      </div>
    </div>
  </div>`;
}

// ── Riskometer SVG gauge ──────────────────────────────
function renderRiskometer(risk, prob){
  const p   = Math.min(100, Math.max(0, Number(prob)||0));
  const uid = 'rm' + Math.random().toString(36).slice(2,8);
  // CSS rotation: -90° = leftmost (0%), +90° = rightmost (100%)
  const targetRot = -90 + (p / 100) * 180;
  const col = ({
    high:    {stroke:'#ef4444', text:'text-red-600',    bg:'from-red-50/70 to-rose-50/40',      border:'border-red-200/60'},
    medium:  {stroke:'#f59e0b', text:'text-amber-600',  bg:'from-amber-50/70 to-yellow-50/40',  border:'border-amber-200/60'},
    low:     {stroke:'#10b981', text:'text-emerald-600',bg:'from-emerald-50/70 to-teal-50/40',  border:'border-emerald-200/60'},
    unknown: {stroke:'#9ca3af', text:'text-gray-500',   bg:'from-gray-50/70 to-slate-50/40',    border:'border-gray-200/60'},
  })[risk] || {stroke:'#9ca3af',text:'text-gray-500',bg:'from-gray-50',border:'border-gray-200/60'};
  const riskLabel = ({high:'High Risk',medium:'Medium Risk',low:'Low Risk',unknown:'No Data'})[risk]||risk;
  const riskMsg   = ({
    high:    'Requires prompt medical attention',
    medium:  'Further evaluation recommended',
    low:     'Within normal range — keep screening',
    unknown: 'Upload a scan to see your risk level',
  })[risk]||'';
  return `
  <style>
    @keyframes ${uid}-n{from{transform:rotate(-90deg)}to{transform:rotate(${targetRot}deg)}}
    #${uid}-g{transform-origin:100px 100px;animation:${uid}-n 1.4s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes ${uid}-f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    #${uid}-w{animation:${uid}-f .5s ease forwards}
  </style>
  <div id="${uid}-w" class="bg-gradient-to-br ${col.bg} rounded-2xl p-5 border ${col.border} shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <h4 class="font-extrabold text-on-surface text-xs uppercase tracking-widest flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">speed</span>Risk Meter
      </h4>
      <span class="text-xs font-bold ${col.text} bg-white/70 rounded-full px-3 py-1 border ${col.border} backdrop-blur-sm">${riskLabel}</span>
    </div>
    <div class="flex flex-col items-center">
      <svg viewBox="0 0 200 118" class="w-full max-w-[240px] select-none" overflow="visible">
        <path d="M 20 100 A 80 80 0 0 1 180 100" stroke="rgba(0,0,0,0.07)" stroke-width="16" fill="none" stroke-linecap="round"/>
        <path d="M 20 100 A 80 80 0 0 1 60 30.7"   stroke="#10b981" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.8"/>
        <path d="M 60 30.7 A 80 80 0 0 1 140 30.7" stroke="#f59e0b" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.8"/>
        <path d="M 140 30.7 A 80 80 0 0 1 180 100" stroke="#ef4444" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.8"/>
        <line x1="20"  y1="100" x2="27"  y2="100" stroke="white" stroke-width="2.5" opacity="0.9"/>
        <line x1="100" y1="20"  x2="100" y2="27"  stroke="white" stroke-width="2.5" opacity="0.9"/>
        <line x1="180" y1="100" x2="173" y2="100" stroke="white" stroke-width="2.5" opacity="0.9"/>
        <text x="12"  y="116" font-size="8.5" font-weight="800" fill="#10b981" text-anchor="middle">LOW</text>
        <text x="100" y="11"  font-size="8.5" font-weight="800" fill="#f59e0b" text-anchor="middle">MED</text>
        <text x="188" y="116" font-size="8.5" font-weight="800" fill="#ef4444" text-anchor="middle">HIGH</text>
        <g id="${uid}-g">
          <line x1="100" y1="100" x2="100" y2="26" stroke="${col.stroke}" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
          <circle cx="100" cy="26" r="4" fill="${col.stroke}"/>
        </g>
        <circle cx="100" cy="100" r="9"   fill="${col.stroke}" opacity="0.9"/>
        <circle cx="100" cy="100" r="4.5" fill="white"/>
        <text x="100" y="90" font-size="21" font-weight="900" fill="${col.stroke}" text-anchor="middle" font-family="system-ui,sans-serif">${Math.round(p)}%</text>
        <text x="100" y="116" font-size="7.5" font-weight="600" fill="rgba(0,0,0,0.35)" text-anchor="middle">MALIGNANCY PROBABILITY</text>
      </svg>
      <p class="text-xs text-on-surface-variant font-medium text-center mt-1">${riskMsg}</p>
    </div>
  </div>`;
}

// ── Role upgrade card (for non-admin users in their dashboard) ────────────
function renderRoleUpgradeCard(){
  const myReqs    = S.data.myRoleRequests || [];
  const pending   = myReqs.find(r=>r.status==='pending');
  const resolved  = myReqs.find(r=>r.status==='approved'||r.status==='rejected');
  const roleLabels= {radiologist:'Radiologist',clinic:'Clinic / Hospital',admin:'Administrator'};
  // available upgrade targets (exclude current role)
  const upgradable= ['radiologist','clinic','admin'].filter(r=>r!==S.user.role);
  if(!upgradable.length) return '';  // already admin or no upgrades possible
  if(!upgradable.includes(S.roleReqRole)) S.roleReqRole = upgradable[0];

  // ── If a request was already resolved, show final status only — no form ──
  if(resolved){
    const approved = resolved.status==='approved';
    return `
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10 mt-2">
      <h3 class="text-lg font-bold text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined ${approved?'text-tertiary':'text-error'}">verified_user</span>Role Upgrade Request
      </h3>
      <div class="flex items-start gap-4 ${approved?'bg-green-50 border-green-200':'bg-error-container/30 border-error/20'} border rounded-xl px-5 py-5">
        <span class="material-symbols-outlined ${approved?'text-tertiary':'text-error'} text-3xl mt-0.5" style="font-variation-settings:'FILL' 1">${approved?'check_circle':'cancel'}</span>
        <div class="flex-1">
          <p class="font-bold ${approved?'text-tertiary':'text-error'} text-sm">${approved?'Request Approved':'Request Rejected'}</p>
          <p class="text-sm text-on-surface-variant mt-1">
            ${approved
              ? `Your request for <strong>${roleLabels[resolved.requested_role]||resolved.requested_role}</strong> access was approved by the admin.`
              : `Your request for <strong>${roleLabels[resolved.requested_role]||resolved.requested_role}</strong> access was not approved.`}
            ${resolved.admin_notes?`<br/><em class="text-xs">"${resolved.admin_notes}"</em>`:''}
          </p>
          ${approved?`
          <p class="text-xs text-on-surface-variant/70 mt-2">Please <strong>sign out and sign back in</strong> to activate your new access level.</p>`:`
          <p class="text-xs text-on-surface-variant/70 mt-2">To request again, please contact the admin directly.</p>
          <a href="mailto:admin@scanova.com" class="inline-flex items-center gap-1.5 mt-2 text-sm font-bold text-primary hover:underline">
            <span class="material-symbols-outlined text-base">mail</span>admin@scanova.com
          </a>`}
        </div>
      </div>
    </div>`;
  }

  // ── 1-hour window check ──────────────────────────────
  const createdAt   = S.user.created ? new Date(S.user.created.replace(' ','T')+'Z') : null;
  const msElapsed   = createdAt ? (Date.now() - createdAt.getTime()) : Infinity;
  const windowOpen  = msElapsed <= 60 * 60 * 1000;
  const minutesLeft = windowOpen ? Math.ceil((60*60*1000 - msElapsed) / 60000) : 0;

  // ── Window expired with no request ever made ─────────
  if(!windowOpen && !pending){
    return `
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10 mt-2">
      <h3 class="text-lg font-bold text-on-surface mb-1 flex items-center gap-2">
        <span class="material-symbols-outlined text-on-surface-variant">verified_user</span>Request Role Upgrade
      </h3>
      <div class="flex items-start gap-4 bg-amber-50 border border-amber-200 rounded-xl px-5 py-5 mt-4">
        <span class="material-symbols-outlined text-amber-600 text-2xl mt-0.5">schedule</span>
        <div>
          <p class="font-bold text-amber-700 text-sm">Upgrade window expired</p>
          <p class="text-sm text-amber-600 mt-1 leading-relaxed">The 1-hour self-service window for role upgrade requests has passed. Please contact the admin directly.</p>
          <a href="mailto:admin@scanova.com" class="inline-flex items-center gap-1.5 mt-3 text-sm font-bold text-primary hover:underline">
            <span class="material-symbols-outlined text-base">mail</span>admin@scanova.com
          </a>
        </div>
      </div>
    </div>`;
  }

  // ── Pending request ───────────────────────────────────
  if(pending){
    return `
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10 mt-2">
      <h3 class="text-lg font-bold text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-amber-500">verified_user</span>Role Upgrade Request
      </h3>
      <div class="flex items-center gap-4 bg-amber-50 border border-amber-200 rounded-xl px-5 py-4">
        <span class="material-symbols-outlined text-amber-600 text-2xl">hourglass_top</span>
        <div>
          <p class="font-bold text-amber-700 text-sm">Request Pending</p>
          <p class="text-xs text-amber-600 mt-0.5">Awaiting admin approval for <strong>${roleLabels[pending.requested_role]||pending.requested_role}</strong> role · submitted ${timeAgo(pending.created)}</p>
        </div>
      </div>
    </div>`;
  }

  // ── No request yet — show the form ───────────────────
  return `
  <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10 mt-2">
    <div class="flex items-center justify-between mb-1 flex-wrap gap-2">
      <h3 class="text-lg font-bold text-on-surface flex items-center gap-2">
        <span class="material-symbols-outlined text-primary">verified_user</span>Request Role Upgrade
      </h3>
      <span class="flex items-center gap-1.5 text-xs font-bold text-amber-600 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-full">
        <span class="material-symbols-outlined text-sm">timer</span>${minutesLeft} min remaining
      </span>
    </div>
    <p class="text-sm text-on-surface-variant mb-5">Need more access? Submit a request within your 1-hour window. After that, contact the admin directly.</p>
    <div class="space-y-4">

(function(){

      title: 'Lump or thickening',
      what:  'A new lump can be caused by a cyst or other non-cancer changes. It still deserves attention, especially if it feels hard or is growing.',
      help:  'Get checked if it is new and lasts more than 1–2 weeks, grows, or feels hard/fixed.'
    },
    dimpling: {
      title: 'Skin dimpling or puckering',
      what:  'Dimpling can happen when the tissue under the skin changes and pulls the skin inward.',
      help:  'Get checked if it is new, on one side, or happens with a lump.'
    },
    retraction: {
      title: 'Nipple changes (retraction)',
      what:  'A nipple that suddenly turns inward can be related to infection, scarring, or other changes.',
      help:  'Get checked if it is new, only on one side, or happens with discharge or a lump.'
    },
    discharge: {
      title: 'Nipple discharge',
      what:  'Discharge can be normal in some situations (for example, pregnancy or breastfeeding). Some types need evaluation.',
      help:  'Get checked if it is bloody, happens without squeezing, or comes from one nipple only.'
    },
    rash: {
      title: 'Redness or rash',
      what:  'Redness may come from irritation or infection. A rash that does not improve should be assessed.',
      help:  'Get checked if it lasts longer than 1–2 weeks, spreads, or comes with warmth, swelling, or fever.'
    },
    swelling: {
      title: 'Swelling',
      what:  'Swelling can be hormonal or inflammatory, and sometimes relates to infection or fluid changes.',
      help:  'Get checked if swelling is sudden, one-sided, painful, or comes with redness or fever.'
    },
    pain: {
      title: 'Pain or tenderness',
      what:  'Breast pain is common and is often linked to hormones, muscle strain, or cysts.',
      help:  'Get checked if pain is new, one-sided, severe, or you also notice a lump, discharge, or skin changes.'
    },
    thickened: {
      title: 'Thickened area',
      what:  'A thickened patch of tissue may be benign, but a new or changing area should be assessed.',
      help:  'Get checked if it persists, grows, or feels firm compared to the other side.'
    },
    size_shape: {
      title: 'Change in size or shape',
      what:  'Changes can happen for many reasons. Persistent one-sided changes are worth checking.',
      help:  'Get checked if it is new and does not settle, or if it comes with skin or nipple changes.'
    },
  };

  function closeAll(){
    document.querySelectorAll('[data-aware-detail]').forEach(d=>{
      d.classList.remove('open');
      d.innerHTML = '';
    });
    document.querySelectorAll('[data-aware]').forEach(b=>{
      b.parentElement?.classList?.remove('aware-open');
    });
  }

  document.addEventListener('click', function(e){
    const btn = e.target.closest('[data-aware]');
    if(!btn) return;
    const k = btn.getAttribute('data-aware');
    const item = info[k];
    if(!item) return;
    e.preventDefault();

    const panel = btn.parentElement?.querySelector?.(`[data-aware-detail="${k}"]`);
    if(!panel) return;

    const isOpen = panel.classList.contains('open');
    closeAll();
    if(isOpen) return;

    panel.innerHTML = `
      <div class="space-y-3 text-sm text-on-surface-variant leading-relaxed">
        <p><strong class="text-on-surface">${item.title}:</strong> ${item.what}</p>
        <div class="p-3 rounded-xl bg-surface-container-lowest border border-outline-variant/10">
          <p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-1">When to get help</p>
          <p class="text-sm text-on-surface-variant">${item.help}</p>
        </div>
      </div>`;
    panel.classList.add('open');
    btn.parentElement?.classList?.add('aware-open');
  });
})();

// ── Schedule page ─────────────────────────────────────
function renderSchedule(){
  const appts = S.data.schedule || [];
  if(!S.data.scheduleLoaded){ loadSchedule(); return `<div class="flex flex-col items-center py-20 gap-4 text-on-surface-variant"><span class="material-symbols-outlined text-5xl animate-spin text-primary">refresh</span>Loading schedule…</div>`; }

  const today = new Date().toISOString().split('T')[0];

  // Split into active vs history
  const active  = appts.filter(a => a.status==='scheduled' || a.status==='in_progress' || a.status==='in-progress');
  const history = appts.filter(a => a.status==='completed' || a.status==='cancelled');

  // Stats
  const todayActive = active.filter(a=>a.date===today).length;
  const upcoming    = active.filter(a=>a.date>today).length;
  const completed   = appts.filter(a=>a.status==='completed').length;

  // History filter
  const hf = S.apptHistoryFilter || 'all';
  const historyFiltered = hf==='all' ? history
    : history.filter(a => a.status===hf || a.status===hf.replace('_','-'));

  const statusBadge = s =>
    s==='completed'    ? 'bg-surface-container text-tertiary' :
    s==='cancelled'    ? 'bg-error-container text-error' :
    s==='in_progress'||s==='in-progress' ? 'bg-amber-100 text-amber-700' :
                         'bg-secondary-container text-on-secondary-container';

  const statusLabel = s =>
    s==='in_progress'||s==='in-progress' ? 'In Progress' :
    s.charAt(0).toUpperCase()+s.slice(1);

  function apptCard(a, allowStatusChange){
    const isToday = a.date===today;
    const dateObj = new Date(a.date+'T12:00:00');
    return `
    <div class="flex items-center gap-4 p-4 rounded-xl bg-surface hover:bg-surface-container-low transition-all ${isToday&&allowStatusChange?'border-l-4 border-primary':''}">
      <div class="w-12 h-12 rounded-xl flex-shrink-0 flex flex-col items-center justify-center text-center
        ${isToday&&allowStatusChange?'bg-primary text-on-primary':'bg-surface-container-high text-on-surface-variant'}">
        <span class="text-[10px] font-bold uppercase">${dateObj.toLocaleString('default',{month:'short'})}</span>
        <span class="text-lg font-bold leading-none">${a.date.split('-')[2]}</span>
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="font-bold text-on-surface text-sm">${a.patient_name}</h4>
        <p class="text-xs text-on-surface-variant">${a.time} · ${a.type}${a.doctor?' · '+a.doctor:''}</p>
        ${a.notes?`<p class="text-xs text-on-surface-variant/60 mt-0.5">${a.notes}</p>`:''}
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        ${allowStatusChange?`
        <select onchange="updateApptStatus(${a.id},this.value)"
          class="text-xs px-2 py-1.5 rounded-lg border border-outline-variant/20 bg-surface-container text-on-surface font-semibold cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary/20">
          <option value="scheduled"    ${a.status==='scheduled'  ?'selected':''}>Scheduled</option>
          <option value="in_progress"  ${a.status==='in_progress'||a.status==='in-progress'?'selected':''}>In Progress</option>
          <option value="completed"    ${a.status==='completed'  ?'selected':''}>Completed</option>
          <option value="cancelled"    ${a.status==='cancelled'  ?'selected':''}>Cancelled</option>
        </select>`:`
        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${statusBadge(a.status)}">${statusLabel(a.status)}</span>`}
        <button onclick="deleteAppointment(${a.id},'${a.status}')" title="Delete"
          class="p-1.5 rounded-lg hover:bg-error-container text-on-surface-variant hover:text-error transition-all">
          <span class="material-symbols-outlined text-base">delete</span>
        </button>
      </div>
    </div>`;

    </div>
  </div>`:''}

  <!-- Stats -->

          {key:'in_progress',label:'In Progress',count: history.filter(a=>a.status==='in_progress'||a.status==='in-progress').length},
          {key:'completed', label:'Completed',   count: history.filter(a=>a.status==='completed').length},
          {key:'cancelled', label:'Cancelled',   count: history.filter(a=>a.status==='cancelled').length},
        ].map(f=>`
        <button onclick="set({apptHistoryFilter:'${f.key}'})"
          class="px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1

          ${f.label}

    <div class="space-y-3">
      ${historyFiltered.map(a=>apptCard(a, false)).join('')}
    </div>`}`}
  </div>`;
}

// ── Admin: User Detail Page ───────────────────────────
function renderUserDetail(){
  const d = S.adminUserDetail;
  const riskColor = {high:'bg-error-container text-error', medium:'bg-amber-100 text-amber-700', low:'bg-green-100 text-green-700', unknown:'bg-surface-container text-on-surface-variant'};
  const roleColor = {radiologist:'bg-secondary-container text-on-secondary-container', patient:'bg-surface-container text-tertiary', clinic:'bg-amber-100 text-amber-700', admin:'bg-error-container text-error'};
  const pct = v => {
    if(v==null || v==='' || Number.isNaN(Number(v))) return '—';
    let n = Number(v);
    // Accept either 0..1 or 0..100 (and tolerate legacy 983 => 98.3)
    if(n <= 1) n = n * 100;
    while(n > 100) n = n / 10;
    if(n < 0) n = 0;
    if(n > 100) n = 100;
    const s = (Math.round(n * 10) / 10).toFixed(n % 1 === 0 ? 0 : 1);
    return s + '%';
  };

  if(!d){
    return `
    <div class="flex flex-col items-center py-24 gap-4 text-on-surface-variant">
      <span class="material-symbols-outlined text-5xl animate-spin text-primary">refresh</span>
      <p>Loading user profile…</p>
    </div>`;
  }

  const u     = d.user;
  const scans = d.scans || [];
  const reqs  = d.role_requests || [];
  const st    = d.stats || {};
  const initials = u.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

  const statCards = [
    {icon:'biotech',      label:'Total Scans',  val: st.total_scans||0,   color:'text-primary'},
    {icon:'warning',      label:'High Risk',    val: st.high_risk||0,     color:'text-error'},
    {icon:'analytics',    label:'Malignant',    val: st.malignant||0,     color:'text-amber-600'},
    {icon:'check_circle', label:'Benign',       val: st.benign||0,        color:'text-green-600'},
    {icon:'chat',         label:'Scan Chats',   val: st.chat_msgs||0,     color:'text-secondary'},
    {icon:'smart_toy',    label:'AI Messages',  val: st.ai_chats||0,      color:'text-tertiary'},
  ];

  return `
  <!-- Back bar -->
  <div class="flex items-center gap-3 mb-6 flex-wrap">
    <button type="button" onclick="navTo('${(S.userDetailReturn||'users')}')" class="flex items-center gap-2 text-sm font-bold text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-base">arrow_back</span>
      ${(S.userDetailReturn||'users')==='admin-logs' ? 'Back to Activity Logs' : 'Back to User Management'}
    </button>
    <span class="text-on-surface-variant/40">·</span>
    <span class="text-sm text-on-surface-variant">${u.name}</span>
  </div>

  <!-- Profile header card -->
  <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/10 p-6 mb-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-5">
      <div class="w-16 h-16 rounded-full ${roleColor[u.role]||'bg-surface-container text-on-surface'} flex items-center justify-center font-black text-2xl flex-shrink-0">
        ${initials}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap items-center gap-3 mb-1">
          <h2 class="text-xl font-black text-on-surface">${u.name}</h2>
          <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase ${roleColor[u.role]||''}">${u.role}</span>
        </div>
        <p class="text-sm text-on-surface-variant">${u.email}</p>
        <p class="text-xs text-on-surface-variant/60 mt-1">Member since ${fmtDate(u.created)}</p>
      </div>
      <div class="flex gap-2 flex-shrink-0">
        <button onclick="exportUserPDF()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-primary text-on-primary text-sm font-bold hover:bg-primary/90 shadow transition-all">
          <span class="material-symbols-outlined text-base">picture_as_pdf</span>
          Export PDF
        </button>
      </div>
    </div>
  </div>

  <!-- Stats row -->
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
    ${statCards.map(s=>`
    <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/10 p-4 text-center">
      <span class="material-symbols-outlined text-2xl ${s.color} block mb-1">${s.icon}</span>
      <div class="text-2xl font-black text-on-surface">${s.val}</div>
      <div class="text-[10px] text-on-surface-variant uppercase tracking-wide mt-0.5">${s.label}</div>
    </div>`).join('')}
  </div>

  <!-- Scan History -->
  <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/10 overflow-hidden mb-6">
    <div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant/10">
      <h3 class="font-bold text-on-surface flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-xl">biotech</span>
        Scan History
        <span class="ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary/10 text-primary">${scans.length}</span>
      </h3>
    </div>
    ${scans.length===0?`

// ── Role Requests page (admin) ────────────────────────
function renderRoleRequests(){
  const reqs = S.data.roleRequests || [];
  if(!S.data.roleRequestsLoaded){ loadRoleRequests(); return `<div class="flex flex-col items-center py-20 gap-4 text-on-surface-variant"><span class="material-symbols-outlined text-5xl animate-spin text-primary">refresh</span>Loading requests…</div>`; }
  const pending  = reqs.filter(r=>r.status==='pending');
  const resolved = reqs.filter(r=>r.status!=='pending');
  const statusColor = {pending:'bg-amber-100 text-amber-700', approved:'bg-green-100 text-green-700', rejected:'bg-error-container text-error'};
  const statusIcon  = {pending:'hourglass_top', approved:'check_circle', rejected:'cancel'};
  const roleIcon    = {radiologist:'radiology', clinic:'local_hospital', admin:'admin_panel_settings', patient:'person'};

  function reqCard(r){
    return `
    <div class="flex flex-col sm:flex-row sm:items-center gap-4 px-6 py-5 border-b border-outline-variant/10 last:border-0 hover:bg-surface-container-low transition-all">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="font-bold text-on-surface text-sm">${r.user_name||'—'}</span>
          <span class="text-xs text-on-surface-variant">${r.user_email||''}</span>
        </div>
        <div class="flex items-center gap-2 mt-1 flex-wrap">
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-surface-container text-on-surface-variant uppercase">${r.current_role}</span>
          <span class="material-symbols-outlined text-base text-on-surface-variant">arrow_forward</span>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary/10 text-primary uppercase">${r.requested_role}</span>
          <span class="text-xs text-on-surface-variant/60 ml-1">${timeAgo(r.created)}</span>
        </div>
        ${r.reason?`<p class="text-xs text-on-surface-variant mt-1 italic">"${r.reason}"</p>`:''}
        ${r.admin_notes?`<p class="text-xs text-on-surface-variant/70 mt-1">Admin note: ${r.admin_notes}</p>`:''}
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold ${statusColor[r.status]||statusColor.pending}">
          <span class="material-symbols-outlined text-sm">${statusIcon[r.status]||'pending'}</span>${r.status}
        </span>
        ${r.status==='pending'?`
        <button onclick="resolveRoleRequest(${r.id},'approve')" title="Approve" class="p-2 rounded-lg bg-green-100 text-green-700 hover:bg-green-200 transition-all">
          <span class="material-symbols-outlined text-base">check</span>
        </button>
        <button onclick="resolveRoleRequest(${r.id},'reject')" title="Reject" class="p-2 rounded-lg hover:bg-error-container text-on-surface-variant hover:text-error transition-all">
          <span class="material-symbols-outlined text-base">close</span>
        </button>`:''}
      </div>
    </div>`;
  }

  return `
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h2 class="text-2xl font-bold text-on-surface">Role Requests</h2>
      <p class="text-on-surface-variant mt-1">${pending.length} pending · ${resolved.length} resolved</p>
    </div>
    <button onclick="loadRoleRequests()" class="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-surface-container-low text-sm font-bold hover:bg-surface-container transition-all">
      <span class="material-symbols-outlined text-lg">refresh</span>Refresh
    </button>
  </div>

  ${pending.length>0?`
  <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-amber-200 overflow-hidden mb-6">
    <div class="px-6 py-4 border-b border-amber-100 flex items-center gap-2">
      <span class="material-symbols-outlined text-amber-600">hourglass_top</span>
      <h3 class="font-bold text-on-surface">Pending Requests (${pending.length})</h3>
    </div>
    ${pending.map(reqCard).join('')}
  </div>`:
  `<div class="bg-surface-container-lowest rounded-2xl p-10 text-center border border-outline-variant/10 mb-6">
    <span class="material-symbols-outlined text-5xl text-primary-container mb-3 block">verified_user</span>
    <p class="font-bold text-on-surface">No pending requests</p>
    <p class="text-sm text-on-surface-variant mt-1">All role upgrade requests have been handled.</p>
  </div>`}

  ${resolved.length>0?`
  <div class="bg-surface-container-lowest rounded-2xl shadow-sm border border-outline-variant/10 overflow-hidden">
    <div class="px-6 py-4 border-b border-outline-variant/10">
      <h3 class="font-bold text-on-surface">Recent Resolved (${resolved.length})</h3>
    </div>
    ${resolved.slice(0,20).map(reqCard).join('')}
  </div>`:''}`;
}

  const pred     = sc.prediction==='malignant';

                 : sc.risk_level==='medium' ? 'bg-amber-50 text-amber-700 border-amber-200'
                 : 'bg-surface-container text-tertiary border-outline-variant/20';
  const riskIcon = sc.risk_level==='high' ? 'warning' : sc.risk_level==='medium' ? 'info' : 'check_circle';
  const displayName = sc.label || sc.filename || 'Untitled Scan';
  const msgs     = S.detailChatMessages;

  const isAdmin = S.user?.role==='admin';
  const detailStyle = isAdmin ? (S.detailChatStyle||'normal') : 'normal';

  const starters = isAdvanced ? [
    'Interpret the model confidence and uncertainty for this case',

    'Explain the SHAP attribution across imaging modalities',
    'Are there differential diagnoses to consider?',
    'What follow-up imaging or biopsy would you recommend?',
    'Discuss the Grad-CAM saliency findings clinically',

    'What does my result mean?',
    'Should I be worried?',
    'What should I do next?',
    'Is the AI accurate?',
    'Explain in simple words',

  return `

  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">

    <!-- LEFT: Scan details -->
    <div class="space-y-5">

      <!-- Result banner -->
      <div class="rounded-2xl p-6 border shadow-sm ${pred ? 'bg-error-container/20 border-error/20' : 'bg-tertiary/5 border-tertiary/20'}">
        <div class="flex items-center gap-3 mb-4">
          <span class="material-symbols-outlined text-4xl ${pred?'text-error':'text-tertiary'}" style="font-variation-settings:'FILL' 1">${pred?'cancel':'check_circle'}</span>
          <div>
            <h2 class="text-xl font-bold ${pred?'text-error':'text-tertiary'}">${pred?'Malignant Detected':'Benign — No Cancer Detected'}</h2>
            <p class="text-xs text-on-surface-variant mt-0.5">Uploaded ${timeAgo(sc.created)} · ${sc.modality||'Mammography'}</p>

          <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">${riskIcon}</span>
          ${(sc.risk_level||'low').toUpperCase()} RISK
        </div>
      </div>

      <!-- Metrics grid -->
      <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-outline-variant/10">
        <p class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-4">AI Metrics</p>
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-surface-container-low rounded-xl p-4 text-center">
            <div class="text-2xl font-bold text-primary">${sc.probability??'—'}%</div>
            <div class="text-xs text-on-surface-variant mt-1">Cancer Likelihood</div>
          </div>
          <div class="bg-surface-container-low rounded-xl p-4 text-center">
            <div class="text-2xl font-bold text-secondary">${sc.confidence??'—'}%</div>

              <p class="text-[10px] text-on-surface-variant">${

function _dcGroupSessions(sessions){
  const now   = new Date();
  const todayStr = now.toDateString();
  const yest  = new Date(now-86400000).toDateString();
  const w7    = new Date(now-7*86400000);
  const w30   = new Date(now-30*86400000);
  const groups = {};
  const order  = ['Today','Yesterday','Previous 7 Days','Previous 30 Days','Older'];
  sessions.forEach(s=>{
    const d = new Date(s.updated||s.created||'');
    let g;
    if(d.toDateString()===todayStr)  g='Today';
    else if(d.toDateString()===yest) g='Yesterday';
    else if(d>w7)  g='Previous 7 Days';
    else if(d>w30) g='Previous 30 Days';
    else g='Older';
    if(!groups[g]) groups[g]=[];
    groups[g].push(s);
  });
  return order.filter(k=>groups[k]).map(k=>({label:k,items:groups[k]}));
}

            <button onclick="window.sendDCMessage(this.dataset.q)" data-q="${q.replace(/"/g,'&quot;')}"

            ?'bg-primary text-on-primary px-4 py-3 rounded-2xl rounded-tr-sm shadow-sm'

          </div>
          ${m.role==='user'?`
          <div class="w-8 h-8 rounded-xl bg-primary/10 flex items-center justify-center flex-shrink-0 mt-0.5">
            <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings:'FILL' 1">person</span>

        </div>`).join('')}
        ${sending?`
        <div class="dc-msg-anim flex gap-3 justify-start">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br ${cfg.grad} flex items-center justify-center flex-shrink-0 shadow-sm">
            <span class="material-symbols-outlined text-white text-sm animate-spin">refresh</span>
          </div>
          <div class="flex items-center gap-1.5 py-2">
            <span class="w-2.5 h-2.5 bg-on-surface-variant/25 rounded-full animate-bounce" style="animation-delay:0ms"></span>
            <span class="w-2.5 h-2.5 bg-on-surface-variant/25 rounded-full animate-bounce" style="animation-delay:150ms"></span>
            <span class="w-2.5 h-2.5 bg-on-surface-variant/25 rounded-full animate-bounce" style="animation-delay:300ms"></span>
          </div>
        </div>`:''}
      </div>

      <!-- Input bar -->
      <div class="border-t border-outline-variant/10 px-5 py-4 bg-surface-container-low/20 flex-shrink-0">
        <div class="flex gap-3 items-end max-w-3xl mx-auto">
          <textarea id="dc-input" rows="1"
            placeholder="Message AI Assistant…"
            class="flex-1 bg-surface-container-lowest border border-outline-variant/20 rounded-2xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary/40 focus:ring-2 focus:ring-primary/10 resize-none transition-all"
            style="min-height:46px;max-height:140px"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();window.sendDCMessage();}"
            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px'"
          ></textarea>
          <button onclick="window.sendDCMessage()" ${sending?'disabled':''}
            class="w-11 h-11 rounded-2xl bloom-gradient text-white flex items-center justify-center hover:opacity-90 transition-all flex-shrink-0 shadow-md shadow-primary/25 disabled:opacity-40">
            <span class="material-symbols-outlined text-lg" style="font-variation-settings:'FILL' 1">send</span>
          </button>
        </div>
        <p class="text-[10px] text-center text-on-surface-variant/35 mt-2">AI can make mistakes — always verify medical information with a qualified professional.</p>
      </div>
    </div>
  </div>`;
}

// ── bind() — wire up all event listeners ──────────────
function bind(){

  const content = document.querySelector('.p-8.max-w-screen-2xl');
  if(content) content.classList.add('page-enter');

  // ── Landing ──────────────────────────────────────
  document.getElementById('goto-login')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('goto-register-nav')?.addEventListener('click',()=>set({view:'register',error:null}));
  document.getElementById('cta-integrate')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('cta-explore')?.addEventListener('click',()=>{
    document.getElementById('sec-features')?.scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('cta-signin')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('get-started')?.addEventListener('click',()=>{

    document.getElementById('sec-hero')?.scrollIntoView({behavior:'smooth'});

  document.getElementById('lnk-contact')?.addEventListener('click',()=>{
    document.getElementById('sec-contact')?.scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('methodology-btn')?.addEventListener('click',()=>{
    document.getElementById('sec-methodology')?.scrollIntoView({behavior:'smooth'});
  });
  // Footer links on landing
  const privacyText = `<p>Scanova collects only the data needed to provide AI diagnostic services: account information and uploaded scan images. Images are processed locally on our secure server and are never shared with third parties. You can request deletion of your data at any time.</p>`;
  const termsText   = `<p>By using Scanova you agree that: (1) the AI analysis is a decision-support tool and not a substitute for medical advice; (2) a qualified radiologist or physician must review all results; (3) Scanova is not liable for clinical decisions made based on AI output alone.</p>`;
  const hipaaText   = `<p>Scanova implements HIPAA-aligned safeguards including: encrypted JWT authentication, bcrypt password hashing, role-based access control, and audit logging. All patient data is stored in an access-controlled SQLite database. No PHI leaves the server.</p>`;
  const contactText = `<div class="space-y-2"><p>For support, questions, or data requests:</p><p><strong>Email:</strong> support@scanova.ai</p><p><strong>Technical Issues:</strong> admin@scanova.com</p><p class="text-xs text-on-surface-variant/60 mt-4">This is a research prototype — contact your system administrator for institutional access.</p></div>`;
  document.getElementById('footer-privacy')?.addEventListener('click',()=>showModal('Privacy Policy',privacyText));
  document.getElementById('footer-terms')?.addEventListener('click',()=>showModal('Terms of Service',termsText));
  document.getElementById('footer-hipaa')?.addEventListener('click',()=>showModal('HIPAA Compliance',hipaaText));
  document.getElementById('footer-contact')?.addEventListener('click',()=>showModal('Contact Us',contactText));

  // ── Login ────────────────────────────────────────
  document.getElementById('login-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    login(document.getElementById('l-email').value, document.getElementById('l-pw').value);
  });
  document.getElementById('toggle-pw')?.addEventListener('click',()=>{
    const i=document.getElementById('l-pw');
    i.type = i.type==='password' ? 'text' : 'password';
    i.nextElementSibling?.querySelector('.material-symbols-outlined')?.setAttribute('data-icon',i.type==='password'?'visibility':'visibility_off');
  });
  document.getElementById('forgot-pw')?.addEventListener('click',()=>{
    showModal('Forgot Password',
      `<p>To reset your password, please contact your system administrator with your registered email address.</p>
      <p class="mt-3 text-xs text-on-surface-variant/70">Admin contact: <strong>admin@scanova.com</strong></p>`
    );
  });
  document.getElementById('goto-register')?.addEventListener('click',()=>set({view:'register',error:null}));
  document.getElementById('login-privacy')?.addEventListener('click',()=>showModal('Privacy Policy',privacyText));
  document.getElementById('login-hipaa')?.addEventListener('click',()=>showModal('HIPAA Compliance',hipaaText));
  document.getElementById('login-help')?.addEventListener('click',()=>showModal('Need Help?',`
    <div class="space-y-3">
      <p><strong>Signing In:</strong> Use the email and password you registered with. Your role (radiologist, patient, clinic, admin) determines your dashboard.</p>
      <p><strong>Forgotten Password:</strong> Contact your system administrator to reset.</p>
      <p><strong>New Account:</strong> Click "Create an account" on the login page to register.</p>
      <p><strong>Technical Issues:</strong> Contact <strong>admin@scanova.com</strong></p>
    </div>
  `));
  // ── Register ──────────────────────────────────────
  document.getElementById('register-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    const enableMfa = !!document.getElementById('r-enable-mfa')?.checked;
    register(
      document.getElementById('r-name').value,
      document.getElementById('r-email').value,
      document.getElementById('r-pw').value,
      'patient',
      enableMfa
    );
  });
  document.getElementById('goto-login2')?.addEventListener('click',()=>set({view:'login',error:null}));
  document.getElementById('back-to-home-login')?.addEventListener('click',()=>set({view:'landing',error:null}));
  document.getElementById('back-to-home-register')?.addEventListener('click',()=>set({view:'landing',error:null}));

  // ── App shell ─────────────────────────────────────
  document.getElementById('logout-btn')?.addEventListener('click',logout);
  document.getElementById('settings-logout')?.addEventListener('click',logout);
  document.getElementById('help-btn')?.addEventListener('click',()=>{
    showModal('Help Center',`
      <div class="space-y-4">
        <div><strong class="block mb-1">Uploading a Scan</strong><p>Go to "Diagnostic Lens" or "Upload Scan", drop your mammogram (PNG/JPG/DICOM) and click "Analyze with AI". The model processes in seconds.</p></div>
        <div><strong class="block mb-1">Understanding Results</strong><p>Probability = likelihood of malignancy. Confidence = model certainty. Uncertainty = variance across 15 MC Dropout passes. The Grad-CAM heatmap shows which regions drove the prediction.</p></div>
        <div><strong class="block mb-1">Managing Patients</strong><p>Clinic and Admin users can add/remove patients via the Patients page.</p></div>
        <div><strong class="block mb-1">Scheduling</strong><p>Radiologists can schedule and manage patient appointments in the Scheduling page.</p></div>
        <p class="text-xs text-on-surface-variant/60 mt-4">Contact: admin@scanova.com</p>
      </div>
    `);
  });
  document.getElementById('notif-btn')?.addEventListener('click',()=>{
    toast('No new notifications', 'info');
  });
  // ── Avatar dropdown ──────────────────────────────────
  const avatarWrap = document.getElementById('avatar-wrap');
  const avatarMenu = document.getElementById('avatar-menu');
  const avatarEl   = document.getElementById('user-avatar');
  if(avatarEl){
    // bind() runs frequently; avoid stacking click handlers
    avatarEl.onclick = (e)=>{
      e.stopPropagation();
      avatarMenu?.classList.toggle('hidden');
    };
  }
  // Close dropdown when clicking anywhere outside (register once globally)
  if(!window._avatarOutsideClick){
    window._avatarOutsideClick = true;
    document.addEventListener('click', e => {
      const wrap = document.getElementById('avatar-wrap');
      const menu = document.getElementById('avatar-menu');
      if(wrap && !wrap.contains(e.target)) menu?.classList.add('hidden');
    });
  }

  const ddLogout = document.getElementById('dd-logout');
  if(ddLogout){
    ddLogout.onclick = ()=>{
      avatarMenu?.classList.add('hidden');
      logout();
    };
  }

  // Admin-only dropdown: Account Info + Change Password inline modals
  const ddAccount = document.getElementById('dd-account');
  if(ddAccount) ddAccount.onclick = ()=>{
    avatarMenu?.classList.add('hidden');
    showModal('Account Information',`
      <div class="space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Full Name</label>
          <input id="dd-s-name" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" value="${S.user.name}"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Email Address</label>
          <input id="dd-s-email" type="email" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" value="${S.user.email}"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Role</label>
          <input class="w-full px-4 py-3 bg-surface-container-highest border-none rounded-lg text-on-surface-variant text-sm" value="${S.user.role}" readonly/>
        </div>
      </div>`,
    [{label:'Cancel', style:'secondary', cb: closeModal},
     {label:'Save Changes', style:'primary', cb: async()=>{
       const name  = document.getElementById('dd-s-name')?.value?.trim();
       const email = document.getElementById('dd-s-email')?.value?.trim();
       if(!name||!email){ toast('Name and email required','warn'); return; }
       closeModal();
       await updateProfile(name, email);
     }}]);
  };

  const ddPassword = document.getElementById('dd-password');
  if(ddPassword) ddPassword.onclick = ()=>{
    avatarMenu?.classList.add('hidden');
    showModal('Change Password',`
      <div class="space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Current Password</label>
          <input id="dd-cur-pw" type="password" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" placeholder="••••••••"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">New Password</label>
          <input id="dd-new-pw" type="password" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" placeholder="••••••••"/>
        </div>
        <div class="space-y-1">
          <label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Confirm New Password</label>
          <input id="dd-con-pw" type="password" class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-sm" placeholder="••••••••"/>
        </div>
      </div>`,
    [{label:'Cancel', style:'secondary', cb: closeModal},
     {label:'Update Password', style:'primary', cb: async()=>{
       const cur = document.getElementById('dd-cur-pw')?.value;
       const nw  = document.getElementById('dd-new-pw')?.value;
       const cn  = document.getElementById('dd-con-pw')?.value;
       if(!cur||!nw){ toast('All fields required','warn'); return; }
       closeModal();
       await changePassword(cur, nw, cn);
     }}]);
  };

  // App footer links
  document.getElementById('app-footer-privacy')?.addEventListener('click',()=>showModal('Privacy Policy',privacyText));
  document.getElementById('app-footer-hipaa')?.addEventListener('click',()=>showModal('HIPAA Compliance',hipaaText));
  document.getElementById('app-footer-contact')?.addEventListener('click',()=>showModal('Contact Us',contactText));

  // ── File upload zone ──────────────────────────────
  const zone = document.getElementById('upload-zone');
  const fi   = document.getElementById('file-input');
  if(zone && fi){
    const isSupportedScan = (name)=>{
      const low = String(name||'').toLowerCase();
      return low.endsWith('.png') || low.endsWith('.jpg') || low.endsWith('.jpeg') || low.endsWith('.dcm');
    };
    const labelFor = (files)=>{
      if(!files || !files.length) return '';
      return files.length===1 ? ('📎 '+files[0].name) : (`📎 ${files.length} files selected`);
    };
    zone.addEventListener('click', ()=>fi.click());
    zone.addEventListener('dragover',  e=>{e.preventDefault(); zone.classList.add('border-primary','bg-surface-container-low');});
    zone.addEventListener('dragleave', ()=>zone.classList.remove('border-primary','bg-surface-container-low'));
    zone.addEventListener('drop', e=>{
      e.preventDefault(); zone.classList.remove('border-primary','bg-surface-container-low');
      const files = Array.from(e.dataTransfer.files||[]);
      if(files.length){
        const good = files.filter(f=>isSupportedScan(f?.name));
        const bad  = files.filter(f=>!isSupportedScan(f?.name));
        const msg  = bad.length ? `File not supported: ${bad[0]?.name || 'Unknown file'}` : null;
        set({
          _files: good,
          scanSelectedLabel: labelFor(files),
          scanError: msg,
          error: msg,
          scanResult:null, scanResults:null, scanActiveIdx:0, scanUploadProgress:null,
          chatMessages:[], chatOpen:false
        });
      }
    });
    fi.addEventListener('change',()=>{
      const files = Array.from(fi.files||[]);
      if(files.length){
        const good = files.filter(f=>isSupportedScan(f?.name));
        const bad  = files.filter(f=>!isSupportedScan(f?.name));
        const msg  = bad.length ? `File not supported: ${bad[0]?.name || 'Unknown file'}` : null;
        set({
          _files: good,
          scanSelectedLabel: labelFor(files),
          scanError: msg,
          error: msg,
          scanResult:null, scanResults:null, scanActiveIdx:0, scanUploadProgress:null,
          chatMessages:[], chatOpen:false
        });
      }
      // Allow selecting the same file again and still triggering change.
      fi.value = '';
    });
  }
  document.getElementById('upload-btn')?.addEventListener('click',()=>{
    if(!S._files || !S._files.length){ toast('Please select one or more scan files first','warn'); return; }
    // Reset chat when a new scan is uploaded
    set({chatMessages:[], chatOpen:false});
    uploadScan(S._files);
  });

  // ── Explainable AI Chat ───────────────────────────
  document.getElementById('chat-toggle-btn')?.addEventListener('click',()=>{
    if(!S.chatOpen && S.chatMessages.length===0){
      openChatWithGreeting();
    } else {
      set({chatOpen: !S.chatOpen});
    }
  });
  // Dashboard chat toggle (patient dash)
  document.getElementById('dash-chat-toggle')?.addEventListener('click',()=>{
    if(!S.chatOpen && S.chatMessages.length===0){
      openChatWithGreeting();
    } else {
      set({chatOpen: !S.chatOpen});
    }
  });

  document.getElementById('chat-send-btn')?.addEventListener('click',()=>{
    const inp = document.getElementById('chat-input');
    if(!inp) return;
    const msg = inp.value.trim();
    if(!msg) return;
    inp.value = '';
    inp.style.height = 'auto';
    sendChatMessage(msg);
  });

  document.getElementById('chat-input')?.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      const msg = e.target.value.trim();
      if(!msg) return;
      e.target.value = '';
      e.target.style.height = 'auto';
      sendChatMessage(msg);
    }

  document.getElementById('chat-clear-btn')?.addEventListener('click',()=>{
    showModal('Clear Chat','Clear all chat messages and start fresh?',[
      {label:'Cancel', style:'secondary', cb:closeModal},
      {label:'Clear', style:'primary', cb:()=>{ closeModal(); set({chatMessages:[], chatOpen:true}); }},
    ]);
  });

  // ── Scan-detail page chat ────────────────────────────
  document.getElementById('detail-chat-send')?.addEventListener('click',()=>{
    const inp = document.getElementById('detail-chat-input');
    if(!inp) return;
    const msg = inp.value.trim();
    if(!msg) return;
    inp.value = '';
    inp.style.height = 'auto';
    sendDetailChat(msg);
  });

  document.getElementById('detail-chat-clear')?.addEventListener('click',()=>{
    showModal('Clear Chat','Clear all messages for this scan? This also removes saved history.',[
      {label:'Cancel', style:'secondary', cb:closeModal},
      {label:'Clear',  style:'primary',  cb:async()=>{
        closeModal();
        const sid = S.scanDetailData?.id;
        if(sid) await api('DELETE',`/api/scans/${sid}/chats`).catch(()=>{});
        set({detailChatMessages:[]});
      }},
    ]);
  });

  // ── Settings ──────────────────────────────────────
  // ── Role upgrade request ─────────────────────────────
  document.getElementById('submit-role-req-btn')?.addEventListener('click', async()=>{
    const reason = document.getElementById('role-req-reason')?.value?.trim()||'';
    set({roleReqReason: reason});
    try{
      await api('POST','/api/role-requests',{requested_role: S.roleReqRole, reason});
      toast('Request submitted! The admin will review it shortly.','success');
      set({data:{...S.data,myRoleRequestsLoaded:false}});
      loadMyRoleRequest();
    }catch(e){ toast(e.message,'error'); }
