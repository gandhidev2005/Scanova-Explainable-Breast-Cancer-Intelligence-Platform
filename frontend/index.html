<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scanova - Breast Cancer AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2399415a'/><text x='16' y='22' font-family='system-ui,sans-serif' font-weight='900' font-size='20' fill='white' text-anchor='middle'>S</text></svg>">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "surface": "#fdf8f9", "background": "#fdf8f9",
        "surface-container-lowest": "#ffffff",
        "on-surface-variant": "#544246", "secondary": "#71585e",
        "on-primary": "#ffffff", "tertiary": "#146d35",
        "primary": "#99415a", "on-error": "#ffffff",
        "surface-variant": "#e6e1e2", "surface-container-high": "#ece7e8",
        "primary-container": "#e8809b", "surface-container": "#f1edee",
        "on-secondary": "#ffffff", "on-primary-container": "#661933",
        "tertiary-container": "#5fb171", "inverse-primary": "#ffb1c3",
        "surface-container-highest": "#e6e1e2", "surface-container-low": "#f7f2f3",
        "error": "#ba1a1a", "error-container": "#ffdad6",
        "on-background": "#1c1b1c", "secondary-container": "#fcdae1",
        "outline": "#877276", "outline-variant": "#d9c0c4",
        "on-secondary-container": "#775e64", "on-tertiary": "#ffffff",
        "primary-fixed": "#ffd9e0", "surface-dim": "#ddd9da",
        "surface-bright": "#fdf8f9", "on-error-container": "#93000a",
        "on-surface": "#1c1b1c"
      },
      borderRadius: { "DEFAULT": "0.25rem","lg": "0.5rem","xl": "0.75rem","full": "9999px" },
      fontFamily: { "headline": ["Manrope"],"body": ["Manrope"],"label": ["Manrope"] }
    }
  }
}

<style>
/* ── Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
body { font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; }
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  display: inline-block; line-height: 1;
  text-transform: none; letter-spacing: normal;
  word-wrap: normal; white-space: nowrap; direction: ltr;
}

/* ══════════════════════════════════════════════════
   SCANOVA — DESIGN SYSTEM & ANIMATION ENGINE
   ══════════════════════════════════════════════════ */

/* ── Core utilities ───────────────────────────────── */
.bloom-gradient {
  background: linear-gradient(135deg, #7d2d47 0%, #99415a 35%, #c4607c 70%, #e8809b 100%);
  background-size: 300% 300%;
  animation: gradientShift 6s ease infinite;
}
.soft-shadow  { box-shadow: 0 8px 32px rgba(153,65,90,0.12), 0 2px 8px rgba(153,65,90,0.06); }
.glass-panel  { background: rgba(253,248,249,0.82); backdrop-filter: blur(32px) saturate(1.4); -webkit-backdrop-filter: blur(32px) saturate(1.4); }
.bloom-bg     { background: radial-gradient(circle at center, #e8809b 0%, transparent 70%); opacity:0.15; filter:blur(40px); }
.nav-active   { background:#ffffff; color:#99415a; font-weight:600; border-radius:9999px 0 0 9999px; margin-left:1rem; box-shadow:0 2px 8px rgba(153,65,90,0.10); }

/* ── KEYFRAMES ────────────────────────────────────── */
@keyframes fadeInUp    { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
@keyframes fadeInDown  { from{opacity:0;transform:translateY(-24px)} to{opacity:1;transform:none} }
@keyframes fadeInLeft  { from{opacity:0;transform:translateX(-32px)} to{opacity:1;transform:none} }
@keyframes fadeInRight { from{opacity:0;transform:translateX(32px)}  to{opacity:1;transform:none} }
@keyframes scaleIn     { from{opacity:0;transform:scale(0.88)} to{opacity:1;transform:scale(1)} }
@keyframes scaleInBounce { 0%{opacity:0;transform:scale(0.82)} 65%{opacity:1;transform:scale(1.04)} 100%{transform:scale(1)} }
@keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
@keyframes floatY      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes floatX      { 0%,100%{transform:translateX(0)} 50%{transform:translateX(8px)} }
@keyframes ripple      { to{transform:scale(4);opacity:0} }
@keyframes slideInSide { from{opacity:0;transform:translateX(-100%)} to{opacity:1;transform:none} }
@keyframes spinSlow    { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes spinSlowRev { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
@keyframes pulseRing   { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(1.6);opacity:0} }
@keyframes shimmer     { from{background-position:-200% 0} to{background-position:200% 0} }
@keyframes textReveal  { from{clip-path:inset(0 100% 0 0);opacity:0} to{clip-path:inset(0 0% 0 0);opacity:1} }
@keyframes wordPop     { from{opacity:0;transform:translateY(16px) scale(.9)} to{opacity:1;transform:none} }
@keyframes glowPulse   { 0%,100%{filter:drop-shadow(0 0 0px rgba(153,65,90,0))} 50%{filter:drop-shadow(0 0 12px rgba(153,65,90,.45))} }
@keyframes borderGlow  { 0%,100%{box-shadow:0 0 0 0 rgba(153,65,90,0),0 8px 32px rgba(153,65,90,.1)} 50%{box-shadow:0 0 0 4px rgba(153,65,90,.12),0 8px 32px rgba(153,65,90,.18)} }
@keyframes dataFlow    { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
@keyframes nodeAppear  { from{opacity:0;r:0} to{opacity:1;r:5} }
@keyframes morphOrb    { 0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%} 25%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%} 50%{border-radius:50% 60% 30% 40%/40% 50% 60% 50%} 75%{border-radius:40% 50% 60% 30%/60% 40% 50% 40%} }
@keyframes countUp     { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@keyframes scrollDown  { 0%,100%{transform:translateY(0);opacity:1} 50%{transform:translateY(6px);opacity:.5} }
@keyframes neonFlicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.8} 96%{opacity:1} 97%{opacity:.6} 98%{opacity:1} }
@keyframes barShimmer  { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes flowRight   { 0%{left:-2%;opacity:0} 5%{opacity:1} 90%{opacity:1} 100%{left:102%;opacity:0} }
@keyframes lineReveal  { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes mthStepIn   { from{opacity:0;transform:translateY(20px) scale(.94)} to{opacity:1;transform:none} }
@keyframes ringPulse   { 0%{box-shadow:0 0 0 0 var(--rc,rgba(153,65,90,.4))} 70%{box-shadow:0 0 0 14px rgba(0,0,0,0)} 100%{box-shadow:0 0 0 0 rgba(0,0,0,0)} }
@keyframes xaiSlideIn  { from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:none} }

/* ── Utility animation classes ────────────────────── */
.anim-fade-up      { animation: fadeInUp    .6s cubic-bezier(.22,.68,0,1.2) both; }
.anim-fade-down    { animation: fadeInDown  .6s cubic-bezier(.22,.68,0,1.2) both; }
.anim-fade-left    { animation: fadeInLeft  .55s cubic-bezier(.22,.68,0,1.2) both; }
.anim-fade-right   { animation: fadeInRight .55s cubic-bezier(.22,.68,0,1.2) both; }
.anim-scale-in     { animation: scaleIn     .5s  cubic-bezier(.22,.68,0,1.2) both; }
.anim-scale-bounce { animation: scaleInBounce .55s cubic-bezier(.22,.68,0,1.2) both; }
.anim-float        { animation: floatY 3.8s ease-in-out infinite; }
.anim-float-slow   { animation: floatY 5.5s ease-in-out infinite; }
.anim-float-x      { animation: floatX 4s ease-in-out infinite; }
.anim-glow         { animation: glowPulse 3s ease-in-out infinite; }
.anim-spin-slow    { animation: spinSlow 18s linear infinite; }
.anim-spin-rev     { animation: spinSlowRev 12s linear infinite; }
.anim-border-glow  { animation: borderGlow 3s ease-in-out infinite; }
.anim-morph        { animation: morphOrb 8s ease-in-out infinite; }
.anim-neon         { animation: neonFlicker 6s ease-in-out infinite; }
.page-enter        { animation: none; }
.sidebar-enter     { animation: slideInSide .45s cubic-bezier(.22,.68,0,1.2) both; }

/* Stagger delays */
.d-0{animation-delay:0ms} .d-1{animation-delay:90ms} .d-2{animation-delay:180ms}
.d-3{animation-delay:270ms} .d-4{animation-delay:360ms} .d-5{animation-delay:450ms} .d-6{animation-delay:540ms}

/* ── Scroll-reveal (added by IntersectionObserver) ── */
.sr { opacity:0; transform:translateY(28px); transition:opacity .7s cubic-bezier(.22,.68,0,1.2),transform .7s cubic-bezier(.22,.68,0,1.2); }
.sr.visible { opacity:1; transform:none; }
.sr-left  { opacity:0; transform:translateX(-32px); transition:opacity .7s cubic-bezier(.22,.68,0,1.2),transform .7s cubic-bezier(.22,.68,0,1.2); }
.sr-left.visible { opacity:1; transform:none; }
.sr-right { opacity:0; transform:translateX(32px); transition:opacity .7s cubic-bezier(.22,.68,0,1.2),transform .7s cubic-bezier(.22,.68,0,1.2); }
.sr-right.visible { opacity:1; transform:none; }

/* ── Awareness micro-animations ───────────────────── */
.aware-card { will-change: transform; }
.aware-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 18px 45px rgba(153,65,90,0.14); }
.aware-icon { will-change: transform; animation: awareFloat 4.6s ease-in-out infinite; }
@keyframes awareFloat { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-4px); } }
/* Inline awareness details */
.aware-detail{max-height:0;opacity:0;transform:translateY(-4px);overflow:hidden;margin-top:0;transition:max-height .35s cubic-bezier(.22,.68,0,1.05),opacity .25s ease,transform .25s ease,margin-top .2s ease}
.aware-detail.open{max-height:220px;opacity:1;transform:translateY(0);margin-top:1rem}
.aware-arrow{transition:transform .25s ease}
.aware-open .aware-arrow{transform:rotate(180deg)}

/* Note: Tilt updates on scroll are handled in JS (see initAnimations). */

/* ── Gradient animated text ───────────────────────── */
.text-gradient-anim {
  background: linear-gradient(135deg,#7d2d47,#99415a,#e8809b,#c4607c,#7d2d47);
  background-size: 400% 400%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; animation: gradientShift 5s ease infinite;
}

/* ── Glassmorphism card ───────────────────────────── */
.glass-card {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border: 1px solid rgba(255,255,255,0.8);
  box-shadow: 0 8px 32px rgba(153,65,90,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
}

/* ── 3D tilt card ─────────────────────────────────── */
.tilt-card {
  transform-style: preserve-3d;
  transition: transform .12s ease, box-shadow .25s ease;
  will-change: transform;
}
.tilt-card:hover { box-shadow: 0 24px 56px rgba(153,65,90,0.16); }
.tilt-card .tilt-inner { transform: translateZ(20px); }

/* ── Hover lift (lighter version) ────────────────── */
.card-hover {
  transition: transform .28s cubic-bezier(.22,.68,0,1.2), box-shadow .28s ease;
}
.card-hover:hover { transform: translateY(-5px) scale(1.015); box-shadow: 0 22px 52px rgba(153,65,90,0.14); }

/* ── Dashboard shell ──────────────────────────────── */
.dash-page{
  background:
    radial-gradient(900px 320px at 8% -10%, rgba(232,128,155,.18), transparent 55%),
    radial-gradient(700px 280px at 100% 0%, rgba(153,65,90,.10), transparent 50%),
    linear-gradient(180deg, #fdf8f9 0%, #f7f2f3 100%);
}
.dash-hero{
  position:relative; overflow:hidden;
  border-radius:1.15rem;
  background: linear-gradient(135deg, rgba(125,45,71,.96) 0%, rgba(153,65,90,.92) 45%, rgba(196,96,124,.88) 100%);
  color:#fff; box-shadow:0 14px 36px rgba(153,65,90,.20);
}
.dash-hero::after{
  content:''; position:absolute; inset:auto -20% -60% 40%; height:160%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);
  pointer-events:none;
}
.dash-metric{
  background:#fff; border:1px solid rgba(217,192,196,.35);
  border-radius:1rem; padding:.7rem .9rem;
  box-shadow:0 6px 20px rgba(153,65,90,.05);
  transition: transform .2s ease, box-shadow .2s ease;
}
.dash-metric:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(153,65,90,.10); }
.dash-panel{
  background:#fff; border:1px solid rgba(217,192,196,.3);
  border-radius:1.15rem; padding:1rem 1.1rem;
  box-shadow:0 8px 28px rgba(153,65,90,.06);
}
.dash-chip{
  display:inline-flex; align-items:center; gap:.35rem;
  padding:.4rem .75rem; border-radius:.65rem; font-size:.7rem; font-weight:700;
  background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.22);
  transition: background .15s ease, transform .15s ease;
}
.dash-chip:hover{ background:rgba(255,255,255,.26); transform:translateY(-1px); }
.dash-chip-ghost{
  background:#fff; color:#544246; border:1px solid rgba(217,192,196,.45);
  box-shadow:0 2px 8px rgba(153,65,90,.05);
}
.dash-chip-ghost:hover{ border-color:rgba(153,65,90,.35); color:#99415a; }
.dash-upload{
  border:1.5px dashed rgba(153,65,90,.28); border-radius:1rem;
  background: linear-gradient(180deg, rgba(255,217,224,.35), rgba(255,255,255,.9));
  transition: border-color .2s ease, background .2s ease, transform .2s ease;
}
.dash-upload:hover{ border-color:#99415a; background:rgba(252,218,225,.35); transform:translateY(-1px); }
.dash-queue-row{ transition: background .15s ease, transform .15s ease; }
.dash-queue-row:hover{ background:#f7f2f3; transform:translateX(2px); }
.model-tile{
  position:relative; overflow:hidden;
  border-radius:1rem; padding:.75rem .85rem;
  background:#fff; border:1px solid rgba(217,192,196,.28);
  box-shadow:0 6px 18px rgba(153,65,90,.05);
  transition: transform .18s ease, box-shadow .18s ease;
}
.model-tile:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(153,65,90,.12); }
.model-tile.is-active{
  border-color:rgba(153,65,90,.35);
  background:linear-gradient(135deg,rgba(153,65,90,.08),#fff 55%);
  box-shadow:0 10px 28px rgba(153,65,90,.14);
}
.model-tile .auc-bar{
  height:4px; border-radius:99px; background:rgba(153,65,90,.1); overflow:hidden; margin-top:.45rem;
}
.model-tile .auc-bar > i{
  display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,#e8809b,#99415a);
}
.val-shell{
  position:relative; overflow:hidden;
  border-radius:1.35rem; padding:1.15rem 1.2rem 1.2rem;
  background:linear-gradient(165deg,#ffffff 0%, #fdf7f8 48%, #f8e4e9 130%);
  border:1px solid rgba(153,65,90,.14);
  box-shadow:0 16px 44px rgba(153,65,90,.11);
}
.val-shell::before{
  content:''; position:absolute; inset:-35% auto auto -15%; width:260px; height:260px;
  background:radial-gradient(circle,rgba(232,128,155,.2),transparent 70%);
  pointer-events:none;
}
.val-block{
  position:relative; z-index:1; display:flex; flex-direction:column; gap:.7rem;
  border-radius:1.1rem; padding:.95rem 1rem 1rem;
  background:#fff; border:1px solid rgba(217,192,196,.4);
  box-shadow:0 8px 22px rgba(153,65,90,.06);
  transition: transform .22s ease, box-shadow .22s ease;
}
.val-block:hover{ transform:translateY(-2px); box-shadow:0 14px 30px rgba(153,65,90,.12); }
.val-block.is-external{
  background:linear-gradient(160deg,#fff 0%, #fdf0f3 100%);
  border-color:rgba(153,65,90,.24);
}
.val-row{
  display:flex; flex-direction:column; gap:.55rem;
  padding:.7rem .65rem .75rem;
  border-radius:.85rem;
  background:rgba(247,242,243,.55);
  border:1px solid rgba(217,192,196,.22);
}
.val-bar{
  height:6px; border-radius:99px; background:rgba(153,65,90,.1); overflow:hidden;
}
.val-bar > i{
  display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,#e8809b,#99415a);
  transition:width 1.15s cubic-bezier(.22,1,.36,1);
}
.val-bar.is-internal > i{ background:linear-gradient(90deg,#5fb171,#146d35); }
.val-metrics{
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.4rem;
}
.val-chip{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.12rem; min-width:0; padding:.45rem .25rem;
  border-radius:.65rem; background:#fff;
  border:1px solid rgba(217,192,196,.32);
  transition: transform .18s ease, border-color .18s ease;
}
.val-block:hover .val-chip{ transform:translateY(-1px); border-color:rgba(153,65,90,.22); }
.val-chip span:first-child{
  font-size:9px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:#8a7078; line-height:1;
}
.val-chip span:last-child{
  font-size:12px; font-weight:800; color:#1c1b1f; line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.val-notes{
  display:grid; grid-template-columns:1fr; gap:.65rem;
}
@media (min-width:1024px){
  .val-notes{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}
.val-note{
  display:flex; flex-direction:column; height:100%;
  border-radius:1rem; padding:.8rem .9rem;
  background:rgba(255,255,255,.9); border:1px solid rgba(217,192,196,.32);
  transition: transform .2s ease, box-shadow .2s ease;
}
.val-note:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(153,65,90,.1); }
.val-note.warn{
  background:linear-gradient(145deg,#fff8eb,#fff);
  border-color:rgba(245,158,11,.35);
}

/* ── Magnetic button wrapper ──────────────────────── */
.mag-wrap { display:inline-block; }
.mag-btn  { transition: transform .3s cubic-bezier(.22,.68,0,1.2); display:block; }

/* ── Button ripple ────────────────────────────────── */
.ripple-btn { position:relative; overflow:hidden; }
.ripple-btn .ripple-circle {
  position:absolute; border-radius:50%;
  background:rgba(255,255,255,0.4);
  transform:scale(0); animation:ripple .65s linear;
  pointer-events:none;
}

/* ── Shimmer skeleton ─────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg,#f1edee 25%,#fdf8f9 50%,#f1edee 75%);
  background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:8px;
}

/* ── Hero canvas ──────────────────────────────────── */
#hero-canvas {
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:0; opacity:.55;
}

/* ── Hero AI visualization ────────────────────────── */
.ai-viz { position:relative; width:100%; aspect-ratio:1; max-width:420px; margin:auto; }
.ai-ring {
  position:absolute; border-radius:50%; border:1.5px solid;
  top:50%; left:50%; transform:translate(-50%,-50%);
}
.ai-ring-1 { width:85%;  height:85%;  border-color:rgba(153,65,90,.25); animation:spinSlow 20s linear infinite; }
.ai-ring-2 { width:68%;  height:68%;  border-color:rgba(153,65,90,.35); animation:spinSlowRev 14s linear infinite; border-style:dashed; }
.ai-ring-3 { width:50%;  height:50%;  border-color:rgba(232,128,155,.5); animation:spinSlow 9s linear infinite; }
.ai-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; text-align:center; }
.ai-node {
  position:absolute; width:10px; height:10px; border-radius:50%;
  background: linear-gradient(135deg,#99415a,#e8809b);
  top:50%; left:50%; transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(153,65,90,.5);
}
.ai-pulse { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:120px; height:120px; border-radius:50%;
  border:2px solid rgba(153,65,90,.2); animation:pulseRing 2.4s ease-out infinite; }
.ai-pulse2 { animation-delay:.8s; }
.ai-pulse3 { animation-delay:1.6s; }

/* ── Gradient border card ─────────────────────────── */
.grad-border {
  position:relative; border-radius:1.25rem;
  background: linear-gradient(white,white) padding-box,
              linear-gradient(135deg,rgba(153,65,90,.4),rgba(232,128,155,.25),rgba(153,65,90,.4)) border-box;
  border: 1.5px solid transparent;
  transition: border-color .3s, box-shadow .3s;
}
.grad-border:hover {
  background: linear-gradient(white,white) padding-box,
              linear-gradient(135deg,#99415a,#e8809b,#99415a) border-box;
  box-shadow: 0 16px 44px rgba(153,65,90,.14);
}

/* ── Typewriter cursor ────────────────────────────── */
.tw-cursor::after { content:'|'; animation:neonFlicker 1s ease-in-out infinite; color:#99415a; }

/* ── Stat counter ─────────────────────────────────── */
.stat-counter { font-variant-numeric:tabular-nums; }

/* ── Nav hover underline ──────────────────────────── */
.nav-link { position:relative; }
.nav-link::after { content:''; position:absolute; bottom:-2px; left:0; width:0; height:2px; background:#99415a; border-radius:2px; transition:width .3s cubic-bezier(.22,.68,0,1.2); }
.nav-link:hover::after, .nav-link.active::after { width:100%; }

/* ── Nav item hover ───────────────────────────────── */
aside nav a { transition:background .2s,color .2s,transform .18s,padding-left .2s; border-radius:0; }
aside nav a:not(.nav-active):hover { transform:translateX(5px); }

/* ── Input focus glow ─────────────────────────────── */

<body class="bg-surface text-on-surface antialiased">
<div id="app"></div>
<!-- Toast container -->
<div id="sc-toasts" class="fixed bottom-6 right-6 z-[300] flex flex-col gap-2 items-end pointer-events-none"></div>
<!-- Modal -->
<div id="sc-modal" class="fixed inset-0 z-[200] flex items-center justify-center bg-black/40 hidden">
  <div class="bg-surface rounded-2xl soft-shadow max-w-md w-full mx-4 overflow-hidden">
    <div class="px-8 py-6 border-b border-outline-variant/20">
      <h3 id="sc-modal-title" class="text-lg font-bold text-on-surface"></h3>
    </div>
    <div id="sc-modal-body" class="px-8 py-6 text-on-surface-variant text-sm leading-relaxed"></div>
    <div id="sc-modal-actions" class="px-8 py-4 flex justify-end gap-3 border-t border-outline-variant/20"></div>
  </div>
</div>

<script>
// ── Time helpers ─────────────────────────────────────
function timeAgo(dateStr){
  if(!dateStr) return '—';
  // SQLite stores without Z; treat as UTC
  const d = new Date(dateStr.replace(' ','T') + (dateStr.includes('Z')||dateStr.includes('+') ? '' : 'Z'));
  if(isNaN(d)) return dateStr.split('T')[0] || '—';
  const diff = Date.now() - d.getTime();
  if(diff < 0) return 'Just now';
  const mins = Math.floor(diff/60000);
  const hrs  = Math.floor(mins/60);
  const days = Math.floor(hrs/24);
  if(mins < 1)  return 'Just now';
  if(mins < 60) return `${mins} min ago`;
  if(hrs  < 24) return `${hrs} hr${hrs>1?'s':''} ago`;
  if(days <  7) return `${days} day${days>1?'s':''} ago`;
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr.replace(' ','T') + (dateStr.includes('Z')||dateStr.includes('+') ? '' : 'Z'));
  if(isNaN(d)) return dateStr.split('T')[0] || '—';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

// ── State ────────────────────────────────────────────
const API = '';
let S = {
  user: JSON.parse(localStorage.getItem('sc_user')||'null'),
  token: localStorage.getItem('sc_token')||null,
  view: 'landing', page: 'dashboard',
  data: {}, loading: false, error: null,
  scanResult: null, scanLoading: false, _file: null,
  scanComposeOpen: false,
  scanError: null,
  scanSelectedLabel: '',
  queueFilter: 'ALL',
  userRoleFilter: 'all',
  chatOpen: false,
  chatMessages: [],   // [{role:'user'|'assistant', content:'...'}]
  chatLoading: false,
  scanChatStyle: 'normal',        // admin: 'normal'|'clinic'|'radio'
  roleReqRole: 'radiologist',
  roleReqReason: '',
  scanDetailData: null,           // scan being viewed on the detail page
  detailChatMessages: [],         // chat messages scoped to scan-detail page
  detailChatLoading: false,
  detailChatOpen: true,
  detailChatStyle: 'normal',      // admin: 'normal'|'clinic'|'radio' (scan-detail page)
  apptHistoryFilter: 'all',
  adminUserDetailId: null,
  adminUserDetail:   null,
  dcSessions: [],
  dcSessionsLoaded: false,
  dcActiveId: null,
  dcMessages: [],
  dcSending: false,
  dcStyle: 'normal',           // admin mode: 'normal'|'radio'|'clinic'
  mfaSetupRequired: false,     // true only when user opted-in during registration
  modelsInfo: null,            // /api/models/info payload
};

let _renderQueued = false;
let _lastRenderedKey = '';

// Stop accidental full browser reloads from buttons defaulting to submit
(function(){
  if(window.__scBtnGuard) return;
  window.__scBtnGuard = true;
  document.addEventListener('click', function(e){
    const btn = e.target.closest('button');
    if(!btn) return;
    if(btn.type && btn.type !== 'submit') return;
    // Bare <button> inside a <form> submits → full page reload
    if(btn.closest('form') && !btn.getAttribute('type')){
      e.preventDefault();
    }
  }, true);
})();

function set(patch, opts){
  opts = opts || {};
  Object.assign(S, patch);
  if(opts.quiet) return;
  // Coalesce burst updates (nav + data loaders) into one paint
  if(_renderQueued) return;
  _renderQueued = true;
  queueMicrotask(()=>{
    _renderQueued = false;
    render();
  });
}

function _scrollRoot(){
  // App shell scrolls the window; keep a handle for future layout changes
  return document.scrollingElement || document.documentElement;
}

// ── Toast ─────────────────────────────────────────────
function toast(msg, type='success'){
  const el = document.createElement('div');
  const colors = {
    success: 'bg-tertiary text-white',
    error:   'bg-error text-on-error',
    info:    'bg-secondary-container text-on-secondary-container',
    warn:    'bg-amber-100 text-amber-800'
  };
  el.className = `sc-toast pointer-events-auto px-5 py-3 rounded-xl font-semibold text-sm shadow-lg flex items-center gap-3 ${colors[type]||colors.success}`;
  const icon = {success:'check_circle',error:'error',info:'info',warn:'warning'};
  el.innerHTML = `<span class="material-symbols-outlined text-lg" style="font-variation-settings:'FILL' 1;">${icon[type]||'check_circle'}</span>${msg}`;
  document.getElementById('sc-toasts').appendChild(el);
  setTimeout(()=> el.classList.add('opacity-0','transition-opacity'), 3000);
  setTimeout(()=> el.remove(), 3400);
}

// ── Modal ─────────────────────────────────────────────
function showModal(title, body, actions=[]){
  document.getElementById('sc-modal-title').textContent = title;
  document.getElementById('sc-modal-body').innerHTML = body;
  const actEl = document.getElementById('sc-modal-actions');
  actEl.innerHTML = '';
  if(!actions.length){
    actions = [{label:'Close', style:'secondary', cb: closeModal}];
  }
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = a.style==='primary'
      ? 'bloom-gradient text-on-primary px-6 py-2.5 rounded-lg font-bold text-sm'
      : 'bg-surface-container text-on-surface-variant px-6 py-2.5 rounded-lg font-bold text-sm hover:bg-surface-container-high';
    btn.textContent = a.label;
    btn.onclick = a.cb;
    actEl.appendChild(btn);
  });
  document.getElementById('sc-modal').classList.remove('hidden');
  // Prevent background scrolling while modal is open
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('sc-modal').classList.add('hidden');
  document.body.style.overflow = '';
}
document.getElementById('sc-modal').addEventListener('click', e => {
  if(e.target === document.getElementById('sc-modal')) closeModal();
});

// ── API helper ────────────────────────────────────────
async function api(method, path, body, isForm){
  const h = {};
  if(S.token) h['Authorization'] = `Bearer ${S.token}`;
  if(!isForm) h['Content-Type'] = 'application/json';
  const r = await fetch(API+path,{method,headers:h,
    body: isForm ? body : (body ? JSON.stringify(body) : undefined)});
  if(!r.ok){ const e=await r.json().catch(()=>({detail:`Request failed (HTTP ${r.status})`})); throw new Error(e.detail||`Failed (${r.status})`); }
  return r.json();
}

// ── Chat markdown → HTML (tables, lists, headings, bold) ─
function escapeHtml(s){
  return String(s||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function _inlineMd(s){
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code class="px-1 py-0.5 rounded bg-black/5 text-[0.85em] font-mono">$1</code>')
    .replace(/•/g,'<span class="text-primary font-bold">•</span>');
}
function _isTableSep(line){
  return /^\|?[\s:|-]+\|[\s:|-]*\|?$/.test(line.trim()) && line.includes('-');
}
function _splitTableRow(line){
  let s = line.trim();
  if(s.startsWith('|')) s = s.slice(1);
  if(s.endsWith('|')) s = s.slice(0,-1);
  return s.split('|').map(c => c.trim());
}
function formatChatMarkdown(text){
  if(!text) return '';
  const lines = String(text).replace(/\r\n/g,'\n').split('\n');
  const out = [];
  let i = 0;
  let inUl = false, inOl = false;

  const closeLists = ()=>{
    if(inUl){ out.push('</ul>'); inUl=false; }
    if(inOl){ out.push('</ol>'); inOl=false; }
  };

  while(i < lines.length){
    const line = lines[i];
    const trimmed = line.trim();

    // Markdown table: header + separator + body rows
    if(
      trimmed.includes('|') &&
      i+1 < lines.length &&
      _isTableSep(lines[i+1])
    ){
      closeLists();
      const headers = _splitTableRow(trimmed);
      i += 2;
      const rows = [];
      while(i < lines.length && lines[i].trim().includes('|') && !_isTableSep(lines[i])){
        rows.push(_splitTableRow(lines[i]));
        i++;
      }
      out.push('<div class="chat-md-table-wrap overflow-x-auto my-3 rounded-xl border border-outline-variant/20">');
      out.push('<table class="chat-md-table w-full text-left text-xs border-collapse min-w-[420px]">');
      out.push('<thead><tr>');
      headers.forEach(h => {
        out.push(`<th class="px-3 py-2.5 bg-surface-container font-bold text-on-surface border-b border-outline-variant/25 whitespace-nowrap">${_inlineMd(h)}</th>`);
      });
      out.push('</tr></thead><tbody>');
      rows.forEach((row, ri) => {
        const bg = ri % 2 ? 'bg-surface-container-low/50' : 'bg-surface-container-lowest';
        out.push(`<tr class="${bg}">`);
        for(let c=0; c<headers.length; c++){
          const cell = row[c] ?? '';
          out.push(`<td class="px-3 py-2.5 align-top border-b border-outline-variant/10 text-on-surface leading-relaxed">${_inlineMd(cell)}</td>`);
        }
        out.push('</tr>');
      });
      out.push('</tbody></table></div>');
      continue;
    }

    // Horizontal rule
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)){
      closeLists();
      out.push('<hr class="my-3 border-outline-variant/30"/>');
      i++; continue;
    }

    // Headings
    const hm = trimmed.match(/^(#{1,4})\s+(.+)$/);
    if(hm){
      closeLists();
      const level = hm[1].length;
      const sizes = {1:'text-base font-extrabold mt-3 mb-1',2:'text-sm font-extrabold mt-3 mb-1',3:'text-sm font-bold mt-2 mb-1',4:'text-xs font-bold mt-2 mb-1'};
      out.push(`<p class="${sizes[level]||sizes[3]} text-on-surface">${_inlineMd(hm[2])}</p>`);
      i++; continue;
    }

    // Unordered list
    const ul = trimmed.match(/^[-*•]\s+(.+)$/);
    if(ul){
      if(inOl){ out.push('</ol>'); inOl=false; }
      if(!inUl){ out.push('<ul class="my-1.5 ml-4 list-disc space-y-1">'); inUl=true; }
      out.push(`<li class="leading-relaxed">${_inlineMd(ul[1])}</li>`);
      i++; continue;
    }

    // Ordered list
    const ol = trimmed.match(/^\d+[.)]\s+(.+)$/);
    if(ol){
      if(inUl){ out.push('</ul>'); inUl=false; }
      if(!inOl){ out.push('<ol class="my-1.5 ml-4 list-decimal space-y-1">'); inOl=true; }
      out.push(`<li class="leading-relaxed">${_inlineMd(ol[1])}</li>`);
      i++; continue;
    }

    // Blank line
    if(!trimmed){
      closeLists();
      out.push('<div class="h-2"></div>');
      i++; continue;
    }

    // Paragraph
    closeLists();
    out.push(`<p class="leading-relaxed my-1">${_inlineMd(trimmed)}</p>`);
    i++;
  }
  closeLists();
  return out.join('');
}

// ── Auth ──────────────────────────────────────────────
/** Wipe ephemeral Analyze-page session (results stay in History / DB). */
function clearScanSession(opts){
  const quiet = !!(opts && opts.quiet);
  S._scanChatBootstrapped = false;
  S._files = null;
  const patch = {
    scanResult: null,
    scanResults: null,
    scanActiveIdx: 0,
    scanUploadProgress: null,
    scanComposeOpen: false,
    scanLoading: false,
    scanError: null,
    scanSelectedLabel: '',
    chatOpen: false,
    chatMessages: [],
    chatLoading: false,
    error: null,
  };
  if(quiet) Object.assign(S, patch);
  else set(patch);
}

function _resetUserScopedState(){
  // Clear anything that must never bleed across accounts
  clearScanSession({quiet:true});
  set({
    data: {},
    error: null,
    scanDetailData: null,
    detailChatMessages: [],
    detailChatLoading: false,
    detailChatOpen: true,
    scanChatStyle: 'normal',
    // direct chat
    dcSessions: [],
    dcSessionsLoaded: false,
    dcActiveId: null,
    dcMessages: [],
    dcSending: false,
    dcStyle: 'normal',
    // scan-detail chat style
    detailChatStyle: 'normal',
    // MFA setup gating
    mfaSetupRequired: false,
    // admin user detail
    adminUserDetailId: null,
    adminUserDetail: null,
    userDetailReturn: null,
  });
}

async function login(email,pw,mfaCode){
  set({loading:true,error:null});
  try{
    const payload = {email:email.trim().toLowerCase(), password:pw};
    if(mfaCode) payload.mfa_code = String(mfaCode).trim();
    const d = await api('POST','/api/auth/login',payload);
    localStorage.setItem('sc_token',d.token);
    localStorage.setItem('sc_user',JSON.stringify(d.user));
    _resetUserScopedState();
    set({user:d.user,token:d.token,loading:false,view:'app',page:'dashboard'});
    loadStats();
  }catch(e){
    const msg = e?.message || 'Login failed';
    // Backend signals MFA requirement via message text + mfa_required flag in JSON,
    // but our api() helper only throws with detail string. So detect by message.
    if(String(msg).toLowerCase().includes('mfa code required')){
      set({loading:false,error:null});
      showModal('MFA Verification', `
        <div class="space-y-3">
          <p class="text-sm text-on-surface-variant">Enter the 6-digit code from your authenticator app.</p>
          <input id="mfa-login-code" inputmode="numeric" autocomplete="one-time-code"
            class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary/20 text-on-surface text-lg tracking-widest font-bold"
            placeholder="123 456"/>
        </div>
      `,[
        {label:'Cancel', style:'secondary', cb: closeModal},
        {label:'Verify', style:'primary', cb: ()=>{
          const code = document.getElementById('mfa-login-code')?.value?.trim();
          closeModal();
          login(email, pw, code);
        }},
      ]);
      setTimeout(()=>document.getElementById('mfa-login-code')?.focus(),80);
      return;
    }
    set({loading:false,error:msg});
  }
}

async function register(name,email,pw,role, enableMfa){
  set({loading:true,error:null});
  try{
    const d = await api('POST','/api/auth/register',{name,email:email.trim().toLowerCase(),password:pw,role});
    localStorage.setItem('sc_token',d.token);
    localStorage.setItem('sc_user',JSON.stringify(d.user));
    _resetUserScopedState();
    if(enableMfa){
      // Force a dedicated MFA-only screen (no sidebar) until verified
      set({user:d.user,token:d.token,loading:false,view:'mfa-gate',page:'mfa',mfaSetupRequired:true});
    }else{
      set({user:d.user,token:d.token,loading:false,view:'app',page:'dashboard'});
      loadStats();
    }
    // Optional: start MFA setup right after registration
    if(enableMfa){
      try{
        const st = await api('GET','/api/auth/mfa/status');
        set({mfa:{enabled: !!st.enabled}});
      }catch(_e){
        set({mfa:{enabled:false}});
      }
      // Auto-generate QR/setup secret so the user can scan immediately
      try{
        const setup = await api('POST','/api/auth/mfa/start',{});
        set({mfa:{enabled:false, ...setup}});
        toast('MFA setup started. Scan the QR code to enable.','success');
      }catch(e){
        toast('Could not start MFA setup: '+e.message,'error');
      }
    } else {
      toast('Tip: You can enable MFA later from Settings in your dashboard.','info');
    }
  }catch(e){ set({loading:false,error:e.message}); }
}

function logout(){
  localStorage.removeItem('sc_token');
  localStorage.removeItem('sc_user');
  _resetUserScopedState();
  set({user:null,token:null,view:'landing'});
}

// ── Profile / Password ────────────────────────────────
async function updateProfile(name, email){
  try{
    const d = await api('PUT','/api/auth/profile',{name,email});
    const u = {...S.user, name:d.name, email:d.email};
    localStorage.setItem('sc_user', JSON.stringify(u));
    set({user:u});
    toast('Profile updated successfully!');
  }catch(e){ toast(e.message,'error'); }
}

async function changePassword(current, newPw, confirmPw){
  if(newPw !== confirmPw){ toast('New passwords do not match','error'); return; }
  if(newPw.length < 8){ toast('Password must be at least 8 characters with a letter and number','error'); return; }
  try{
    await api('PUT','/api/auth/password',{current_password:current,new_password:newPw});
    toast('Password updated successfully!');
  }catch(e){ toast(e.message,'error'); }
}

// ── Data loaders ──────────────────────────────────────
function _dataEqual(a,b){
  try{ return JSON.stringify(a)===JSON.stringify(b); }catch(_e){ return false; }
}
async function loadStats(){
  try{
    const s=await api('GET','/api/dashboard/stats');
    if(_dataEqual(S.data.stats, s)) return;
    set({data:{...S.data,stats:s}});
  }catch(e){}
}
async function loadPatients(){
  try{
    const p=await api('GET','/api/patients');
    if(S.data.patientsLoaded && _dataEqual(S.data.patients, p)) return;
    set({data:{...S.data,patients:p,patientsLoaded:true}});
  }catch(e){}
}
async function loadUsers(){
  try{
    const u=await api('GET','/api/users');
    if(S.data.usersLoaded && _dataEqual(S.data.users, u)) return;
    set({data:{...S.data,users:u,usersLoaded:true}});
  }catch(e){}
}
async function loadScans(){
  try{
    const sc=await api('GET','/api/scans');
    if(S.data.scansLoaded && _dataEqual(S.data.scans, sc)) return;
    set({data:{...S.data,scans:sc,scansLoaded:true}});
  }catch(e){}
}
async function loadSchedule(){
  try{
    const sc=await api('GET','/api/schedule');
    if(S.data.scheduleLoaded && _dataEqual(S.data.schedule, sc)) return;
    set({data:{...S.data,schedule:sc,scheduleLoaded:true}});
  }catch(e){}
}
async function loadRoleRequests(){
  try{
    const r=await api('GET','/api/role-requests');
    if(S.data.roleRequestsLoaded && _dataEqual(S.data.roleRequests, r)) return;
    set({data:{...S.data,roleRequests:r,roleRequestsLoaded:true}});
  }catch(e){}
}
async function loadMyRoleRequest(){
  try{
    const r=await api('GET','/api/role-requests/my');
    if(S.data.myRoleRequestsLoaded && _dataEqual(S.data.myRoleRequests, r)) return;
    set({data:{...S.data,myRoleRequests:r,myRoleRequestsLoaded:true}});
  }catch(e){}
}
async function loadAdminLogs(){

          };

function fmtAuc(v){
  if(v===null||v===undefined||v==='') return '—';
  const n = Number(v);
  if(!Number.isFinite(n)) return String(v);
  return n.toFixed(4);
}

/** Sens/Spec as paper rates (0.7197). Accepts rate or percent. */
function fmtRateMetric(v){
  if(v===null||v===undefined||v==='') return '—';
  const n = Number(v);
  if(!Number.isFinite(n)) return String(v);
  const rate = n > 1.5 ? n / 100 : n;
  return rate.toFixed(4);
}

/** Accuracy as paper percent (66.8%). Accepts percent or rate. */
function fmtAccMetric(v){
  if(v===null||v===undefined||v==='') return '—';
  const n = Number(v);
  if(!Number.isFinite(n)) return String(v);
  const pct = n <= 1.5 ? n * 100 : n;
  return (Math.round(pct * 10) / 10).toFixed(1) + '%';
}

/** @deprecated alias — prefer fmtRateMetric / fmtAccMetric */
function fmtPctMetric(v){ return fmtAccMetric(v); }

function displayModelName(id, opts){

  return d.name.replace(/ ★$/, '') + (withStar ? ' ★' : '');
}

/** Landing / analytics — paper sequence, values, and names. */
function buildPerfComparisonRows(info){
  const byId = {};
  (info?.models || []).forEach(m=>{ byId[m.id] = m; });

  return PERF_DISPLAY_ORDER.map(id=>{
    const d = PERF_DISPLAY[id];
    const m = byId[id];
    // Prefer fixed paper figures so web always matches manuscript
    const auc  = d.auc;
    const sens = d.sens;
    const spec = d.spec;
    const acc  = d.acc;
    return {
      id,
      name: displayModelName(id),
      auc: fmtAuc(auc),
      pct: Math.min(100, Math.max(0, auc * 100)),
      sens: fmtRateMetric(sens),
      spec: fmtRateMetric(spec),
      acc:  fmtAccMetric(acc),
      hover: `Accuracy ${fmtAccMetric(acc)}`,
      color: d.color,
      external: !!d.external,
      exists: d.external ? true : !!(m && m.exists),
    };
  });
}

// ── Scan upload ───────────────────────────────────────
async function uploadScan(files){
  // Ensure we always end up with an array of File objects.
  const isFile = (v) => {
    try{ return (typeof File!=='undefined') && (v instanceof File); }catch(_e){ return false; }
  };
  const list =
    Array.isArray(files) ? files :
    (isFile(files) ? [files] :
      Array.from(files || []));
  if(!list.length){
    toast('Please select one or more scan files first','warn');
    return;
  }
  set({scanLoading:true,scanError:null,error:null, scanUploadProgress: {done:0,total:list.length}});
  try{
    // Upload sequentially so every file is analyzed & saved,
    // and one bad file doesn't cancel the whole batch.
    const results = [];
    for(let i=0;i<list.length;i++){
      set({scanUploadProgress:{done:i,total:list.length}});
      const f=new FormData();
      f.append('file', list[i]);
      const r=await api('POST','/api/scan/analyze',f,true);
      results.push(r);
    }
    set({scanUploadProgress:{done:list.length,total:list.length}});
    // Patch stats immediately so the riskometer reflects the new result
    // without waiting for a loadStats() round-trip
    const patchedStats = {
      ...(S.data.stats||{}),
      prediction:  results[0]?.prediction,
      probability: results[0]?.probability,
      risk_level:  results[0]?.risk_level,
      last_scan:   new Date().toISOString(),
      total_scans: (S.data.stats?.total_scans||0) + results.length,
    };
    set({
      scanLoading:false, scanError:null, scanResults: results, scanResult: results[0]||null, scanActiveIdx: 0,
      scanComposeOpen:false, _files:null, scanSelectedLabel:'',
      chatMessages:[], chatOpen:true,
      data:{...S.data, stats: patchedStats}
    });
    S._scanChatBootstrapped = true;
    queueMicrotask(()=>openChatWithGreeting(true));
    toast(`Analysis complete! (${results.length} file${results.length!==1?'s':''})`);
    loadStats(); // sync authoritative count / last_scan from server
  }catch(e){
    const msg = e?.message || 'Scan analysis failed. Please try again.';
    set({scanLoading:false, scanError: msg, error: msg});
    toast(msg,'error');
  }
}

    confidence:  sc.confidence,
    uncertainty: sc.uncertainty,
    risk_level:  sc.risk_level,
    shap_cbis:   sc.shap_cbis ?? sc.shap_mammo,
    shap_rsna:   sc.shap_rsna,
    shap_us:     sc.shap_us,
    shap_mri:    sc.shap_mri,
    model_used:  sc.model_used,
  };

  try{
    const r = await api('POST','/api/scan/chat',{
      message:      msg.trim(),
      scan_context,
      scan_id:      sc.id,          // ← persist to DB
      history:      S.detailChatMessages.slice(-12),
      style:        (S.user?.role==='admin' ? (S.detailChatStyle||'normal') : null),
    });
    set({
      detailChatMessages: [...updated, {role:'assistant', content: r.response}],
      detailChatLoading: false,
    });
  }catch(e){
    set({
      detailChatMessages: [...updated, {role:'assistant', content:`⚠️ ${e.message}`}],
      detailChatLoading: false,
    });
  }
  setTimeout(_scrollDetailChat, 80);
}

    await api('PATCH', `/api/scans/${scanId}/label`, {label: newLabel});

    set({data:{...S.data, scans}});

async function deleteScan(scanId, displayName){
  if(!confirm(`Delete "${displayName}"?\n\nThis will permanently remove the scan and its analysis. This cannot be undone.`)) return;
  try{
    await api('DELETE', `/api/scans/${scanId}`);
    const scans = (S.data.scans||[]).filter(s=> s.id!==scanId);
    set({data:{...S.data, scans, scansLoaded:true}});
    toast('Scan deleted successfully.');
    loadStats();
  }catch(e){
    if(e.message.includes('405') || e.message.includes('404')){
      toast('Server not updated — please restart the Flask server (python app.py) and try again.','error');
    } else {
      toast(e.message,'error');
    }
  }
}

// ── Direct AI Chat (session-based) ────────────────────
async function loadDCSessions(styleOverride){
  // Refresh sessions list without clearing the active chat UI.
  // (Active chat is cleared on login/logout via _resetUserScopedState().)
  const role0  = S.user?.role || 'patient';
  const style0 = role0==='admin' ? (styleOverride || S.dcStyle || 'normal') : '';
  // If admin is switching modes, clear the list immediately to avoid showing other mode's chats.
  if(role0==='admin' && styleOverride){
    set({dcSessions: [], dcSessionsLoaded: false, dcActiveId: null, dcMessages: []});
  }else{
    set({dcSessionsLoaded: false});
  }
  try{
    const role  = S.user?.role || 'patient';
    const style = role==='admin' ? (styleOverride || S.dcStyle || 'normal') : '';
    const qs    = style ? `?style=${encodeURIComponent(style)}` : '';
    const sessions = await api('GET', `/api/direct-chats${qs}`);
    const activeOk = sessions.some(s=>s.id===S.dcActiveId);
    set({dcSessions: sessions, dcSessionsLoaded: true});
    // Do NOT auto-open a past chat. Only open when the user clicks a session,
    // or when they explicitly create a new chat.
    if(!activeOk){
      set({dcActiveId: null, dcMessages: []});
    }
  }catch(e){}
}

function _scrollDC(){
  setTimeout(()=>{ const el=document.getElementById('dc-msgs'); if(el) el.scrollTop=el.scrollHeight; },60);
}

window.openDirectChat = async function(id){
  // Don't skip loading just because the session is already selected.
  // (loadDCSessions() may set dcActiveId before calling openDirectChat().)
  const same = (S.dcActiveId === id);
  if(same && Array.isArray(S.dcMessages) && S.dcMessages.length > 0) return;
  set({dcActiveId:id, dcMessages: same ? (S.dcMessages||[]) : [], dcSending:false});
  try{
    const data = await api('GET',`/api/direct-chats/${id}`);
    set({dcMessages: data.messages, dcStyle: data.session.style||'normal'});
    _scrollDC();
  }catch(e){ toast(e.message,'error'); }
};

window.deleteDirectChat = function(id, e){
  e && e.stopPropagation();
  showModal('Delete Chat','Permanently delete this conversation?',[
    {label:'Cancel',style:'secondary',cb:closeModal},
    {label:'Delete', style:'primary',cb:async()=>{
      closeModal();
      try{
        await api('DELETE',`/api/direct-chats/${id}`);
        const remaining = S.dcSessions.filter(s=>s.id!==id);
        const nextId    = S.dcActiveId===id ? (remaining[0]?.id||null) : S.dcActiveId;
        set({dcSessions:remaining, dcActiveId:nextId, dcMessages:[]});
        if(nextId && nextId!==S.dcActiveId) window.openDirectChat(nextId);
        toast('Chat deleted');
      }catch(e){ toast(e.message,'error'); }
    }}
  ]);
};

window.sendDCMessage = async function(prefill){
  const inputEl = document.getElementById('dc-input');
  const msg     = prefill || (inputEl && inputEl.value.trim());
  if(!msg || S.dcSending) return;
  if(inputEl){ inputEl.value=''; inputEl.style.height='auto'; }

  let sid = S.dcActiveId;
  if(!sid){
    try{
      const s = await api('POST','/api/direct-chats',{style:S.dcStyle});
      sid = s.id;
      set({dcSessions:[s,...S.dcSessions], dcActiveId:sid, dcMessages:[]});
    }catch(e){ toast(e.message,'error'); return; }
  }

  const newMsgs = [...S.dcMessages, {role:'user',content:msg}];
  set({dcMessages:newMsgs, dcSending:true});
  _scrollDC();

  try{
    const res   = await api('POST',`/api/direct-chats/${sid}/message`,{message:msg});
    const reply = res.response || 'Sorry, I could not generate a response.';
    set({dcMessages:[...newMsgs,{role:'assistant',content:reply}], dcSending:false});
    // refresh session list to update title + timestamp
    loadDCSessions();
    _scrollDC();
  }catch(e){
    set({dcMessages:[...newMsgs,{role:'assistant',content:`Sorry — ${e.message}`}], dcSending:false});
    _scrollDC();
  }
};

    return;
  }
  // Already on this page — don't remount (avoids flash/"refresh" on every click)
  if(S.view==='app' && S.page===page) return;

  // Analyze page is always a fresh upload workspace — never reopen a prior result
  if(page==='scan') clearScanSession({quiet:true});

  set({page});
  if(page==='dashboard') loadStats();
  if(page==='scan' || page==='dashboard') loadModelsInfo();
  if(page==='analytics') loadModelsInfo();
  if(page==='patients')  loadPatients();
  if(page==='users')          loadUsers();
  if(page==='history')        loadScans();
  if(page==='schedule')       loadSchedule();

      .then(st=>{

        if(S.mfa?.enabled === next.enabled && S.page==='settings') {

        }
        set({mfa: next});
      })

// ── Render router ─────────────────────────────────────
function render(){
  const key = S.view + '|' + (S.view==='app' ? S.page : '') + '|' + (S.mfaSetupRequired?'mfa':'');
  const samePlace = key === _lastRenderedKey;
  const y = _scrollRoot().scrollTop;

  const pgEl = document.getElementById('_pg');

  // ── Partial update: already in app, only swap page content ──
  if(S.view==='app' && pgEl){
    if(S.mfaSetupRequired){
      pgEl.innerHTML = renderMfaGate();
      bind();
      _lastRenderedKey = key;
      return;
    }
    pgEl.innerHTML = renderPage();
    const titleEl = document.getElementById('app-page-title');
    const subEl = document.getElementById('app-page-sub');
    if(titleEl) titleEl.textContent = pageTitle();
    if(subEl) subEl.textContent = pageSubtitle();

    const navPage = S.page === 'user-detail' ? (S.userDetailReturn || 'users') : S.page;
    document.querySelectorAll('[data-nav]').forEach(a=>{
      const active = a.dataset.nav === navPage;
      a.className = `flex items-center px-6 py-3 cursor-pointer transition-all ease-in-out duration-200 ${active?'nav-active text-primary':'text-on-surface-variant hover:bg-white/50'}`;
    });

    const count = S.user?.role==='admin' ? (S.data.stats?.pending_role_requests||0) : 0;
    document.querySelectorAll('a[data-nav="role-requests"] span.ml-auto').forEach(b=>{
      b.textContent = count; b.style.display = count>0?'':'none';
    });

    bind();
    _lastRenderedKey = key;
    // Keep scroll when only data refreshed on the same page
    if(samePlace) requestAnimationFrame(()=>{ _scrollRoot().scrollTop = y; });
    else requestAnimationFrame(()=>{ _scrollRoot().scrollTop = 0; });
    return;
  }

  // ── Full render: view switch (landing/login/register/app) ───
  document.getElementById('app').innerHTML =
    S.view==='landing'  ? renderLanding()  :
    S.view==='login'    ? renderLogin()    :
    S.view==='register' ? renderRegister() :
    S.view==='mfa-gate' ? renderMfaGate()  :
    renderApp();
  bind();
  _lastRenderedKey = key;
  if(samePlace) requestAnimationFrame(()=>{ _scrollRoot().scrollTop = y; });
}

function renderDashboard(){
  const role=S.user.role, s=S.data.stats||{};
  if(!S.data.myRoleRequestsLoaded && role!=='admin') loadMyRoleRequest();
  const extra = role!=='admin' ? renderRoleUpgradeCompact() : '';
  if(role==='radiologist') return renderRadiologistDash(s) + extra;
  if(role==='patient')     return renderPatientDash(s) + extra;
  if(role==='clinic')      return renderClinicDash(s) + extra;
  if(role==='admin')       return renderAdminDash(s);
  return renderPatientDash(s) + extra;
}

function dashFirstName(){
  return (S.user?.name||'there').split(' ')[0];
}

function dashMetric(label, value, opts={}){
  const tone = opts.tone||'primary';
  const icon = opts.icon||'analytics';
  const color = ({primary:'text-primary',error:'text-error',tertiary:'text-tertiary',amber:'text-amber-600',muted:'text-on-surface'})[tone]||'text-primary';
  const tint  = ({primary:'bg-primary/10',error:'bg-error-container/70',tertiary:'bg-tertiary/10',amber:'bg-amber-100',muted:'bg-surface-container'})[tone]||'bg-primary/10';
  return `
  <div class="dash-metric flex items-center gap-3 min-w-0">
    <div class="w-10 h-10 rounded-xl ${tint} flex items-center justify-center flex-shrink-0">
      <span class="material-symbols-outlined ${color} text-[22px]" style="font-variation-settings:'FILL' 1">${icon}</span>
    </div>
    <div class="min-w-0">
      <p class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant truncate">${label}</p>
      <p class="text-xl font-extrabold ${color} leading-tight truncate">${value}</p>
    </div>
  </div>`;
}

function renderRoleUpgradeCompact(){
  const myReqs = S.data.myRoleRequests || [];
  const pending = myReqs.find(r=>r.status==='pending');
  const resolved = myReqs.find(r=>r.status==='approved'||r.status==='rejected');
  if(!pending && !resolved) return '';
  const ok = resolved && resolved.status==='approved';
  return `
  <div class="dash-panel !py-3 flex items-center gap-3 ${pending?'!border-amber-200 !bg-amber-50/80':ok?'!border-tertiary/25 !bg-[#e7f6ee]':'!border-error/20 !bg-error-container/40'}">
    <span class="material-symbols-outlined text-xl ${pending?'text-amber-600':ok?'text-tertiary':'text-error'}" style="font-variation-settings:'FILL' 1">${pending?'hourglass_top':ok?'check_circle':'cancel'}</span>
    <div class="min-w-0 flex-1">
      <p class="text-sm font-bold text-on-surface">${pending?'Role request pending':ok?'Role request approved':'Role request rejected'}</p>
      <p class="text-xs text-on-surface-variant truncate">${pending?'An admin will review your upgrade request.':ok?'Sign out and sign back in to use the new role.':'Contact admin@scanova.com if you need to ask again.'}</p>
    </div>
  </div>`;
}

function renderRadiologistDash(s){
  const allQueue = s.queue || [];
  const qItems   = allQueue.filter(q =>
    S.queueFilter==='ALL' || (q.type||'').toUpperCase().includes(S.queueFilter)
  );
  const throughput = s.throughput || [];
  const maxCount   = Math.max(1, ...throughput.map(t=>t.count));
  const todayStr   = new Date().toISOString().slice(0,10);
  const todayCount = throughput.find(t=>t.date===todayStr)?.count??0;

  function qTimingLabel(minsAgo){
    if(minsAgo < -60) return `in ${Math.round(-minsAgo/60)}h`;
    if(minsAgo < 0)   return `in ${-minsAgo}m`;
    if(minsAgo===0)   return 'now';
    if(minsAgo < 60)  return `${minsAgo}m ago`;
    return `${Math.round(minsAgo/60)}h ago`;
  }

  return `
  <section class="dash-hero px-5 py-3.5 md:px-6">
    <div class="relative z-10 flex flex-wrap items-end justify-between gap-3">
      <div class="min-w-0">
        <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-white/70">Radiologist workspace</p>

      </div>
      <div class="flex flex-wrap gap-2">
        <button type="button" onclick="navTo('scan')" class="dash-chip"><span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">radiology</span>Analyze scan</button>
        <button type="button" onclick="navTo('schedule')" class="dash-chip"><span class="material-symbols-outlined text-sm">event</span>Schedule</button>
        <button type="button" onclick="navTo('patients')" class="dash-chip"><span class="material-symbols-outlined text-sm">groups</span>Patients</button>
      </div>
    </div>
  </section>

  <section class="grid grid-cols-2 xl:grid-cols-4 gap-3">
    ${dashMetric('Scheduled', s.pending_scans??0, {icon:'event_upcoming', tone:'primary'})}
    ${dashMetric('Total scans', s.total_scans??0, {icon:'image', tone:'muted'})}
    ${dashMetric('High risk', s.critical_finds??0, {icon:'priority_high', tone:'error'})}
    ${dashMetric('Today', todayCount, {icon:'today', tone:'tertiary'})}
  </section>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="md:col-span-2 dash-panel flex flex-col min-h-0">
      <div class="flex justify-between items-center mb-3 flex-wrap gap-2">
        <div>
          <h3 class="text-base font-extrabold text-on-surface">Appointment queue</h3>
          <p class="text-[11px] text-on-surface-variant">Tap a row to open the schedule</p>

        <div class="flex gap-1 flex-wrap">
          ${['ALL','MAMMOGRAPHY','MRI','ULTRASOUND'].map(f=>`
          <button onclick="set({queueFilter:'${f}'})" class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition-colors ${S.queueFilter===f?'bg-primary text-on-primary':'bg-surface-container text-on-surface-variant hover:bg-secondary-container'}">${f==='MAMMOGRAPHY'?'Mammo':f==='ULTRASOUND'?'US':f}</button>`).join('')}
        </div>
      </div>
      <div class="space-y-1.5 ${qItems.length>5?'max-h-[240px] overflow-y-auto pr-1':''}">
        ${qItems.length===0?`
        <div class="text-center py-8 rounded-xl bg-surface-container-low/80">
          <span class="material-symbols-outlined text-3xl text-primary/40 mb-2 block">event_available</span>
          <p class="text-sm font-semibold text-on-surface">${allQueue.length===0?'No upcoming appointments':'No appointments match this filter'}</p>

              <p class="text-[10px] text-on-surface-variant/60 mt-0.5">${qTimingLabel(q.mins_ago)}</p>

        <span class="text-[10px] font-bold text-tertiary bg-tertiary/10 px-2 py-0.5 rounded-full">7 days</span>
      </div>
      ${throughput.length===0?`<p class="text-xs text-on-surface-variant text-center py-10">No scan data yet</p>`:`
      <div class="h-28 flex items-end gap-1.5">
        ${throughput.map(t=>{
          const pct = maxCount>0 ? Math.round((t.count/maxCount)*100) : 0;
          const isToday = t.date===todayStr;
          const barH = t.count>0 ? Math.max(pct,10) : 0;
          return `<div class="flex-1 flex flex-col items-center justify-end gap-1" style="height:100%">
            <span class="text-[9px] font-bold text-on-surface-variant/70">${t.count>0?t.count:''}</span>

          </div>`;
        }).join('')}
      </div>
      <div class="flex justify-between mt-2 text-[9px] font-bold text-on-surface-variant/55 uppercase tracking-wide">
        ${throughput.map(t=>`<span class="${t.date===todayStr?'text-primary':''}">${t.day}</span>`).join('')}
      </div>`}
    </div>
  </div>
  ${renderRadioExternalValidation(s)}`;
}

// ── Riskometer SVG gauge ──────────────────────────────
function riskFromProbability(prob){
  const p = Number(prob);
  if(!Number.isFinite(p)) return 'unknown';
  if(p > 70) return 'high';
  if(p > 40) return 'medium';
  return 'low';
}

/** Point on gauge arc. t∈[0,1]: 0=LOW(left), 1=HIGH(right). cx,cy = pivot. */
function _gaugePt(t, cx, cy, r){
  const ang = Math.PI - t * Math.PI; // π → 0
  return {
    x: +(cx + r * Math.cos(ang)).toFixed(2),
    y: +(cy - r * Math.sin(ang)).toFixed(2),
  };
}

function renderRiskometer(risk, prob){
  const raw = Number(prob);
  const hasProb = Number.isFinite(raw);
  const p = hasProb ? Math.min(100, Math.max(0, raw)) : 0;
  const derived = hasProb ? riskFromProbability(p) : 'unknown';
  const effective = (derived !== 'unknown') ? derived : (risk || 'unknown');
  const uid = 'rm' + Math.random().toString(36).slice(2, 8);

  // Geometry
  const CX = 120, CY = 118, R = 86, NR = 68;
  // Needle: 0% → -90° (left), 50% → 0° (up), 100% → +90° (right)
  const angle = -90 + (p / 100) * 180;
  const left = _gaugePt(0, CX, CY, R);
  const right = _gaugePt(1, CX, CY, R);
  const lo = _gaugePt(0.40, CX, CY, R);
  const hi = _gaugePt(0.70, CX, CY, R);
  // Label anchors slightly outside the stroke
  const loLab = _gaugePt(0.40, CX, CY, R + 16);
  const hiLab = _gaugePt(0.70, CX, CY, R + 16);
  const midLab = _gaugePt(0.55, CX, CY, R + 18);

  const col = ({
    high:    {stroke:'#ef4444', text:'text-red-600',    bg:'from-red-50/80 to-rose-50/50',      border:'border-red-200/70'},
    medium:  {stroke:'#f59e0b', text:'text-amber-600',  bg:'from-amber-50/80 to-yellow-50/50',  border:'border-amber-200/70'},
    low:     {stroke:'#10b981', text:'text-emerald-600',bg:'from-emerald-50/80 to-teal-50/50',  border:'border-emerald-200/70'},
    unknown: {stroke:'#9ca3af', text:'text-gray-500',   bg:'from-gray-50/80 to-slate-50/50',    border:'border-gray-200/70'},
  })[effective] || {stroke:'#9ca3af',text:'text-gray-500',bg:'from-gray-50',border:'border-gray-200/60'};

  const riskLabel = ({high:'High Risk',medium:'Medium Risk',low:'Low Risk',unknown:'No Data'})[effective]||effective;
  const riskMsg   = ({
    high:    'Requires prompt medical attention',
    medium:  'Further evaluation recommended',
    low:     'Within normal range — keep screening',
    unknown: 'Upload a scan to see your risk level',
  })[effective]||'';

  // Sweep needle with CSS transform (SVG attribute transforms don't animate)
  setTimeout(()=>{
    const g = document.getElementById(uid + '-g');
    if(!g) return;
    g.style.transformOrigin = `${CX}px ${CY}px`;
    g.style.transformBox = 'view-box';
    g.style.transition = 'transform 1.1s cubic-bezier(.22,1,.36,1)';
    requestAnimationFrame(()=>{ g.style.transform = `rotate(${angle}deg)`; });
  }, 30);

  return `
  <div id="${uid}-w" class="bg-gradient-to-br ${col.bg} rounded-2xl p-5 border ${col.border} shadow-sm">
    <div class="flex items-center justify-between mb-1">
      <h4 class="font-extrabold text-on-surface text-xs uppercase tracking-widest flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1">speed</span>Risk Meter
      </h4>
      <span class="text-xs font-bold ${col.text} bg-white/80 rounded-full px-3 py-1 border ${col.border}">${riskLabel}</span>
    </div>
    <div class="flex flex-col items-center">
      <svg viewBox="0 0 240 168" class="w-full max-w-[280px] select-none" overflow="visible" aria-label="Risk meter ${hasProb?Math.round(p)+'%':''}">
        <!-- Track -->
        <path d="M ${left.x} ${left.y} A ${R} ${R} 0 0 1 ${right.x} ${right.y}"
          stroke="rgba(0,0,0,0.06)" stroke-width="18" fill="none" stroke-linecap="butt"/>
        <!-- Zones (butt caps so segments meet cleanly) -->
        <path d="M ${left.x} ${left.y} A ${R} ${R} 0 0 1 ${lo.x} ${lo.y}"
          stroke="#10b981" stroke-width="16" fill="none" stroke-linecap="butt" opacity="0.9"/>
        <path d="M ${lo.x} ${lo.y} A ${R} ${R} 0 0 1 ${hi.x} ${hi.y}"
          stroke="#f59e0b" stroke-width="16" fill="none" stroke-linecap="butt" opacity="0.9"/>
        <path d="M ${hi.x} ${hi.y} A ${R} ${R} 0 0 1 ${right.x} ${right.y}"
          stroke="#ef4444" stroke-width="16" fill="none" stroke-linecap="butt" opacity="0.9"/>
        <!-- Soft end caps -->
        <circle cx="${left.x}" cy="${left.y}" r="8" fill="#10b981"/>
        <circle cx="${right.x}" cy="${right.y}" r="8" fill="#ef4444"/>
        <!-- Threshold ticks -->
        <circle cx="${lo.x}" cy="${lo.y}" r="3.5" fill="#fff" stroke="#10b981" stroke-width="2"/>
        <circle cx="${hi.x}" cy="${hi.y}" r="3.5" fill="#fff" stroke="#ef4444" stroke-width="2"/>
        <!-- Zone labels outside arc -->
        <text x="${left.x - 2}" y="${left.y + 18}" font-size="9" font-weight="800" fill="#10b981" text-anchor="middle">LOW</text>
        <text x="${midLab.x}" y="${midLab.y}" font-size="9" font-weight="800" fill="#f59e0b" text-anchor="middle">MED</text>
        <text x="${right.x + 2}" y="${right.y + 18}" font-size="9" font-weight="800" fill="#ef4444" text-anchor="middle">HIGH</text>
        <text x="${loLab.x}" y="${loLab.y}" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">40%</text>
        <text x="${hiLab.x}" y="${hiLab.y}" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">70%</text>
        <!-- Needle starts at LOW (-90°); CSS rotates to target -->
        <g id="${uid}-g" style="transform-origin:${CX}px ${CY}px; transform-box:view-box; transform:rotate(-90deg)">
          <line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - NR}"
            stroke="${col.stroke}" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="${CX}" cy="${CY - NR}" r="5" fill="${col.stroke}" stroke="#fff" stroke-width="1.5"/>
        </g>
        <!-- Hub -->
        <circle cx="${CX}" cy="${CY}" r="11" fill="${col.stroke}"/>
        <circle cx="${CX}" cy="${CY}" r="5.5" fill="#fff"/>
        <!-- Value below pivot — never overlaps the needle tip -->
        <text x="${CX}" y="${CY + 32}" font-size="26" font-weight="900" fill="${col.stroke}"
          text-anchor="middle" font-family="system-ui,sans-serif">${hasProb?Math.round(p):'—'}${hasProb?'%':''}</text>
        <text x="${CX}" y="${CY + 46}" font-size="7.5" font-weight="600" fill="rgba(0,0,0,0.38)"
          text-anchor="middle" letter-spacing="0.06em">MALIGNANCY PROBABILITY</text>
      </svg>
      <p class="text-xs text-on-surface-variant font-medium text-center -mt-1">${riskMsg}</p>
      <p class="text-[10px] text-on-surface-variant/50 text-center mt-0.5">Zones: Low ≤40% · Medium 40–70% · High &gt;70%</p>
    </div>
  </div>`;
}

// ── Role upgrade card (for non-admin users in their dashboard) ────────────
function renderRoleUpgradeCard(){
  const myReqs    = S.data.myRoleRequests || [];
  const pending   = myReqs.find(r=>r.status==='pending');
  const resolved  = myReqs.find(r=>r.status==='approved'||r.status==='rejected');
  const roleLabels= {radiologist:'Radiologist',clinic:'Clinic / Hospital',admin:'Administrator'};
  // available upgrade targets (exclude current role)
  const upgradable= ['radiologist','clinic','admin'].filter(r=>r!==S.user.role);
  if(!upgradable.length) return '';  // already admin or no upgrades possible
  if(!upgradable.includes(S.roleReqRole)) S.roleReqRole = upgradable[0];

  // ── If a request was already resolved, show final status only — no form ──
  if(resolved){
    const approved = resolved.status==='approved';
    return `
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10 mt-2">
      <h3 class="text-lg font-bold text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined ${approved?'text-tertiary':'text-error'}">verified_user</span>Role Upgrade Request
      </h3>
      <div class="flex items-start gap-4 ${approved?'bg-green-50 border-green-200':'bg-error-container/30 border-error/20'} border rounded-xl px-5 py-5">
        <span class="material-symbols-outlined ${approved?'text-tertiary':'text-error'} text-3xl mt-0.5" style="font-variation-settings:'FILL' 1">${approved?'check_circle':'cancel'}</span>
        <div class="flex-1">
          <p class="font-bold ${approved?'text-tertiary':'text-error'} text-sm">${approved?'Request Approved':'Request Rejected'}</p>
          <p class="text-sm text-on-surface-variant mt-1">
            ${approved
              ? `Your request for <strong>${roleLabels[resolved.requested_role]||resolved.requested_role}</strong> access was approved by the admin.`
              : `Your request for <strong>${roleLabels[resolved.requested_role]||resolved.requested_role}</strong> access was not approved.`}
            ${resolved.admin_notes?`<br/><em class="text-xs">"${resolved.admin_notes}"</em>`:''}
          </p>
          ${approved?`
          <p class="text-xs text-on-surface-variant/70 mt-2">Please <strong>sign out and sign back in</strong> to activate your new access level.</p>`:`
          <p class="text-xs text-on-surface-variant/70 mt-2">To request again, please contact the admin directly.</p>
          <a href="mailto:admin@scanova.com" class="inline-flex items-center gap-1.5 mt-2 text-sm font-bold text-primary hover:underline">
            <span class="material-symbols-outlined text-base">mail</span>admin@scanova.com
          </a>`}
        </div>
      </div>
    </div>`;
  }

  // ── 1-hour window check ──────────────────────────────
  const createdAt   = S.user.created ? new Date(S.user.created.replace(' ','T')+'Z') : null;
  const msElapsed   = createdAt ? (Date.now() - createdAt.getTime()) : Infinity;
  const windowOpen  = msElapsed <= 60 * 60 * 1000;
  const minutesLeft = windowOpen ? Math.ceil((60*60*1000 - msElapsed) / 60000) : 0;

  // ── Window expired with no request ever made ─────────
  if(!windowOpen && !pending){
    return `
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10 mt-2">
      <h3 class="text-lg font-bold text-on-surface mb-1 flex items-center gap-2">
        <span class="material-symbols-outlined text-on-surface-variant">verified_user</span>Request Role Upgrade
      </h3>
      <div class="flex items-start gap-4 bg-amber-50 border border-amber-200 rounded-xl px-5 py-5 mt-4">
        <span class="material-symbols-outlined text-amber-600 text-2xl mt-0.5">schedule</span>
        <div>
          <p class="font-bold text-amber-700 text-sm">Upgrade window expired</p>
          <p class="text-sm text-amber-600 mt-1 leading-relaxed">The 1-hour self-service window for role upgrade requests has passed. Please contact the admin directly.</p>
          <a href="mailto:admin@scanova.com" class="inline-flex items-center gap-1.5 mt-3 text-sm font-bold text-primary hover:underline">
            <span class="material-symbols-outlined text-base">mail</span>admin@scanova.com
          </a>
        </div>
      </div>
    </div>`;
  }

  // ── Pending request ───────────────────────────────────
  if(pending){
    return `
    <div class="bg-surface-container-lowest rounded-2xl p-8 shadow-sm border border-outline-variant/10 mt-2">
      <h3 class="text-lg font-bold text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-amber-500">verified_user</span>Role Upgrade Request
      </h3>
      <div class="flex items-center gap-4 bg-amber-50 border border-amber-200 rounded-xl px-5 py-4">
        <span class="material-symbols-outlined text-amber-600 text-2xl">hourglass_top</span>
        <div>
          <p class="font-bold text-amber-700 text-sm">Request Pending</p>
          <p class="text-xs text-amber-600 mt-0.5">Awaiting admin approval for <strong>${roleLabels[pending.requested_role]||pending.requested_role}</strong> role · submitted ${timeAgo(pending.created)}</p>
        </div>
      </div>
    </div>`;
  }

  // ── No request yet — show the form ───────────────────
  return `

    },
    retraction: {
      title: 'Nipple changes (retraction)',
      what:  'A nipple that suddenly turns inward can be related to infection, scarring, or other changes.',

    },
    discharge: {
      title: 'Nipple discharge',

    },
    rash: {
      title: 'Redness or rash',

    },
    swelling: {
      title: 'Swelling',

      help:  'Get checked if swelling is sudden, one-sided, painful, or comes with redness or fever.'
    },
    pain: {
      title: 'Pain or tenderness',
      what:  'Breast pain is common and is often linked to hormones, muscle strain, or cysts.',
      help:  'Get checked if pain is new, one-sided, severe, or you also notice a lump, discharge, or skin changes.'
    },
    thickened: {
      title: 'Thickened area',
      what:  'A thickened patch of tissue may be benign, but a new or changing area should be assessed.',
      help:  'Get checked if it persists, grows, or feels firm compared to the other side.'
    },
    size_shape: {
      title: 'Change in size or shape',
      what:  'Changes can happen for many reasons. Persistent one-sided changes are worth checking.',
      help:  'Get checked if it is new and does not settle, or if it comes with skin or nipple changes.'
    },
  };

  function closeAll(){
    document.querySelectorAll('[data-aware-detail]').forEach(d=>{
      d.classList.remove('open');
      d.innerHTML = '';
    });
    document.querySelectorAll('[data-aware]').forEach(b=>{
      b.parentElement?.classList?.remove('aware-open');
    });
  }

  document.addEventListener('click', function(e){
    const btn = e.target.closest('[data-aware]');
    if(!btn) return;
    const k = btn.getAttribute('data-aware');
    const item = info[k];
    if(!item) return;
    e.preventDefault();

    const panel = btn.parentElement?.querySelector?.(`[data-aware-detail="${k}"]`);
    if(!panel) return;

    const isOpen = panel.classList.contains('open');
    closeAll();
    if(isOpen) return;

    panel.innerHTML = `
      <div class="space-y-3 text-sm text-on-surface-variant leading-relaxed">
        <p><strong class="text-on-surface">${item.title}:</strong> ${item.what}</p>

          <p class="text-sm text-on-surface-variant">${item.help}</p>
        </div>
      </div>`;
    panel.classList.add('open');
    btn.parentElement?.classList?.add('aware-open');
  });
})();

  // Suggested starter questions — role-aware
  const isAdmin = S.user?.role==='admin';
  const scanStyle = isAdmin ? (S.scanChatStyle||'normal') : 'normal';

  const starters = isAdvancedMode ? [
    'Interpret the confidence and epistemic uncertainty',
    'What BI-RADS category does this map to?',
    'Explain SHAP attribution across modalities',
    'Differential diagnoses to consider?',
    'Recommended follow-up protocol?',

    'What should I do next?',

    <div class="px-4 py-2 flex gap-2 overflow-x-auto border-t border-outline-variant/10 flex-shrink-0">
      ${starters.slice(0,3).map(q=>`
      <button onclick="sendChatMessage('${q.replace(/'/g,"\\'")}');document.getElementById('chat-input').value='';" class="text-[10px] whitespace-nowrap bg-surface-container text-on-surface-variant px-2.5 py-1 rounded-full hover:bg-secondary-container hover:text-on-secondary-container transition-all font-medium flex-shrink-0">${q}</button>`).join('')}
    </div>`:''}

    <!-- Input -->
    <div class="px-4 py-3 border-t border-outline-variant/10 flex gap-2 items-end flex-shrink-0 bg-surface-container-low">
      <textarea id="chat-input" rows="1" placeholder="Ask about your scan results..." class="flex-1 bg-surface-container-lowest border border-outline-variant/20 rounded-xl px-4 py-2.5 text-sm text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/20 resize-none leading-relaxed" style="min-height:40px;max-height:100px" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
      <button id="chat-send-btn" class="bloom-gradient ripple-btn text-on-primary w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 hover:opacity-90 active:scale-95 transition-all ${loading?'opacity-50 cursor-wait':''}">
        <span class="material-symbols-outlined text-lg">send</span>
      </button>
    </div>
  </div>`;
}

    <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-3">Analysis Result</p>
    <div class="text-2xl font-bold ${r.prediction==='malignant'?'text-error':'text-tertiary'} mb-3">

      <div class="bg-surface-container-low p-3 rounded-xl text-center"><div class="text-xl font-bold text-primary">${r.confidence}%</div><div class="text-[10px] text-on-surface-variant mt-1">Confidence</div></div>
      <div class="bg-surface-container-low p-3 rounded-xl text-center"><div class="text-xl font-bold text-primary">±${r.uncertainty}%</div><div class="text-[10px] text-on-surface-variant mt-1">Uncertainty</div></div>
